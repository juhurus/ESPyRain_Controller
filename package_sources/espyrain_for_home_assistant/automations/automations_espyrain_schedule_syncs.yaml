            31
          {% elif days_mode == 'Weekends (Sat-Sun)' %}
            96
          {% elif days_mode == 'Odd Days (1,3,5...)' %}
            127
          {% elif days_mode == 'Even Days (2,4,6...)' %}
            127
          {% elif days_mode == 'Selected Days' %}
            {{
              (1 if is_state('input_boolean.espyrain_schedule_3_monday', 'on') else 0) +
              (2 if is_state('input_boolean.espyrain_schedule_3_tuesday', 'on') else 0) +
              (4 if is_state('input_boolean.espyrain_schedule_3_wednesday', 'on') else 0) +
              (8 if is_state('input_boolean.espyrain_schedule_3_thursday', 'on') else 0) +
              (16 if is_state('input_boolean.espyrain_schedule_3_friday', 'on') else 0) +
              (32 if is_state('input_boolean.espyrain_schedule_3_saturday', 'on') else 0) +
              (64 if is_state('input_boolean.espyrain_schedule_3_sunday', 'on') else 0)
            }}
          {% elif 'Every' in days_mode and 'Days' in days_mode %}
            0
          {% else %}
            0
          {% endif %}

