# ================================================================
# REFRESH FORECAST ON SCHEDULE CHANGE
# ================================================================
- id: refresh_forecast_on_schedule_change
  alias: "ESPyRain: Refresh Forecast on Schedule Change"
  description: "Handle Refresh Forecast on Schedule Change."
  trigger:
    - platform: state
      entity_id:
        - input_boolean.espyrain_schedule_1_enabled
        - input_boolean.espyrain_schedule_2_enabled
        - input_boolean.espyrain_schedule_3_enabled
        - input_boolean.espyrain_schedule_4_enabled
        - input_boolean.espyrain_schedule_5_enabled
        - input_boolean.espyrain_schedule_6_enabled
        - input_boolean.espyrain_schedule_7_enabled
        - input_boolean.espyrain_schedule_8_enabled
        - input_select.espyrain_schedule_1_days
        - input_select.espyrain_schedule_2_days
        - input_select.espyrain_schedule_3_days
        - input_select.espyrain_schedule_4_days
        - input_select.espyrain_schedule_5_days
        - input_select.espyrain_schedule_6_days
        - input_select.espyrain_schedule_7_days
        - input_select.espyrain_schedule_8_days
        - input_number.espyrain_schedule_1_interval
        - input_number.espyrain_schedule_2_interval
        - input_number.espyrain_schedule_3_interval
        - input_number.espyrain_schedule_4_interval
        - input_number.espyrain_schedule_5_interval
        - input_number.espyrain_schedule_6_interval
        - input_number.espyrain_schedule_7_interval
        - input_number.espyrain_schedule_8_interval
  action:
    - delay: 2  # Wait for ESP to sync
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.espyrain_7_day_forecast

# ================================================================
# SYNC DAY MODE TYPE TO ESP
# ================================================================
- id: espyrain_sync_schedule_day_mode_type_to_esp
  alias: "ESPyRain: Sync Day Mode Type to ESP"
  description: "Legacy v1 automation retained as no-op (v2 uses day_mode entities directly)"
  trigger:
    # Trigger when any schedule's day mode changes
    - platform: state
      entity_id:
        - input_select.espyrain_schedule_1_days
        - input_select.espyrain_schedule_2_days
        - input_select.espyrain_schedule_3_days
        - input_select.espyrain_schedule_4_days
        - input_select.espyrain_schedule_5_days
        - input_select.espyrain_schedule_6_days
        - input_select.espyrain_schedule_7_days
        - input_select.espyrain_schedule_8_days
  condition:
    - condition: state
      entity_id: input_boolean.espyrain_sync_lock
      state: "off"
  action:
    - service: logbook.log
      data:
        name: Sprinkler
        message: "Legacy day_mode_type sync ignored; v2 uses schedule day_mode sync automations."

# ================================================================
# SYNC ALL SETTINGS ON ANY ENABLE
# ================================================================
- id: espyrain_sync_all_on_any_enable
  alias: "ESPyRain: Sync All Settings On Any Enable"
  description: "Sync all schedule settings when any schedule is enabled"
  trigger:
    - platform: state
      entity_id:
        - input_boolean.espyrain_schedule_1_enabled
        - input_boolean.espyrain_schedule_2_enabled
        - input_boolean.espyrain_schedule_3_enabled
        - input_boolean.espyrain_schedule_4_enabled
        - input_boolean.espyrain_schedule_5_enabled
        - input_boolean.espyrain_schedule_6_enabled
        - input_boolean.espyrain_schedule_7_enabled
        - input_boolean.espyrain_schedule_8_enabled
      to: 'on'
  condition:
    - condition: state
      entity_id: input_boolean.espyrain_sync_lock
      state: "off"
  action:
    - delay:
        milliseconds: 500

    # Force sync ALL intervals
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_1_interval
      data:
        value: "{{ states('input_number.espyrain_schedule_1_interval') | int }}"

    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_2_interval
      data:
        value: "{{ states('input_number.espyrain_schedule_2_interval') | int }}"

    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_3_interval
      data:
        value: "{{ states('input_number.espyrain_schedule_3_interval') | int }}"

    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_4_interval
      data:
        value: "{{ states('input_number.espyrain_schedule_4_interval') | int }}"

    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_5_interval
      data:
        value: "{{ states('input_number.espyrain_schedule_5_interval') | int }}"

    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_6_interval
      data:
        value: "{{ states('input_number.espyrain_schedule_6_interval') | int }}"

    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_7_interval
      data:
        value: "{{ states('input_number.espyrain_schedule_7_interval') | int }}"

    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_8_interval
      data:
        value: "{{ states('input_number.espyrain_schedule_8_interval') | int }}"

    # Trigger all bitmask sync automations
    - service: automation.trigger
      target:
        entity_id:
          - automation.espyrain_sync_schedule_1_days_bitmask
          - automation.espyrain_sync_schedule_2_days_bitmask
          - automation.espyrain_sync_schedule_3_days_bitmask
          - automation.espyrain_sync_schedule_4_days_bitmask
          - automation.espyrain_sync_schedule_5_days_bitmask
