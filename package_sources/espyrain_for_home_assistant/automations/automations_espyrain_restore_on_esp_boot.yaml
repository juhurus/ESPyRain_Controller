# ================================================================
#
#                ESP Boot Restore Automations
#
# ================================================================
# Saved as: config/package_sources/espyrain_for_home_assistant/automations/automations_espyrain_restore_on_esp_boot.yaml

# ================================================================
# SYNC STATION ENABLED FROM ESP ON RECONNECT
# Pull the live ESP station enabled state into HA helpers first so
# reconnect restore logic preserves direct user changes made on the ESP.
# ================================================================
- id: espyrain_sync_station_enabled_from_esp_on_reconnect
  alias: "ESPyRain: Sync Station Enabled from ESP on Reconnect"
  description: "When ESP comes online, copy live ESP station enabled states into HA helpers before restore actions run"
  trigger:
    - platform: state
      entity_id: binary_sensor.espyrain_controller_ha_link
      to: 'on'
      for:
        seconds: 2
  condition:
    - condition: template
      value_template: >
        {{ trigger.from_state.state in ['off', 'unknown', 'unavailable'] or trigger.from_state is none }}
  action:
    - delay:
        seconds: 1
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.espyrain_sync_lock
    - service: "input_boolean.turn_{{ states('switch.espyrain_controller_station_1_enabled') }}"
      target:
        entity_id: input_boolean.espyrain_station_1_enabled
      continue_on_error: true
    - service: "input_boolean.turn_{{ states('switch.espyrain_controller_station_2_enabled') }}"
      target:
        entity_id: input_boolean.espyrain_station_2_enabled
      continue_on_error: true
    - service: "input_boolean.turn_{{ states('switch.espyrain_controller_station_3_enabled') }}"
      target:
        entity_id: input_boolean.espyrain_station_3_enabled
      continue_on_error: true
    - service: "input_boolean.turn_{{ states('switch.espyrain_controller_station_4_enabled') }}"
      target:
        entity_id: input_boolean.espyrain_station_4_enabled
      continue_on_error: true
    - service: "input_boolean.turn_{{ states('switch.espyrain_controller_station_5_enabled') }}"
      target:
        entity_id: input_boolean.espyrain_station_5_enabled
      continue_on_error: true
    - service: "input_boolean.turn_{{ states('switch.espyrain_controller_station_6_enabled') }}"
      target:
        entity_id: input_boolean.espyrain_station_6_enabled
      continue_on_error: true
    - service: "input_boolean.turn_{{ states('switch.espyrain_controller_station_7_enabled') }}"
      target:
        entity_id: input_boolean.espyrain_station_7_enabled
      continue_on_error: true
    - service: "input_boolean.turn_{{ states('switch.espyrain_controller_station_8_enabled') }}"
      target:
        entity_id: input_boolean.espyrain_station_8_enabled
      continue_on_error: true
    - service: "input_boolean.turn_{{ states('switch.espyrain_controller_station_9_enabled') }}"
      target:
        entity_id: input_boolean.espyrain_station_9_enabled
      continue_on_error: true
    - service: "input_boolean.turn_{{ states('switch.espyrain_controller_station_10_enabled') }}"
      target:
        entity_id: input_boolean.espyrain_station_10_enabled
      continue_on_error: true
    - service: "input_boolean.turn_{{ states('switch.espyrain_controller_station_11_enabled') }}"
      target:
        entity_id: input_boolean.espyrain_station_11_enabled
      continue_on_error: true
    - service: "input_boolean.turn_{{ states('switch.espyrain_controller_station_12_enabled') }}"
      target:
        entity_id: input_boolean.espyrain_station_12_enabled
      continue_on_error: true
    - service: "input_boolean.turn_{{ states('switch.espyrain_controller_station_13_enabled') }}"
      target:
        entity_id: input_boolean.espyrain_station_13_enabled
      continue_on_error: true
    - service: "input_boolean.turn_{{ states('switch.espyrain_controller_station_14_enabled') }}"
      target:
        entity_id: input_boolean.espyrain_station_14_enabled
      continue_on_error: true
    - service: "input_boolean.turn_{{ states('switch.espyrain_controller_station_15_enabled') }}"
      target:
        entity_id: input_boolean.espyrain_station_15_enabled
      continue_on_error: true
    - service: "input_boolean.turn_{{ states('switch.espyrain_controller_station_16_enabled') }}"
      target:
        entity_id: input_boolean.espyrain_station_16_enabled
      continue_on_error: true
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.espyrain_sync_lock
    - service: system_log.write
      data:
        level: info
        message: "ESPyRain: Synced 16 station enabled states from ESP to HA helpers after reconnect."

# ================================================================
# RESTORE BOOLEAN STATE ON ESP BOOT
# ================================================================
- id: espyrain_restore_on_esp_boot
  alias: "ESPyRain: Restore Boolean State on ESP Boot"
  description: "When ESP comes online, restore station_enabled helper states to the ESP station switches"
  trigger:
    - platform: state
      entity_id: binary_sensor.espyrain_controller_ha_link
      to: 'on'
      for:
        seconds: 2
  condition:
    - condition: template
      value_template: >
        {{ trigger.from_state.state in ['off', 'unknown', 'unavailable'] or trigger.from_state is none }}
  action:
    # Allow ESP state sync above to complete first, then restore helpers back to ESP.
    - delay:
        seconds: 5

# ================================================================
    # Restore all 16 station enabled states
# ================================================================

    # Station 1
    - service: "switch.turn_{{ states('input_boolean.espyrain_station_1_enabled') }}"
      target:
        entity_id: switch.espyrain_controller_station_1_enabled
      continue_on_error: true

    # Station 2
    - service: "switch.turn_{{ states('input_boolean.espyrain_station_2_enabled') }}"
      target:
        entity_id: switch.espyrain_controller_station_2_enabled
      continue_on_error: true

    # Station 3
    - service: "switch.turn_{{ states('input_boolean.espyrain_station_3_enabled') }}"
      target:
        entity_id: switch.espyrain_controller_station_3_enabled
      continue_on_error: true

    # Station 4
    - service: "switch.turn_{{ states('input_boolean.espyrain_station_4_enabled') }}"
      target:
        entity_id: switch.espyrain_controller_station_4_enabled
      continue_on_error: true

    # Station 5
    - service: "switch.turn_{{ states('input_boolean.espyrain_station_5_enabled') }}"
      target:
        entity_id: switch.espyrain_controller_station_5_enabled
      continue_on_error: true

    # Station 6
    - service: "switch.turn_{{ states('input_boolean.espyrain_station_6_enabled') }}"
      target:
        entity_id: switch.espyrain_controller_station_6_enabled
      continue_on_error: true

    # Station 7
    - service: "switch.turn_{{ states('input_boolean.espyrain_station_7_enabled') }}"
      target:
        entity_id: switch.espyrain_controller_station_7_enabled
      continue_on_error: true

    # Station 8
    - service: "switch.turn_{{ states('input_boolean.espyrain_station_8_enabled') }}"
      target:
        entity_id: switch.espyrain_controller_station_8_enabled
      continue_on_error: true

    # Station 9
    - service: "switch.turn_{{ states('input_boolean.espyrain_station_9_enabled') }}"
      target:
        entity_id: switch.espyrain_controller_station_9_enabled
      continue_on_error: true

    # Station 10
    - service: "switch.turn_{{ states('input_boolean.espyrain_station_10_enabled') }}"
      target:
        entity_id: switch.espyrain_controller_station_10_enabled
      continue_on_error: true

    # Station 11
    - service: "switch.turn_{{ states('input_boolean.espyrain_station_11_enabled') }}"
      target:
        entity_id: switch.espyrain_controller_station_11_enabled
      continue_on_error: true

    # Station 12
    - service: "switch.turn_{{ states('input_boolean.espyrain_station_12_enabled') }}"
      target:
        entity_id: switch.espyrain_controller_station_12_enabled
      continue_on_error: true

    # Station 13
    - service: "switch.turn_{{ states('input_boolean.espyrain_station_13_enabled') }}"
      target:
        entity_id: switch.espyrain_controller_station_13_enabled
      continue_on_error: true

    # Station 14
    - service: "switch.turn_{{ states('input_boolean.espyrain_station_14_enabled') }}"
      target:
        entity_id: switch.espyrain_controller_station_14_enabled
      continue_on_error: true

    # Station 15
    - service: "switch.turn_{{ states('input_boolean.espyrain_station_15_enabled') }}"
      target:
        entity_id: switch.espyrain_controller_station_15_enabled
      continue_on_error: true

    # Station 16
    - service: "switch.turn_{{ states('input_boolean.espyrain_station_16_enabled') }}"
      target:
        entity_id: switch.espyrain_controller_station_16_enabled
      continue_on_error: true

    - service: system_log.write
      data:
        level: info
        message: "ESPyRain: Restored 16 station enabled states from HA helpers after ESP boot."

# ================================================================
# KEEP HELPERS IN SYNC WITH ESP (HA -> ESP on change)
# These automations sync the HA input_booleans to the ESP when changed.
# ================================================================

# ================================================================
# SYNC STATION ENABLED TO ESP (HA CHANGE)
# ================================================================
- id: espyrain_sync_station_enabled_to_esp
  alias: "ESPyRain: Sync Station Enabled to ESP (HA Change)"
  description: "When HA input_boolean station_X_enabled changes, update ESP switch"
  trigger:
    - platform: state
      entity_id:
        - input_boolean.espyrain_station_1_enabled
        - input_boolean.espyrain_station_2_enabled
        - input_boolean.espyrain_station_3_enabled
        - input_boolean.espyrain_station_4_enabled
        - input_boolean.espyrain_station_5_enabled
        - input_boolean.espyrain_station_6_enabled
        - input_boolean.espyrain_station_7_enabled
        - input_boolean.espyrain_station_8_enabled
        - input_boolean.espyrain_station_9_enabled
        - input_boolean.espyrain_station_10_enabled
        - input_boolean.espyrain_station_11_enabled
        - input_boolean.espyrain_station_12_enabled
        - input_boolean.espyrain_station_13_enabled
        - input_boolean.espyrain_station_14_enabled
        - input_boolean.espyrain_station_15_enabled
        - input_boolean.espyrain_station_16_enabled
  condition:
    - condition: state
      entity_id: input_boolean.espyrain_sync_lock
      state: 'off'
  action:
    - variables:
        station_num: "{{ trigger.entity_id | regex_findall('station_(\\d+)') | first }}"
    - service: "switch.turn_{{ trigger.to_state.state }}"
      target:
        entity_id: "switch.espyrain_controller_station_{{ station_num }}_enabled"
      continue_on_error: true

# ================================================================
# SYNC STATION ENABLED FROM ESP (DIRECT ESP/DASHBOARD CHANGE)
# ================================================================
- id: espyrain_sync_station_enabled_from_esp
  alias: "ESPyRain: Sync Station Enabled from ESP"
  description: "When an ESP station enabled switch changes directly, update the matching HA helper"
  trigger:
    - platform: state
      entity_id:
        - switch.espyrain_controller_station_1_enabled
        - switch.espyrain_controller_station_2_enabled
        - switch.espyrain_controller_station_3_enabled
        - switch.espyrain_controller_station_4_enabled
        - switch.espyrain_controller_station_5_enabled
        - switch.espyrain_controller_station_6_enabled
        - switch.espyrain_controller_station_7_enabled
        - switch.espyrain_controller_station_8_enabled
        - switch.espyrain_controller_station_9_enabled
        - switch.espyrain_controller_station_10_enabled
        - switch.espyrain_controller_station_11_enabled
        - switch.espyrain_controller_station_12_enabled
        - switch.espyrain_controller_station_13_enabled
        - switch.espyrain_controller_station_14_enabled
        - switch.espyrain_controller_station_15_enabled
        - switch.espyrain_controller_station_16_enabled
  condition:
    - condition: state
      entity_id: input_boolean.espyrain_sync_lock
      state: 'off'
    - condition: template
      value_template: >
        {{
          trigger.to_state is not none and
          trigger.to_state.state in ['on', 'off'] and
          (trigger.from_state is none or trigger.to_state.state != trigger.from_state.state)
        }}
  action:
    - variables:
        station_num: "{{ trigger.entity_id | regex_findall('station_(\\d+)') | first }}"
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.espyrain_sync_lock
    - service: "input_boolean.turn_{{ trigger.to_state.state }}"
      target:
        entity_id: "input_boolean.espyrain_station_{{ station_num }}_enabled"
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.espyrain_sync_lock

# ================================================================
# REVERSE SYNC: ESP -> HA (optional, for full state visibility)
# ================================================================
# Station enabled reverse sync is active because user-driven direct ESP
# changes should survive reconnects and ESP restarts.
