      entity_id: input_boolean.sprinkler_notifications
      state: "on"

  action:
    - service: notify.send_message
      data:
        entity_id: !secret sprinkler_telegram_notifier
        title: "▶ *Sprinkler Resumed*"
        message: >
          🕒 Resumed at {{ now().strftime('%H:%M:%S') }}
          
          Current: {{ states('sensor.sprinkler_controller_active_station') }}

- id: sprinkler_notify_runtime_changed
  alias: "Sprinkler: Station Runtime Changed (Notifications)"
  mode: queued
  max: 20
  trigger:
    - platform: state
      entity_id:
        - number.sprinkler_controller_station_1_runtime
        - number.sprinkler_controller_station_2_runtime
        - number.sprinkler_controller_station_3_runtime
        - number.sprinkler_controller_station_4_runtime
        - number.sprinkler_controller_station_5_runtime
        - number.sprinkler_controller_station_6_runtime
        - number.sprinkler_controller_station_7_runtime
        - number.sprinkler_controller_station_8_runtime
        - number.sprinkler_controller_station_9_runtime
        - number.sprinkler_controller_station_10_runtime
        - number.sprinkler_controller_station_11_runtime
        - number.sprinkler_controller_station_12_runtime
        - number.sprinkler_controller_station_13_runtime
        - number.sprinkler_controller_station_14_runtime
        - number.sprinkler_controller_station_15_runtime
        - number.sprinkler_controller_station_16_runtime
  condition:
    - condition: template
      value_template: >
        {{
          trigger.from_state is not none and
          trigger.to_state is not none and
          trigger.from_state.state not in ['unknown', 'unavailable'] and
          trigger.to_state.state not in ['unknown', 'unavailable'] and
          (trigger.from_state.state | float(0)) != (trigger.to_state.state | float(0))
        }}
    - condition: state
      entity_id: input_boolean.sprinkler_notifications
      state: "on"

  action:
    - service: notify.send_message
      data:
        entity_id: !secret sprinkler_telegram_notifier
        title: "🕒 *Station Runtime Updated*"
        message: >
          {{ trigger.to_state.attributes.friendly_name }}
          {{ trigger.from_state.state }} min -> {{ trigger.to_state.state }} min

