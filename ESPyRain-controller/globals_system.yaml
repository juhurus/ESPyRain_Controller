  # ================================================================
  # HELPER FUNCTION: TURN ON STATION (with coupling)
  # ================================================================
  - id: turn_on_station
    type: std::function<void(int)>
    initial_value: |-
      [](int station_num) -> void {
        if (station_num < 1 || station_num > (int)id(num_stations)) {
          ESP_LOGW("valve", "turn_on_station: invalid station %d", station_num);
          return;
        }

        int pin = id(get_station_pin)(station_num);
        if (pin <= 0) {
          ESP_LOGW("valve", "turn_on_station: S%d has no GPIO pin assigned", station_num);
          return;
        }

        gpio_set_direction((gpio_num_t)(int)pin, GPIO_MODE_OUTPUT);
        gpio_set_level((gpio_num_t)(int)pin, 0);

        std::string name = id(get_station_name)(station_num);
        ESP_LOGI("valve", "S%d (%s) ON  [GPIO%d = LOW]", station_num, name.c_str(), pin);

        uint16_t coupled = id(get_station_coupled_mask)(station_num);
        if (coupled != 0) {
          for (int cs = 1; cs <= (int)id(num_stations); cs++) {
            if (coupled & (1 << (cs - 1))) {
              int cs_pin = id(get_station_pin)(cs);
              if (cs_pin > 0) {
                gpio_set_direction((gpio_num_t)(int)cs_pin, GPIO_MODE_OUTPUT);
                gpio_set_level((gpio_num_t)(int)cs_pin, 0);
                std::string cs_name = id(get_station_name)(cs);
                ESP_LOGI("valve", "  Coupled: S%d (%s) ON  [GPIO%d = LOW]",
                         cs, cs_name.c_str(), cs_pin);
              }
            }
          }
        }
      }

  # ================================================================
  # HELPER FUNCTION: TURN OFF STATION (with coupling)
  # ================================================================
  - id: turn_off_station
    type: std::function<void(int)>
    initial_value: |-
      [](int station_num) -> void {
        if (station_num < 1 || station_num > (int)id(num_stations)) {
          ESP_LOGW("valve", "turn_off_station: invalid station %d", station_num);
          return;
        }

        int pin = id(get_station_pin)(station_num);
        if (pin <= 0) {
          ESP_LOGW("valve", "turn_off_station: S%d has no GPIO pin assigned", station_num);
          return;
        }

        gpio_set_level((gpio_num_t)(int)pin, 1);

        std::string name = id(get_station_name)(station_num);
        ESP_LOGI("valve", "S%d (%s) OFF [GPIO%d = HIGH]", station_num, name.c_str(), pin);

        uint16_t coupled = id(get_station_coupled_mask)(station_num);
        if (coupled != 0) {
          for (int cs = 1; cs <= (int)id(num_stations); cs++) {
            if (coupled & (1 << (cs - 1))) {
              int cs_pin = id(get_station_pin)(cs);
              if (cs_pin > 0) {
                gpio_set_level((gpio_num_t)(int)cs_pin, 1);
                std::string cs_name = id(get_station_name)(cs);
                ESP_LOGI("valve", "  Coupled: S%d (%s) OFF [GPIO%d = HIGH]",
                         cs, cs_name.c_str(), cs_pin);
              }
            }
          }
        }
      }

  - id: queue_add_station
    type: std::function<void(int, uint32_t)>
    initial_value: |-
      [](int station_num, uint32_t duration_sec) -> void {
        int max_items = (int)id(max_queue_items);
        int current_items = (int)id(queue_tracker).size();

        if (id(is_running) && current_items >= max_items) {
          std::string station_name = id(get_station_name)(station_num);
          char msg[180];
          snprintf(msg, sizeof(msg), "Queue limit reached (%d items). Manual run for S%d (%s) was not queued.",
                   max_items, station_num, station_name.c_str());
          ESP_LOGW("queue", "%s", msg);
          id(publish_controller_event)("queue_limit_reached", std::string(msg));
          return;
        }

        if (!id(is_running)) {
          id(queue_tracker).clear();
          id(queue_durations).clear();
          id(queue_schedule_sources).clear();
          id(queue_cycle_breaks).clear();
          id(queue_index) = -1;
          id(queue_tracker).push_back(station_num);
          id(queue_durations).push_back(duration_sec);
          id(queue_schedule_sources).push_back(0);
          id(queue_cycle_breaks).push_back(false);
          id(is_running) = true;
          id(is_paused) = false;
          id(paused_timestamp) = 0;
          id(soak_resting) = false;
          id(soak_rest_remaining) = 0;
          id(master_reprime_pending) = false;
          id(queue_total_time_initial) = (int)duration_sec;
          id(total_queue_time_remaining) = (int)duration_sec;
          ESP_LOGI("queue", "S%d starting, duration: %d seconds", station_num, duration_sec);
          id(run_next_station).execute();
        } else {
          id(queue_tracker).push_back(station_num);
          id(queue_durations).push_back(duration_sec);
          id(queue_schedule_sources).push_back(0);
          id(queue_cycle_breaks).push_back(false);
          id(queue_total_time_initial) = (int)duration_sec + id(total_queue_time_remaining);
          id(total_queue_time_remaining) = id(total_queue_time_remaining) + (int)duration_sec;
          ESP_LOGI("queue", "S%d queued, total queue time: %d seconds", station_num, id(total_queue_time_remaining));
        }
      }

  # ================================================================
  # HELPER FUNCTION: TURN OFF ALL STATIONS
  # ================================================================
  - id: turn_off_all_stations
    type: std::function<void()>
    initial_value: |-
      []() -> void {
        ESP_LOGI("valve", "Turning off ALL stations");
        for (int s = 1; s <= (int)id(num_stations); s++) {
          int pin = id(get_station_pin)(s);
          if (pin > 0) {
            gpio_set_level((gpio_num_t)(int)pin, 1);
          }
        }

        if (id(master_valve_enabled) != 0) {
          int mv_pin = (int)id(master_valve_pin);
          if (mv_pin > 0) {
            gpio_set_level((gpio_num_t)(int)mv_pin, 1);
            ESP_LOGI("valve", "Master valve OFF [GPIO%d = HIGH]", mv_pin);
          }
        }
      }

