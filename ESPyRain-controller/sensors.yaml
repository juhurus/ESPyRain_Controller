    id: current_station_runtime_sensor
    unit_of_measurement: "s"
    icon: mdi:timer-play-outline
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return (float)id(current_valve_runtime);

  - platform: template
    name: "Station Time Remaining"
    id: station_time_remaining_sensor
    unit_of_measurement: "s"
    icon: mdi:timer-outline
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return (float)id(time_remaining);

  - platform: template
    name: "Total Queue Time Remaining"
    id: total_queue_time_remaining_sensor
    unit_of_measurement: "s"
    icon: mdi:timer-sand
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return (float)id(total_queue_time_remaining);

  - platform: template
    name: "Queue Progress"
    id: queue_progress_sensor
    unit_of_measurement: "%"
    icon: mdi:progress-check
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      if (id(queue_total_time_initial) <= 0) return 0.0f;
      float elapsed = (float)(id(queue_total_time_initial) - id(total_queue_time_remaining));
      float progress = 100.0f * elapsed / (float)id(queue_total_time_initial);
      if (progress < 0.0f) progress = 0.0f;
      if (progress > 100.0f) progress = 100.0f;
      return progress;

