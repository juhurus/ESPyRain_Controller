                          border-right: 2px solid #00FF00;
                        {% else %}
                          border-left: 2px solid #FF6B6B;
                          border-right: 2px solid #FF6B6B;
                        {% endif %}
                      }

                      @keyframes blink-border {
                        0%, 100% { border-left-color: #00FF00; border-right-color: #00FF00; }
                        50% { border-left-color: transparent; border-right-color: transparent; }
                      }
                - entity: sensor.espyrain_controller_queue_progress
                  name: Overall Progress
                - type: custom:template-entity-row
                  entity: >-
                    sensor.espyrain_controller_total_queue_time_remaining_formatted
                  name: Total Time Remaining
                  icon: mdi:timer-outline
                  card_mod:
                    style: |
                      :host {
                        position: relative;
                        overflow: visible;
                      }
