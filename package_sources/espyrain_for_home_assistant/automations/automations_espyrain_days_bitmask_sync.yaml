# ================================================================
# SCHEDULE 4 - Days Bitmask Sync
# ================================================================
- id: espyrain_schedule_4_sync_days_bitmask
  alias: "ESPyRain: Sync Schedule 4 Days Bitmask"
  description: "Handle Sync Schedule 4 Days Bitmask."
  trigger:
    - platform: state
      entity_id: input_select.espyrain_schedule_4_days
    - platform: state
      entity_id:
        - input_boolean.espyrain_schedule_4_monday
        - input_boolean.espyrain_schedule_4_tuesday
        - input_boolean.espyrain_schedule_4_wednesday
        - input_boolean.espyrain_schedule_4_thursday
        - input_boolean.espyrain_schedule_4_friday
        - input_boolean.espyrain_schedule_4_saturday
        - input_boolean.espyrain_schedule_4_sunday
  condition:
    - condition: state
      entity_id: input_boolean.espyrain_sync_lock
      state: "off"
  action:
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_4_days_bitmask
      data:
        value: >
          {% set days_mode = states('input_select.espyrain_schedule_4_days') %}
          {% if days_mode == 'Daily' %}
            127
          {% elif days_mode == 'Selected Days' %}
            {{
              (1 if is_state('input_boolean.espyrain_schedule_4_monday', 'on') else 0) +
              (2 if is_state('input_boolean.espyrain_schedule_4_tuesday', 'on') else 0) +
              (4 if is_state('input_boolean.espyrain_schedule_4_wednesday', 'on') else 0) +
              (8 if is_state('input_boolean.espyrain_schedule_4_thursday', 'on') else 0) +
              (16 if is_state('input_boolean.espyrain_schedule_4_friday', 'on') else 0) +
              (32 if is_state('input_boolean.espyrain_schedule_4_saturday', 'on') else 0) +
              (64 if is_state('input_boolean.espyrain_schedule_4_sunday', 'on') else 0)
            }}
          {% elif days_mode == 'Weekdays (Mon-Fri)' %}
            31
          {% elif days_mode == 'Weekends (Sat-Sun)' %}
            96
          {% elif days_mode == 'Odd Days (1,3,5...)' %}
            127
          {% elif days_mode == 'Even Days (2,4,6...)' %}
            127
          {% elif 'Every' in days_mode and 'Days' in days_mode %}
            0
          {% else %}
            0
          {% endif %}

# ================================================================
# NOTES:
#
# 1. For "Odd Days" and "Even Days":
#    - Bitmask is set to 127 (daily) on HA side
#    - ESP checks day-of-month with modulo operation
#    - This allows the schedule to check every day, then ESP filters
#
# 2. For "Weekdays" and "Weekends":
#    - Bitmask is calculated as sum of weekday bits
#    - Weekdays: 1+2+4+8+16 = 31 (Mon-Fri)
#    - Weekends: 32+64 = 96 (Sat-Sun)
#
# 3. For "Every X Days" interval modes:
#    - Bitmask is set to 0
#    - ESP uses interval check instead of bitmask
#
# 4. For "Selected Days":
#    - Bitmask is calculated from individual day toggles
#    - Sum of enabled days
#
# 5. For "Daily":
#    - Bitmask is 127 (all 7 bits set)
# ================================================================
