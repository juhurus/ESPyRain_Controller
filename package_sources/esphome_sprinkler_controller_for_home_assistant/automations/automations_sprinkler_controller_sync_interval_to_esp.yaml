# ESP heartbeat service
- id: sprinkler_esp_heartbeat
  alias: "Sprinkler: ESP Heartbeat"
  description: "Send heartbeat to ESP every 60 seconds to detect HA disconnection"
  trigger:
    - platform: time_pattern
      minutes: "*"
      seconds: "0"
    - platform: homeassistant
      event: start
  condition: []
  action:
    - service: esphome.sprinkler_controller_receive_heartbeat
      data: {}
  mode: single
