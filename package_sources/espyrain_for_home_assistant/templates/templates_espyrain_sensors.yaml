    # ==========================================================
    # Last run schedule sensors
    # ==========================================================

    - name: "ESPyRain Schedule 1 Last Run"
      unique_id: espyrain_schedule_1_last_run
      state: >
        {% set ts = states('sensor.espyrain_controller_schedule_1_last_run_raw') %}
        {% if ts in ['unknown', 'unavailable', 'none', ''] %}
          never
        {% else %}
          {% set ts_num = ts | float(0) %}
          {% if ts_num == 0 %}
            never
          {% else %}
            {{ ts_num | timestamp_custom('%Y-%m-%d %H:%M', true) }}
          {% endif %}
        {% endif %}
      attributes:
        timestamp: >
          {% set ts = states('sensor.espyrain_controller_schedule_1_last_run_raw') %}
          {% if ts in ['unknown', 'unavailable', 'none', ''] %}
            0
          {% else %}
            {{ ts | float(0) | int }}
          {% endif %}
        ran_today: >
          {% set ts = states('sensor.espyrain_controller_schedule_1_last_run_raw') %}
          {% if ts in ['unknown', 'unavailable', 'none', ''] %}
            false
          {% else %}
            {% set ts_num = ts | float(0) | int %}
            {% if ts_num == 0 %}
              false
            {% else %}
              {% set now_ts = now().timestamp() | int %}
              {% set today_midnight = now_ts - (now().hour * 3600 + now().minute * 60 + now().second) %}
              {{ ts_num >= today_midnight }}
            {% endif %}
          {% endif %}

    - name: "ESPyRain Schedule 2 Last Run"
      unique_id: espyrain_schedule_2_last_run
      state: >
        {% set ts = states('sensor.espyrain_controller_schedule_2_last_run_raw') %}
        {% if ts in ['unknown', 'unavailable', 'none', ''] %}
          never
        {% else %}
