ESPyRain-Dark:
  #Text colours
  primary-text-color: '#FFFFFF'                                     # Primary text colour, here is referencing dark-primary-color
  # secondary-text-color: '#5294E2'                                   # For secondary titles in more info boxes etc.
  secondary-text-color: '#8ec9ff'                                   # For secondary titles in more info boxes etc.
  text-primary-color: 'var(--primary-text-color)'                   # Primary text colour
  disabled-text-color: '#7F848E'                                    # Disabled text colour
  
  #Main colours
  dark-primary-color: 'var(--accent-color)'                         # Hyperlinks                                         
  light-primary-color: 'var(--accent-color)'                        # Horizontal line in about
  accent-color: 'rgba(255,230,128,0.7)'                             # Accent color
  #divider-color: 'rgba(0, 0, 0, .12)'                              # Divider 
  divider-color: 'rgba(225, 225, 225, .12)'                         # Divider 
  primary-color: '#6e8c97'                                          # Header and some text
  secondary-color: '#f1f2f4'                                        # For secondary titles in more info boxes etc.
  
  #Icon colours
  state-icon-color: '#7cb5ea' 
  state-icon-active-color: '#fffccc'                                #e7cb57 correct for active icons
  state-icon-unavailable-color: 'var(--disabled-text-color)' 
  
  #Background colours
  #card-background-color: '#e5eaec' 
  card-background-color: '#1c1c1c'
  primary-background-color: '#1e1e1e'                               # Settings background
  secondary-background-color: '#252526'                             # Main card UI background  
  ha-card-background: 'rgba(150, 150, 150, 0.2)'                    # HA Cards background
  
  
  # Example: bring back header feel                                 # added 02 Feb 2026 
  app-header-background-color: "#455A64" 
  app-header-text-color: "#FFFFFF"
   
  #sidebar colours
  sidebar-text-color: 'var(--primary-text-color, white)' 
  sidebar-background-color: 'var(--paper-listbox-background-color)'  
  sidebar-icon-color: 'var(--primary-text-color)' 
  sidebar-selected-text-color: '#7cb5ea' 
  sidebar-selected-icon-color: '#7cb5ea' 

  ha-card-border-radius: '4px'   
  toggle-button-color: 'var(--primary-color)' 
  
  #Slider colours
  slider-color: 'var(--primary-color)' 
  slider-secondary-color: 'var(--light-primary-color)' 
  slider-bar-color: 'var(--disabled-text-color)' 
  
  #Label Badge colours
  label-badge-background-color: 'white' 
  label-badge-text-color: 'rgba(76, 76, 76)' 
  label-badge-red: '#DF4C1E' 
  label-badge-blue: '#039be5' 
  label-badge-green: '#2eb564' 
  label-badge-yellow: '#f4b400' 
  label-badge-grey: 'var(--paper-grey-500)' 
  label-badge-border-color: 'green'                                # Label badge border, just a reference value   
  
  paper-grey-50: '#fafafa'  
  paper-grey-200: '#eeeeee'   
  paper-grey-500: '#9e9e9e'   
  
  google-red-500: '#db4437' 
  google-blue-500: '#4285f4' 
  google-green-500: '#0f9d58' 
  google-yellow-500: '#f4b400' 
  paper-spinner-color: 'var(--primary-color)' 
  
  paper-green-400: '#66bb6a' 
  paper-blue-400: '#42a5f5' 
  paper-orange-400: '#ffa726' 
  
  dark-divider-opacity: '0.12' 
  dark-disabled-opacity: '0.38'  
  dark-secondary-opacity: '0.54' 
  dark-primary-opacity: '0.87' 
  
  
  light-divider-opacity: '0.12' 
  light-disabled-opacity: '0.3'  
  light-secondary-opacity: '0.7' 
  light-primary-opacity: '1.0' 
  
  #backgrounds
  paper-card-header-color: 'var(--accent-color)'                                  # Card header text colour
  paper-card-background-color: 'rgba(50, 50, 50, 0.5)'                            # Card background colour
  paper-dialog-background-color: '#434954'                                        # Card dialog background colour
  paper-listbox-color: 'var(--primary-text-color)'                                # Navigation menu selection hoover
  paper-listbox-background-color: 'rgba(57,57,57)'                              # Navigation menu background
  paper-item-icon-color: 'var(--state-icon-color)' 
  paper-item-icon-active-color: 'var(--state-icon-active-color)' 
  paper-item-icon_-_color: 'green'           
  paper-item-selected_-_background-color: '#434954'                               # Popup item select                      
  paper-tabs-selection-bar-color: 'green'
  table-row-background-color: 'var(--primary-background-color)' 
  table-row-alternative-background-color: 'var(--secondary-background-color)' 
  
  #toggles
  paper-toggle-button-checked-ink-color: 'var(--toggle-button-color)' 
  paper-toggle-button-checked-button-color: 'var(--state-icon-active-color)'       #need to replace with ffe680
  paper-toggle-button-checked-bar-color: "#FFA23F"
  paper-toggle-button-unchecked-button-color: "#767679"
  paper-toggle-button-unchecked-bar-color: "#AAAAAD"
  paper-toggle-button-unchecked-ink-color: 'var(--disabled-text-color)'  

  # Sliders
  paper-slider-knob-color: 'var(--accent-color)'
  paper-slider-knob-start-color: 'var(--accent-color)'
  paper-slider-pin-color: 'var(--accent-color)'
  paper-slider-active-color: 'var(--accent-color)'
  paper-slider-container-color: 'linear-gradient(var(--primary-background-color), var(--secondary-background-color)) no-repeat'
  paper-slider-secondary-color: 'var(--secondary-background-color)'
  paper-slider-disabled-active-color: 'var(--disabled-text-color)'
  paper-slider-disabled-secondary-color: 'var(--disabled-text-color)'
  ha-paper-slider-pin-font-size: '15px' 
  
  # mdc-theme-primary: 'var(--primary-color)'
  # mdc-theme-secondary: 'var(--secondary-color)'
  mdc-theme-secondary: '#018786'
  mdc-theme-surface: "#565656"
  mdc-theme-primary: "#92a5b7"
  # mdc-select-dropdown-icon-color: "#fafafa99"
  # mdc-select-fill-color: "rgba(0 0 0 / 6%)"
  # mdc-text-field-fill-color: "rgba(0 0 0 / 6%)"
  # mdc-select-ink-color: "#fafafa99"
  # input-label-ink-color: "#fafafa99"
  
  mdc-select-dropdown-icon-color: 'var(--primary-text-color)' 
  mdc-select-fill-color: "rgba(0 0 0 / 6%)"
  mdc-text-field-fill-color: "rgba(0 0 0 / 6%)"
  mdc-select-ink-color: 'var(--primary-text-color)'
  input-label-ink-color: 'var(--primary-text-color)'
  input-ink-color: 'var(--primary-text-color)'
  input-dropdown-icon-color: 'var(--primary-text-color)'
  #mdc-ripple-color: ????
  
  switch-checked-color: "#fffccc"
  switch-unchecked-button-color: "#6e8c97"
  # app-header-background: '#FFFFFF'
  data-table-background-color: 'var(--primary-color)'
  #markdown-pre-background-color: "#565656"
  markdown-code-background-color: "#565656"

  #Calendar border colour
  fc-theme-standard-border-color: var(--divider-color);
