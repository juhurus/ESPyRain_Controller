    # ==========================================================
    # ESP Time Drift Seconds
    # ==========================================================
    - name: "ESPyRain ESP Time Drift Seconds"
      unique_id: espyrain_esp_time_drift_seconds
      unit_of_measurement: s
      device_class: duration
      state: >
        {% set esp = states('sensor.espyrain_controller_esp_time') %}
        {% set ha = now() %}
        {% if esp in ['unknown', 'unavailable', 'none', ''] %}
          0
        {% else %}
          {% set esp_ts = as_timestamp(esp, default=None) %}
          {% set ha_ts = as_timestamp(ha, default=None) %}
          {% if esp_ts is none or ha_ts is none %}
            0
          {% else %}
            {{ (esp_ts - ha_ts) | round(0) | int }}
          {% endif %}
        {% endif %} 
        
