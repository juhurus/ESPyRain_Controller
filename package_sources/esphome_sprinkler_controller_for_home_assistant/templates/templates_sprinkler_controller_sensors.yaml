# Interval-blocked warning on schedule cards
    - name: "Sprinkler Schedule 1 Blocked By Interval Today"
      unique_id: sprinkler_schedule_1_blocked_by_interval_today
      state: >
        {% set bypass_off = is_state('input_boolean.sprinkler_bypass_interval_check', 'off') %}
        {% set enabled = is_state('input_boolean.sprinkler_schedule_1_enabled', 'on') %}
        {% set last = states('sensor.sprinkler_schedule_1_last_run') %}
        {% if not bypass_off or not enabled or last in ['unknown', 'unavailable', 'never', ''] %}
          false
        {% else %}
          {{ as_timestamp(last, default=0) >= as_timestamp(today_at('00:00:00')) }}
