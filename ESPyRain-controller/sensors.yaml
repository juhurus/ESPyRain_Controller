  # ════════════════════════════════════════════════════════════════
  # SCHEDULE 1 -- Next Run Sensors
  # ════════════════════════════════════════════════════════════════
  - platform: template
    name: "Schedule 1 Next Run"
    id: schedule_1_next_run_summary
    icon: mdi:calendar-clock
    update_interval: 5s
    lambda: |-
      if (!id(get_schedule_enabled)(1)) {
        return std::string("Disabled");
      }
      if (id(schedule_1_next_runs).size() < 1 || id(schedule_1_next_runs)[0] == 0) {
        return std::string("None");
      }
      auto t = ESPTime::from_epoch_local(id(schedule_1_next_runs)[0]);
      char buf[20];
      snprintf(buf, sizeof(buf), "%04d-%02d-%02d %02d:%02d",
               t.year, t.month, t.day_of_month, t.hour, t.minute);
      return std::string(buf);

