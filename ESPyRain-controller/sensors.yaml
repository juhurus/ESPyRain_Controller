interval:
  - interval: 100ms
    then:
      - lambda: |-
          if (!id(pending_station_start)) return;
          if (!id(is_running)) {
            id(pending_station_start) = false;
            id(pending_master_after_station) = false;
            id(pending_station_number) = 0;
            id(pending_station_duration_sec) = 0;
            id(pending_station_start_ms) = 0;
            return;
          }
          if (id(is_paused)) return;

          uint32_t now_ms = millis();
          if ((int32_t)(now_ms - id(pending_station_start_ms)) < 0) return;

          if (id(pending_master_after_station)) {
            if (id(master_valve_enabled) != 0) {
              int mv_pin = (int)id(master_valve_pin);
              if (mv_pin > 0) {
                gpio_set_direction((gpio_num_t)(int)mv_pin, GPIO_MODE_OUTPUT);
                gpio_set_level((gpio_num_t)(int)mv_pin, 0);
                ESP_LOGI("valve", "Master valve ON [GPIO%d] (delayed after station start)", mv_pin);
              }
            }
          } else {
            int station_num = id(pending_station_number);
            uint32_t duration_sec = id(pending_station_duration_sec);
            if (station_num >= 1 && station_num <= (int)id(num_stations) && duration_sec > 0) {
              id(current_station) = station_num;
              id(current_valve_runtime) = (int)duration_sec;
              id(time_remaining) = (int)duration_sec;
              id(turn_on_station)(station_num);

              std::string name = id(get_station_name)(station_num);
              id(active_program_name) = name;
              ESP_LOGI("queue", "Running S%d (%s) after delayed master valve start", station_num, name.c_str());
            }
          }

          id(pending_station_start) = false;
          id(pending_master_after_station) = false;
          id(pending_station_number) = 0;
          id(pending_station_duration_sec) = 0;
          id(pending_station_start_ms) = 0;

  - interval: 1s
    then:
      - lambda: |-
          if (id(last_heartbeat_time) > 0 && id(ha_connected)) {
            float heartbeat_age = (millis() - id(last_heartbeat_time)) / 1000.0f;
            if (heartbeat_age > (float)id(heartbeat_timeout_seconds)) {
              id(ha_connected) = false;
              if (id(ha_last_disconnected_time) == 0) {
                id(ha_last_disconnected_time) = millis();
              }
              ESP_LOGW("heartbeat", "HA heartbeat timed out after %.0fs", heartbeat_age);
            }
          }

          if (!id(is_running)) return;

          // ── SOAK REST COUNTDOWN ──
          if (id(soak_resting)) {
            if (id(soak_rest_remaining) > 0) {
              id(soak_rest_remaining) = id(soak_rest_remaining) - 1;
              if (id(total_queue_time_remaining) > 0) {
                id(total_queue_time_remaining) = id(total_queue_time_remaining) - 1;
              }
            }
            if (id(soak_rest_remaining) <= 0) {
              ESP_LOGI("queue", "Soak rest complete, continuing queue");
              id(soak_resting) = false;
              id(master_reprime_pending) = true;
              id(run_next_station).execute();
            }
            return;
          }

          // ── PAUSED ──
          if (id(is_paused)) return;

          // ── NORMAL COUNTDOWN ──
          if (id(time_remaining) > 0) {
            id(time_remaining) = id(time_remaining) - 1;
            if (id(total_queue_time_remaining) > 0) {
              id(total_queue_time_remaining) = id(total_queue_time_remaining) - 1;
            }
          }

          // ── STATION COMPLETE ──
          if (id(time_remaining) <= 0 && id(current_station) > 0) {
            int completed = id(current_station);
            std::string name = id(get_station_name)(completed);
            ESP_LOGI("queue", "S%d (%s) complete", completed, name.c_str());

            bool enter_soak_rest = false;
            if (id(queue_index) >= 0 && id(queue_index) < (int)id(queue_cycle_breaks).size()) {
              enter_soak_rest = id(queue_cycle_breaks)[id(queue_index)];
            }

            if (enter_soak_rest && id(soak_rest_minutes) > 0) {
              id(turn_off_station)(completed);
              id(current_station) = 0;
              id(current_valve_runtime) = 0;
              id(time_remaining) = 0;
              id(soak_resting) = true;
              id(soak_rest_remaining) = (int)id(soak_rest_minutes) * 60;
              id(master_reprime_pending) = true;

              if (id(master_valve_enabled) != 0) {
                int mv_pin = (int)id(master_valve_pin);
                if (mv_pin > 0) {
                  gpio_set_level((gpio_num_t)(int)mv_pin, 1);
                  ESP_LOGI("valve", "Master valve OFF during soak rest");
                }
              }

              ESP_LOGI("queue", "Entering soak rest for %d seconds",
                       id(soak_rest_remaining));
              return;
            }

            id(run_next_station).execute();
          }

  # ══════════════════════════════════════════════════════════════
  # PERIODIC RECALCULATION -- Every 5 minutes
  # ══════════════════════════════════════════════════════════════
  - interval: 300s
    then:
      - lambda: |-
          auto now = id(esp_time).now();
          if (!now.is_valid()) return;

          int num_sched = (int)id(num_schedules);
          for (int i = 1; i <= num_sched; i++) {
            id(calculate_next_7_runs)(i);
          }
          ESP_LOGD("recalc", "Periodic recalculation complete for %d schedules", num_sched);

