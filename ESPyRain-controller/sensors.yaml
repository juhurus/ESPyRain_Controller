               t.year, t.month, t.day_of_month, t.hour, t.minute);
      return std::string(buf);

  - platform: template
    name: "Schedule 8 Next Run 7"
    id: schedule_8_next_run_7_text
    icon: mdi:calendar
    update_interval: 5s
    lambda: |-
      if (id(schedule_8_next_runs).size() < 7 || id(schedule_8_next_runs)[6] == 0) {
        return std::string("None");
      }
      auto t = ESPTime::from_epoch_local(id(schedule_8_next_runs)[6]);
      char buf[20];
      snprintf(buf, sizeof(buf), "%04d-%02d-%02d %02d:%02d",
               t.year, t.month, t.day_of_month, t.hour, t.minute);
      return std::string(buf);

