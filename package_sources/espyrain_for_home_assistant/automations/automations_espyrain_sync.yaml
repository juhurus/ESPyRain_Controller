          {% elif 'Weekends' in days_mode %}96
          {% else %}0{% endif %}
      continue_on_error: true

    # Interval
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_7_interval
      data:
        value: >
          {% set days_mode = states('input_select.espyrain_schedule_7_days') %}
          {% if 'Every 2' in days_mode %}2
          {% elif 'Every 3' in days_mode %}3
          {% elif 'Every 4' in days_mode %}4
          {% elif 'Every 5' in days_mode %}5
          {% elif 'Every 6' in days_mode %}6
          {% elif 'Every 7' in days_mode %}7
          {% else %}1{% endif %}
      continue_on_error: true

    # Station mask intentionally not pushed on HA start.
    # Prevents accidental reset if helper states are not restored yet.

    # Soak cycles
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_7_soak_cycles
      data:
        value: >
          {% set soak = states('input_select.espyrain_schedule_7_soak_cycles') %}
          {% if '2x' in soak %}1
          {% elif '3x' in soak %}2
          {% elif '4x' in soak %}3
          {% elif '5x' in soak %}4
          {% else %}0{% endif %}
      continue_on_error: true

    # Seasonal adjust
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_7_seasonal_adjust
      data:
        value: "{{ states('input_number.espyrain_schedule_7_seasonal') | int(100) }}"
      continue_on_error: true

    # Enabled
    - service: "switch.turn_{{ 'on' if is_state('input_boolean.espyrain_schedule_7_enabled', 'on') else 'off' }}"
      target:
        entity_id: switch.espyrain_controller_schedule_7_enabled
      continue_on_error: true

    # â”€â”€ SCHEDULE 8 â”€â”€
    # Time
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_8_hour
      data:
        value: "{{ state_attr('input_datetime.espyrain_schedule_8_time', 'hour') | int(0) }}"
      continue_on_error: true
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_8_minute
      data:
        value: "{{ state_attr('input_datetime.espyrain_schedule_8_time', 'minute') | int(0) }}"
      continue_on_error: true

    # Day mode
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_8_day_mode
      data:
        value: >
          {% set days_mode = states('input_select.espyrain_schedule_8_days') %}
          {% if days_mode == 'Daily' %}0
          {% elif days_mode == 'Selected Days' %}1
          {% elif 'Every' in days_mode %}2
          {% elif 'Odd' in days_mode %}3
          {% elif 'Even' in days_mode %}4
          {% elif 'Weekdays' in days_mode or 'Weekends' in days_mode %}5
          {% else %}0{% endif %}
      continue_on_error: true

    # Days bitmask
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_8_days_bitmask
      data:
        value: >
          {% set days_mode = states('input_select.espyrain_schedule_8_days') %}
          {% if days_mode in ['Daily'] or 'Odd' in days_mode or 'Even' in days_mode %}127
          {% elif days_mode == 'Selected Days' %}
            {{ (1 if is_state('input_boolean.espyrain_schedule_8_monday','on') else 0) +
               (2 if is_state('input_boolean.espyrain_schedule_8_tuesday','on') else 0) +
               (4 if is_state('input_boolean.espyrain_schedule_8_wednesday','on') else 0) +
               (8 if is_state('input_boolean.espyrain_schedule_8_thursday','on') else 0) +
               (16 if is_state('input_boolean.espyrain_schedule_8_friday','on') else 0) +
               (32 if is_state('input_boolean.espyrain_schedule_8_saturday','on') else 0) +
               (64 if is_state('input_boolean.espyrain_schedule_8_sunday','on') else 0) }}
          {% elif 'Weekdays' in days_mode %}31
          {% elif 'Weekends' in days_mode %}96
          {% else %}0{% endif %}
      continue_on_error: true

    # Interval
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_8_interval
      data:
        value: >
          {% set days_mode = states('input_select.espyrain_schedule_8_days') %}
          {% if 'Every 2' in days_mode %}2
          {% elif 'Every 3' in days_mode %}3
          {% elif 'Every 4' in days_mode %}4
          {% elif 'Every 5' in days_mode %}5
          {% elif 'Every 6' in days_mode %}6
          {% elif 'Every 7' in days_mode %}7
          {% else %}1{% endif %}
      continue_on_error: true

    # Station mask intentionally not pushed on HA start.
    # Prevents accidental reset if helper states are not restored yet.

    # Soak cycles
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_8_soak_cycles
      data:
        value: >
          {% set soak = states('input_select.espyrain_schedule_8_soak_cycles') %}
          {% if '2x' in soak %}1
          {% elif '3x' in soak %}2
          {% elif '4x' in soak %}3
          {% elif '5x' in soak %}4
          {% else %}0{% endif %}
      continue_on_error: true

    # Seasonal adjust
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_8_seasonal_adjust
      data:
        value: "{{ states('input_number.espyrain_schedule_8_seasonal') | int(100) }}"
      continue_on_error: true

    # Enabled
    - service: "switch.turn_{{ 'on' if is_state('input_boolean.espyrain_schedule_8_enabled', 'on') else 'off' }}"
      target:
        entity_id: switch.espyrain_controller_schedule_8_enabled
      continue_on_error: true

    # Log completion
    - service: system_log.write
      data:
        message: "ESPyRain: All 8 schedule settings synced HA -> ESP after HA start"
        level: info
  mode: single
