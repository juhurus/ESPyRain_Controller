# Saved as: config/package_sources/espyrain_for_home_assistant/automations/automations_espyrain_days_bitmask_sync.yaml

# ================================================================
# SYNC SCHEDULE 1 DAYS BITMASK
# ================================================================
- id: espyrain_schedule_1_sync_days_bitmask
  alias: "ESPyRain: Sync Schedule 1 Days Bitmask"
  description: "Handle Sync Schedule 1 Days Bitmask."
  trigger:
    # Trigger when day mode changes
    - platform: state
      entity_id: input_select.espyrain_schedule_1_days
    # Trigger when any individual day toggles (for Selected Days mode)
    - platform: state
      entity_id:
        - input_boolean.espyrain_schedule_1_monday
        - input_boolean.espyrain_schedule_1_tuesday
        - input_boolean.espyrain_schedule_1_wednesday
        - input_boolean.espyrain_schedule_1_thursday
        - input_boolean.espyrain_schedule_1_friday
        - input_boolean.espyrain_schedule_1_saturday
        - input_boolean.espyrain_schedule_1_sunday
  condition:
    - condition: state
      entity_id: input_boolean.espyrain_sync_lock
      state: "off"
  action:
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_1_days_bitmask
      data:
        value: >
          {% set days_mode = states('input_select.espyrain_schedule_1_days') %}
          {% if days_mode == 'Daily' %}
            127
          {% elif days_mode == 'Selected Days' %}
            {{
              (1 if is_state('input_boolean.espyrain_schedule_1_monday', 'on') else 0) +
              (2 if is_state('input_boolean.espyrain_schedule_1_tuesday', 'on') else 0) +
              (4 if is_state('input_boolean.espyrain_schedule_1_wednesday', 'on') else 0) +
              (8 if is_state('input_boolean.espyrain_schedule_1_thursday', 'on') else 0) +
              (16 if is_state('input_boolean.espyrain_schedule_1_friday', 'on') else 0) +
              (32 if is_state('input_boolean.espyrain_schedule_1_saturday', 'on') else 0) +
              (64 if is_state('input_boolean.espyrain_schedule_1_sunday', 'on') else 0)
            }}
          {% elif days_mode == 'Weekdays (Mon-Fri)' %}
            31
          {% elif days_mode == 'Weekends (Sat-Sun)' %}
            96
          {% elif days_mode == 'Odd Days (1,3,5...)' %}
            127
          {% elif days_mode == 'Even Days (2,4,6...)' %}
            127
          {% elif 'Every' in days_mode and 'Days' in days_mode %}
            0
          {% else %}
            0
          {% endif %}

