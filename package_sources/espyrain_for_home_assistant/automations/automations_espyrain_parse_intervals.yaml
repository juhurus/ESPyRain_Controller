# ════════════════════════════════════════════════════════════════
# PARSE DAYS SETTING AND SET INTERVAL - CORRECTED
# This automation extracts the number from "Every X Days" and sets the interval
# Add to your automations
# ════════════════════════════════════════════════════════════════

# Schedule 1: Parse interval from days setting
- id: espyrain_schedule_1_parse_interval
  alias: "ESPyRain: Parse Schedule 1 Interval"
  trigger:
    - platform: state
      entity_id: input_select.espyrain_schedule_1_days
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ 'Every' in states('input_select.espyrain_schedule_1_days') and 'Days' in states('input_select.espyrain_schedule_1_days') }}"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.espyrain_schedule_1_interval
              data:
                value: "{{ states('input_select.espyrain_schedule_1_days').replace('Every ', '').replace(' Days', '').strip() | int }}"
      default:
        - service: input_number.set_value
          target:
            entity_id: input_number.espyrain_schedule_1_interval
          data:
            value: 1

