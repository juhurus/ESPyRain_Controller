- id: espyrain_station_coupling_full_sync
  alias: "ESPyRain - Station Coupling Full Sync on Start"
  description: "Sync all station coupling checkboxes to ESP on HA start"
  mode: single
  trigger:
    - platform: homeassistant
      event: start
  action:
    - delay: "00:00:30"
    # Station 1
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_station_1_coupled_mask
