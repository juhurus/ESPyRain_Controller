  # HELPER FUNCTION: GET STATION PIN
  # ================================================================
  - id: get_station_pin
    type: std::function<int(int)>
    initial_value: |-
      [](int s) -> int {
        if (s < 1 || s > 16) return 0;
        switch (s) {
          case 1: return (int)id(station_1_pin);
          case 2: return (int)id(station_2_pin);
          case 3: return (int)id(station_3_pin);
          case 4: return (int)id(station_4_pin);
          case 5: return (int)id(station_5_pin);
          case 6: return (int)id(station_6_pin);
          case 7: return (int)id(station_7_pin);
          case 8: return (int)id(station_8_pin);
          case 9: return (int)id(station_9_pin);
          case 10: return (int)id(station_10_pin);
          case 11: return (int)id(station_11_pin);
          case 12: return (int)id(station_12_pin);
          case 13: return (int)id(station_13_pin);
          case 14: return (int)id(station_14_pin);
          case 15: return (int)id(station_15_pin);
          case 16: return (int)id(station_16_pin);
          default: return 0;
        }
      }

