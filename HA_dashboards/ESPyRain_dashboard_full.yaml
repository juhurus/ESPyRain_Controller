                    ## 🚨 Controller Offline

                    Home Assistant currently cannot reach the sprinkler
                    controller.

                    - Live queue/station values are temporarily unavailable.

                    - Live runtime/status sensors may show `unavailable` until
                    the link returns.


                    ### ✅ Note: *If powered the ESP32 Controller will continue
                    running the schedules*
                  card_mod:
                    style: |
                      ha-card {
                        border: 2px solid #FF9800;
                        border-left: 6px solid #FF9800;
                        background: linear-gradient(135deg, rgba(255, 152, 0, 0.18) 0%, rgba(39, 66, 77, 0.85) 100%);
                      }
          - type: vertical-stack
