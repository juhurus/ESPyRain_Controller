number:
  # Station runtimes (1..16)
  - platform: template
    name: "Station 1 Runtime"
    id: station_1_runtime_number
    min_value: 1
    max_value: 60
    step: 1
    unit_of_measurement: "min"
    update_interval: 1s
    lambda: |-
      return id(station_1_runtime);
    set_action:
      - globals.set:
          id: station_1_runtime
          value: !lambda 'return (uint8_t)x;'
      - lambda: |-
          id(station_1_runtime_number).publish_state(x);
      - lambda: |-
          id(station_1_runtime_number).publish_state(x);

