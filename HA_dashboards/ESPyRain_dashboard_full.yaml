                        content: "";
                        position: absolute;
                        top: 0;
                        left: 0;
                        height: 100%;
                        width: {{ states('sensor.espyrain_controller_queue_progress') | float(0) }}%;
                        background: linear-gradient(90deg, rgba(76, 175, 80, 0.2) 0%, rgba(76, 175, 80, 0.6) 100%);
                        z-index: 0;
                        transition: width 1s linear;
                        pointer-events: none;
                      }
                      :host .info,
