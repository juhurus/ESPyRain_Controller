button:
  - platform: template
    name: "Run Station 1"
    id: run_station_1_button
    icon: mdi:play
    on_press: &run_station_template
      - lambda: |-
          int station_num = 1; if (!id(get_station_enabled)(station_num)) { ESP_LOGW("station", "S%d disabled", station_num); return; }
          int pin = id(get_station_pin)(station_num); if (pin <= 0) { ESP_LOGW("station", "S%d no GPIO", station_num); return; }
          int requested_station = station_num;
          station_num = id(resolve_station_run_head)(station_num);
