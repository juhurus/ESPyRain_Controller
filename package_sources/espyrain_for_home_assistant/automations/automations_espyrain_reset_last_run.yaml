# ================================================================
#                                                                
#                Last Run Reset Automations                  
#                                                                
# ================================================================
# Saved as: config/package_sources/espyrain_for_home_assistant/automations/automations_espyrain_reset_last_run.yaml

# ================================================================
# RESET SCHEDULE 1 LAST RUN ON ENABLE
# ================================================================
- id: reset_schedule_1_last_run_on_enable
  alias: "Reset Schedule 1 Last Run on Enable"
  description: "Handle Reset Schedule 1 Last Run on Enable."
  trigger:
    # Trigger when schedule enabled
    - platform: state
      entity_id: input_boolean.espyrain_schedule_1_enabled
      to: 'on'
    # Trigger when days mode changes TO interval
    - platform: state
      entity_id: input_select.espyrain_schedule_1_days
      to: 
        - 'Every 2 Days'
        - 'Every 3 Days'
        - 'Every 4 Days'
        - 'Every 5 Days'
        - 'Every 6 Days'
        - 'Every 7 Days'
  condition:
    # Only if schedule is enabled
    - condition: state
      entity_id: input_boolean.espyrain_schedule_1_enabled
      state: 'on'
  action:
    # v2.0 note: reset-last-run button entity is not exposed by ESP.
    # Keep automation harmless until a dedicated v2 reset service/button exists.
    - service: logbook.log
      data:
        name: ESPyRain
        message: "Schedule 1 last_run reset requested, but no v2 reset button is exposed."

