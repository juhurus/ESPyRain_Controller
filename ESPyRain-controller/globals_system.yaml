  # ================================================================
  # HELPER FUNCTION: IS STATION COUPLED TO ANOTHER
  # Returns true if station_num appears in any OTHER station's
  # coupled_mask (i.e. it is a secondary/slave station).
  # ================================================================
  - id: is_station_coupled_to_another
    type: std::function<bool(int)>
    initial_value: |-
      [](int station_num) -> bool {
        if (station_num < 1 || station_num > 16) return false;
        uint16_t bit = 1 << (station_num - 1);
        for (int s = 1; s <= (int)id(num_stations); s++) {
          if (s == station_num) continue;
          if (id(get_station_coupled_mask)(s) & bit) return true;
        }
        return false;
      }

  # ================================================================
  # HELPER FUNCTION: RESOLVE MANUAL RUN HEAD STATION
  # If a coupled/slave station is selected manually, resolve it to the
  # head station that owns the coupled group so the whole linked set runs.
  # ================================================================
  - id: resolve_station_run_head
    type: std::function<int(int)>
    initial_value: |-
      [](int station_num) -> int {
        if (station_num < 1 || station_num > 16) return station_num;
        uint16_t bit = 1 << (station_num - 1);
        for (int s = 1; s <= (int)id(num_stations); s++) {
          if (s == station_num) continue;
          if (id(get_station_coupled_mask)(s) & bit) return s;
        }
        return station_num;
      }
  
