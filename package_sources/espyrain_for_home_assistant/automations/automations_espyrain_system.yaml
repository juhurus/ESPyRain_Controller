      data:
        value: "{{ states('input_text.espyrain_schedule_5_name') }}"
    - service: text.set_value
      target:
        entity_id: text.espyrain_controller_schedule_6_name
      data:
        value: "{{ states('input_text.espyrain_schedule_6_name') }}"
    - service: text.set_value
      target:
