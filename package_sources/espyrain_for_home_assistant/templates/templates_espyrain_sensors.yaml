# ================================================================
#
#                    Template Sensors
#
# ================================================================
# Saved as: config/package_sources/espyrain_for_home_assistant/templates/templates_espyrain_sensors.yaml

- sensor:
    # ==========================================================
    #    Sprinkler 7-Day Forecast
    #    State: count of unblocked schedule runs in the next 7 days
    #    Attribute "days": list of dicts, one per day, each containing
    #      date, day_name, schedules list, and blocking status
    # ==========================================================
    - name: "ESPyRain 7 Day Forecast"
      unique_id: espyrain_7_day_forecast
      icon: mdi:calendar-week
      state: >
        {% set winter_mode = is_state('switch.espyrain_controller_winter_mode', 'on') %}
        {% set rain_delay = states('number.espyrain_controller_rain_delay_days') | int(0) %}
        {% set auto_winter = is_state('input_boolean.espyrain_winter_auto_enable', 'on') %}
        {% set start_raw = states('input_datetime.espyrain_winter_start') %}
        {% set end_raw = states('input_datetime.espyrain_winter_end') %}
        {% set start_md = strptime(start_raw, '%Y-%m-%d').strftime('%m-%d') if start_raw not in ['unknown', 'unavailable', ''] else '' %}
        {% set end_md = strptime(end_raw, '%Y-%m-%d').strftime('%m-%d') if end_raw not in ['unknown', 'unavailable', ''] else '' %}
        {% set ns = namespace(total=0) %}
        {% for day_offset in range(7) %}
          {% set target_date = (now() + timedelta(days=day_offset)) %}
          {% set target_str = target_date.strftime('%Y-%m-%d') %}
          {% set target_md = target_date.strftime('%m-%d') %}
          {% set auto_winter_block = false %}
          {% if auto_winter and start_md != '' and end_md != '' %}
            {% if start_md <= end_md %}
              {% set auto_winter_block = start_md <= target_md <= end_md %}
            {% else %}
              {% set auto_winter_block = target_md >= start_md or target_md <= end_md %}
            {% endif %}
          {% endif %}
          {% set blocked = winter_mode or auto_winter_block or (day_offset < rain_delay) %}
          {% if not blocked %}
            {% for sched in range(1, 9) %}
              {% for run in range(1, 8) %}
                {% set entity = 'sensor.espyrain_controller_schedule_' ~ sched ~ '_next_run_' ~ run %}
                {% set run_time = states(entity) %}
                {% if run_time not in ['None', 'none', 'unknown', 'unavailable', 'Disabled', ''] and run_time[:10] == target_str %}
                  {% set ns.total = ns.total + 1 %}
                {% endif %}
              {% endfor %}
            {% endfor %}
          {% endif %}
        {% endfor %}
        {{ ns.total }} runs in 7 days
      attributes:
        days: >
          {% set winter_mode = is_state('switch.espyrain_controller_winter_mode', 'on') %}
          {% set rain_delay = states('number.espyrain_controller_rain_delay_days') | int(0) %}
          {% set auto_winter = is_state('input_boolean.espyrain_winter_auto_enable', 'on') %}
          {% set start_raw = states('input_datetime.espyrain_winter_start') %}
          {% set end_raw = states('input_datetime.espyrain_winter_end') %}
          {% set start_md = strptime(start_raw, '%Y-%m-%d').strftime('%m-%d') if start_raw not in ['unknown', 'unavailable', ''] else '' %}
          {% set end_md = strptime(end_raw, '%Y-%m-%d').strftime('%m-%d') if end_raw not in ['unknown', 'unavailable', ''] else '' %}
          {% set ns = namespace(days=[]) %}
          {% for day_offset in range(7) %}
            {% set target_date = (now() + timedelta(days=day_offset)) %}
            {% set target_str = target_date.strftime('%Y-%m-%d') %}
            {% set target_day_name = target_date.strftime('%A') %}
            {% set target_md = target_date.strftime('%m-%d') %}
            {% set auto_winter_block = false %}
            {% if auto_winter and start_md != '' and end_md != '' %}
              {% if start_md <= end_md %}
                {% set auto_winter_block = start_md <= target_md <= end_md %}
              {% else %}
                {% set auto_winter_block = target_md >= start_md or target_md <= end_md %}
              {% endif %}
            {% endif %}
            {% if winter_mode %}
              {% set blocked = true %}
              {% set block_reason = 'Winter mode active' %}
            {% elif auto_winter_block %}
              {% set blocked = true %}
              {% set block_reason = 'Auto winter mode' %}
            {% elif day_offset < rain_delay %}
              {% set blocked = true %}
              {% set block_reason = 'Rain delay (' ~ rain_delay ~ ' day' ~ ('' if rain_delay == 1 else 's') ~ ')' %}
            {% else %}
              {% set blocked = false %}
              {% set block_reason = '' %}
            {% endif %}
            {% set sched_ns = namespace(schedules=[]) %}
            {% for sched in range(1, 9) %}
              {% set name_entity = 'input_text.espyrain_schedule_' ~ sched ~ '_name' %}
              {% set sched_name = states(name_entity) | default('Schedule ' ~ sched, true) %}
              {% set summary_entity = 'sensor.espyrain_controller_schedule_' ~ sched ~ '_next_run' %}
              {% set summary = states(summary_entity) %}
              {% if summary not in ['Disabled', 'unknown', 'unavailable', ''] %}
                {% set run_ns = namespace(times=[]) %}
                {% for run in range(1, 8) %}
                  {% set entity = 'sensor.espyrain_controller_schedule_' ~ sched ~ '_next_run_' ~ run %}
                  {% set run_time = states(entity) %}
                  {% if run_time not in ['None', 'none', 'unknown', 'unavailable', 'Disabled', ''] %}
                    {% if run_time[:10] == target_str %}
                      {% set run_ns.times = run_ns.times + [run_time[11:]] %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {% if run_ns.times | length > 0 %}
                  {% set sched_ns.schedules = sched_ns.schedules + [
                    { 'id': sched, 'name': sched_name, 'times': run_ns.times }
                  ] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% set count_ns = namespace(count=0) %}
            {% for s in sched_ns.schedules %}
              {% set count_ns.count = count_ns.count + s.times | length %}
            {% endfor %}
            {% set day_entry = {
              'date': target_str,
              'day_name': target_day_name,
              'day_offset': day_offset,
              'blocked': blocked,
              'block_reason': block_reason,
              'schedules': sched_ns.schedules,
              'run_count': count_ns.count
            } %}
            {% set ns.days = ns.days + [day_entry] %}
          {% endfor %}
          {{ ns.days }}

    # ==========================================================
    #    Sprinkler Today Remaining Schedules
    #    Shows schedules still to run today (future times only).
    #    Format: "Schedule Name @ HH:MM, ..." or "None"
    # ==========================================================
    - name: "ESPyRain Today Remaining Schedules"
      unique_id: espyrain_today_remaining_schedules
      icon: mdi:calendar-today
      state: >
        {% set today = now().strftime('%Y-%m-%d') %}
        {% set current_time = now().strftime('%H:%M') %}
        {% set winter_mode = is_state('switch.espyrain_controller_winter_mode', 'on') %}
        {% set auto_winter = is_state('input_boolean.espyrain_winter_auto_enable', 'on') %}
        {% set start_raw = states('input_datetime.espyrain_winter_start') %}
        {% set end_raw = states('input_datetime.espyrain_winter_end') %}
        {% set start_md = strptime(start_raw, '%Y-%m-%d').strftime('%m-%d') if start_raw not in ['unknown', 'unavailable', ''] else '' %}
        {% set end_md = strptime(end_raw, '%Y-%m-%d').strftime('%m-%d') if end_raw not in ['unknown', 'unavailable', ''] else '' %}
        {% set today_md = now().strftime('%m-%d') %}
        {% set auto_winter_today = false %}
        {% if auto_winter and start_md != '' and end_md != '' %}
          {% if start_md <= end_md %}
            {% set auto_winter_today = start_md <= today_md <= end_md %}
          {% else %}
            {% set auto_winter_today = today_md >= start_md or today_md <= end_md %}
          {% endif %}
        {% endif %}
        {% set ns = namespace(remaining=[]) %}
        {% for sched in range(1, 9) %}
          {% set name_entity = 'input_text.espyrain_schedule_' ~ sched ~ '_name' %}
          {% set sched_name = states(name_entity) | default('Schedule ' ~ sched, true) %}
          {% if sched_name in ['unknown', 'unavailable', ''] %}
            {% set sched_name = 'Schedule ' ~ sched %}
          {% endif %}
          {% for run in range(1, 8) %}
            {% set entity = 'sensor.espyrain_controller_schedule_' ~ sched ~ '_next_run_' ~ run %}
            {% set run_time = states(entity) %}
            {% if run_time not in ['None', 'none', 'unknown', 'unavailable', 'Disabled', ''] %}
              {% if run_time[:10] == today and run_time[11:] >= current_time %}
                {% set ns.remaining = ns.remaining + [run_time[11:] ~ '|' ~ sched_name] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {% if winter_mode or auto_winter_today %}
          Winter mode
        {% elif ns.remaining | length == 0 %}
          No more runs today
        {% else %}
          {% set sorted_runs = ns.remaining | sort %}
          {% set out = namespace(lines=[]) %}
          {% for item in sorted_runs %}
            {% set parts = item.split('|') %}
            {% set out.lines = out.lines + [parts[0] ~ ' ' ~ parts[1]] %}
          {% endfor %}
          {{ out.lines | join('\n') }}
        {% endif %}

    # ==========================================================
    #    Sprinkler Tomorrow Schedules
    #    Shows all scheduled runs for tomorrow.
    #    Format: "Schedule Name @ HH:MM, ..." or "None"
    # ==========================================================
    - name: "ESPyRain Tomorrow Schedules"
      unique_id: espyrain_tomorrow_schedules
      icon: mdi:calendar-arrow-right
      state: >
        {% set tomorrow_dt = now() + timedelta(days=1) %}
        {% set tomorrow = tomorrow_dt.strftime('%Y-%m-%d') %}
        {% set winter_mode = is_state('switch.espyrain_controller_winter_mode', 'on') %}
        {% set auto_winter = is_state('input_boolean.espyrain_winter_auto_enable', 'on') %}
        {% set start_raw = states('input_datetime.espyrain_winter_start') %}
        {% set end_raw = states('input_datetime.espyrain_winter_end') %}
        {% set start_md = strptime(start_raw, '%Y-%m-%d').strftime('%m-%d') if start_raw not in ['unknown', 'unavailable', ''] else '' %}
        {% set end_md = strptime(end_raw, '%Y-%m-%d').strftime('%m-%d') if end_raw not in ['unknown', 'unavailable', ''] else '' %}
        {% set tomorrow_md = tomorrow_dt.strftime('%m-%d') %}
        {% set auto_winter_tomorrow = false %}
        {% if auto_winter and start_md != '' and end_md != '' %}
          {% if start_md <= end_md %}
            {% set auto_winter_tomorrow = start_md <= tomorrow_md <= end_md %}
          {% else %}
            {% set auto_winter_tomorrow = tomorrow_md >= start_md or tomorrow_md <= end_md %}
          {% endif %}
        {% endif %}
        {% set ns = namespace(runs=[]) %}
        {% for sched in range(1, 9) %}
          {% set name_entity = 'input_text.espyrain_schedule_' ~ sched ~ '_name' %}
          {% set sched_name = states(name_entity) | default('Schedule ' ~ sched, true) %}
          {% if sched_name in ['unknown', 'unavailable', ''] %}
            {% set sched_name = 'Schedule ' ~ sched %}
          {% endif %}
          {% for run in range(1, 8) %}
            {% set entity = 'sensor.espyrain_controller_schedule_' ~ sched ~ '_next_run_' ~ run %}
            {% set run_time = states(entity) %}
            {% if run_time not in ['None', 'none', 'unknown', 'unavailable', 'Disabled', ''] %}
              {% if run_time[:10] == tomorrow %}
                {% set ns.runs = ns.runs + [run_time[11:] ~ '|' ~ sched_name] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {% if winter_mode or auto_winter_tomorrow %}
          Winter mode
        {% elif ns.runs | length == 0 %}
          No runs scheduled
        {% else %}
          {% set sorted_runs = ns.runs | sort %}
          {% set out = namespace(lines=[]) %}
          {% for item in sorted_runs %}
            {% set parts = item.split('|') %}
            {% set out.lines = out.lines + [parts[0] ~ ' ' ~ parts[1]] %}
          {% endfor %}
          {{ out.lines | join('\n') }}
        {% endif %}

    # ==========================================================
    #    Sprinkler Next Scheduled Run
    #    Earliest upcoming run across all 8 schedules.
    #    Uses next_run_1 (the soonest) from each schedule.
    #    Format: "Schedule Name: YYYY-MM-DD HH:MM" or "No upcoming runs"
    # ==========================================================
    - name: "ESPyRain Next Scheduled Run"
      unique_id: espyrain_next_scheduled_run
      icon: mdi:clock-fast
      state: >
        {% set winter_mode = is_state('switch.espyrain_controller_winter_mode', 'on') %}
        {% set rain_delay = states('number.espyrain_controller_rain_delay_days') | int(0) %}
        {% set auto_winter = is_state('input_boolean.espyrain_winter_auto_enable', 'on') %}
        {% set start_raw = states('input_datetime.espyrain_winter_start') %}
        {% set end_raw = states('input_datetime.espyrain_winter_end') %}
        {% set start_md = strptime(start_raw, '%Y-%m-%d').strftime('%m-%d') if start_raw not in ['unknown', 'unavailable', ''] else '' %}
        {% set end_md = strptime(end_raw, '%Y-%m-%d').strftime('%m-%d') if end_raw not in ['unknown', 'unavailable', ''] else '' %}
        {% set blocked_dates = namespace(items=[]) %}
        {% for day_offset in range(rain_delay) %}
          {% set blocked_dates.items = blocked_dates.items + [(now() + timedelta(days=day_offset)).strftime('%Y-%m-%d')] %}
        {% endfor %}
        {% set ns = namespace(earliest='', earliest_name='') %}
        {% for sched in range(1, 9) %}
          {% set name_entity = 'input_text.espyrain_schedule_' ~ sched ~ '_name' %}
          {% set sched_name = states(name_entity) | default('Schedule ' ~ sched, true) %}
          {% if sched_name in ['unknown', 'unavailable', ''] %}
            {% set sched_name = 'Schedule ' ~ sched %}
          {% endif %}
          {% for run in range(1, 8) %}
            {% set entity = 'sensor.espyrain_controller_schedule_' ~ sched ~ '_next_run_' ~ run %}
            {% set run_time = states(entity) %}
            {% if run_time not in ['None', 'none', 'unknown', 'unavailable', 'Disabled', ''] %}
              {% set run_date = run_time[:10] %}
              {% set run_md = run_date[5:10] %}
              {% set auto_winter_run = false %}
              {% if auto_winter and start_md != '' and end_md != '' %}
                {% if start_md <= end_md %}
                  {% set auto_winter_run = start_md <= run_md <= end_md %}
                {% else %}
                  {% set auto_winter_run = run_md >= start_md or run_md <= end_md %}
                {% endif %}
              {% endif %}
              {% set blocked = winter_mode or (run_date in blocked_dates.items) or auto_winter_run %}
              {% if not blocked and (ns.earliest == '' or run_time < ns.earliest) %}
                {% set ns.earliest = run_time %}
                {% set ns.earliest_name = sched_name %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {% if ns.earliest == '' %}
          No upcoming runs
        {% else %}
          {{ ns.earliest }}: {{ ns.earliest_name }}
        {% endif %}

    # ==========================================================
    #    Sprinkler Active Summary
    #    Current watering status with station, time, and progress.
    #    Dynamic icon: water-off when idle, water when active.
    # ==========================================================
    - name: "ESPyRain Active Summary"
      unique_id: espyrain_active_summary
      icon: >
        {% set status = states('sensor.espyrain_controller_status') %}
        {% if status in ['Idle', 'unknown', 'unavailable'] %}
          mdi:water-off
        {% else %}
          mdi:water
        {% endif %}
      state: >
        {% set status = states('sensor.espyrain_controller_status') %}
        {% if status in ['Idle', 'unknown', 'unavailable'] %}
          Not watering
        {% else %}
          {% set station = states('sensor.espyrain_controller_active_station') | default('Unknown', true) %}
          {% set remaining = states('sensor.espyrain_controller_station_time_remaining') | int(0) %}
          {% set progress = states('sensor.espyrain_controller_queue_progress') | int(0) %}
          {% if station in ['unknown', 'unavailable', ''] %}
            {% set station = 'Unknown' %}
          {% endif %}
          {% if status == 'Paused' %}
            {{ station }} -- Paused ({{ progress }}%)
          {% elif 'Soak' in status %}
            {{ station }} -- Soak resting ({{ progress }}%)
          {% else %}
            {{ station }} -- {{ remaining }}s remaining ({{ progress }}%)
          {% endif %}
        {% endif %}

    - name: "ESPyRain Active Schedules Count"
      unique_id: espyrain_active_schedules_count
      icon: mdi:counter
      unit_of_measurement: "schedules"
      state: >
        {% set ns = namespace(count=0) %}
        {% for i in range(1, 9) %}
          {% if is_state('input_boolean.espyrain_schedule_' ~ i ~ '_enabled', 'on') %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}
        {% endfor %}
        {{ ns.count }}

    # ==========================================================
    #    Station Coupled To Sensors (1-16)
    #    For each station N, checks whether any OTHER station H
    #    has station N in its coupling checkboxes. This identifies
    #    "dependent" stations (ones that run as followers).
    #    State: "Coupled to S3, S7" or "Independent"
    # ==========================================================

    - name: "ESPyRain Station 1 Coupled To"
      unique_id: espyrain_station_1_coupled_to
      icon: mdi:link-variant
      state: >
        {% set ns = namespace(heads=[]) %}
        {% for h in range(1, 17) %}
          {% if h != 1 and is_state('input_boolean.espyrain_station_' ~ h ~ '_coupled_1', 'on') %}
            {% set ns.heads = ns.heads + ['S' ~ h] %}
          {% endif %}
        {% endfor %}
        {{ 'Coupled to ' ~ ns.heads | join(', ') if ns.heads else 'Independent' }}

