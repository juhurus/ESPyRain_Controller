# ════════════════════════════════════════════════════════════
# preserves the original zone time during pause to freeze and resume 
# the progress bars properly.
# ════════════════════════════════════════════════════════════
- sensor:
    - name: "Sprinkler Zone Original Time"
      unique_id: sprinkler_zone_original_time
      state: >
        {% set is_paused = is_state('binary_sensor.sprinkler_controller_paused', 'on') %}
        {% set is_running = is_state('switch.sprinkler_controller_sprinkler_system', 'on') %}
        {% set current_zone = states('sensor.sprinkler_controller_current_station_name') %}
        {% set zone_time = states('sensor.sprinkler_controller_active_zone_time') | float(0) %}
        {% set prev_zone = states('sensor.sprinkler_zone_original_time_previous_zone') %}
        {% set prev_time = states('sensor.sprinkler_zone_original_time') | float(0) %}
        {% if is_paused %}
          {{ prev_time }}
        {% elif not is_running %}
          0
        {% elif current_zone in ['Idle', 'unknown', 'unavailable'] %}
          0
        {% elif current_zone != prev_zone and zone_time > 0 %}
          {{ zone_time }}
        {% else %}
          {{ prev_time }}
        {% endif %}
      unit_of_measurement: 's'
      device_class: duration
      
    - name: "Sprinkler Zone Original Time Previous Zone"
      unique_id: sprinkler_zone_original_time_previous_zone
      state: >
        {% set is_paused = is_state('binary_sensor.sprinkler_controller_paused', 'on') %}
        {% set is_running = is_state('switch.sprinkler_controller_sprinkler_system', 'on') %}
        {% set current_zone = states('sensor.sprinkler_controller_current_station_name') %}
        {% set prev_zone = states('sensor.sprinkler_zone_original_time_previous_zone') %}
        {% if is_paused %}
          {{ prev_zone }}
        {% elif not is_running %}
          Idle
        {% elif current_zone not in ['Idle', 'unknown', 'unavailable'] %}
          {{ current_zone }}
        {% else %}
          Idle
        {% endif %}

    # Zone Progress Percentage - preserves value during pause
    # Calculate elapsed seconds (accumulated across pause/resume)
    - name: "Sprinkler Zone Elapsed Seconds"
      unique_id: sprinkler_zone_elapsed_seconds
      state: >
        {% set is_paused = is_state('binary_sensor.sprinkler_controller_paused', 'on') %}
        {% set is_running = is_state('switch.sprinkler_controller_sprinkler_system', 'on') %}
        
        {% if not is_running and not is_paused %}
          {# System off - reset #}
          0
        {% elif is_paused %}
          {# PAUSED - keep last value #}
          {{ states('sensor.sprinkler_zone_elapsed_seconds') | float(0) }}
        {% else %}
          {# RUNNING - calculate current + stored #}
          {% set locked_original = states('input_number.sprinkler_zone_original_time_locked') | float(1) %}
          {% set current_remaining = states('sensor.sprinkler_controller_zone_time_remaining') | float(0) %}
          {% set active_zone = states('sensor.sprinkler_controller_active_zone_time') | float(1) %}
          
          {# Current segment elapsed #}
          {% set current_elapsed = active_zone - current_remaining %}
          
          {# Add what was stored before pause #}
          {% set stored = states('input_number.sprinkler_zone_elapsed_at_pause') | float(0) %}
          
          {{ (stored + current_elapsed) | round(0) }}
        {% endif %}
      unit_of_measurement: 's'
      device_class: duration
    
    # Zone progress percentage
    - name: "Sprinkler Zone Progress Percent"
      unique_id: sprinkler_zone_progress_percent
      state: >
        {% set is_running = is_state('switch.sprinkler_controller_sprinkler_system', 'on') %}
        {% set is_paused = is_state('binary_sensor.sprinkler_controller_paused', 'on') %}
        
        {% if not is_running and not is_paused %}
          0
        {% else %}
          {% set locked_original = states('input_number.sprinkler_zone_original_time_locked') | float(1) %}
          {% set elapsed = states('sensor.sprinkler_zone_elapsed_seconds') | float(0) %}
          {% if locked_original > 0 %}
            {{ (elapsed / locked_original * 100) | round(1) }}
          {% else %}
            0
          {% endif %}
        {% endif %}
      unit_of_measurement: '%'
    
    # Queue progress percentage (unchanged from before)
    - name: "Sprinkler Queue Progress Percent"
      unique_id: sprinkler_queue_progress_percent
      state: >
        {% set is_paused = is_state('binary_sensor.sprinkler_controller_paused', 'on') %}
        {% set is_running = is_state('switch.sprinkler_controller_sprinkler_system', 'on') %}
        {% set prev_percent = states('sensor.sprinkler_queue_progress_percent') | float(0) %}
        
        {% if is_paused %}
          {{ prev_percent }}
        {% elif not is_running %}
          0
        {% else %}
          {% set total = states('sensor.sprinkler_controller_queue_total_time') | float(1) %}
          {% set remain = states('sensor.sprinkler_controller_queue_time_remaining') | float(0) %}
          {% if total > 0 %}
            {{ ((total - remain) / total * 100) | round(1) }}
          {% else %}
            0
          {% endif %}
        {% endif %}
      unit_of_measurement: '%'
