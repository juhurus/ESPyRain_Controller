# ════════════════════════════════════════════════════════════════
# RESET LAST_RUN WHEN SCHEDULE ENABLED
# Add to: config/automations/
# ════════════════════════════════════════════════════════════════
#
# This automation resets the ESP's last_run timestamp to 0 when:
# 1. Schedule is enabled (turned on)
# 2. Days mode is changed TO an interval mode
#
# Result: Schedule treats itself as "never ran" and will run at
# next available time (today if time hasn't passed, tomorrow if it has)
# ════════════════════════════════════════════════════════════════

# Reset Schedule 1 Last Run
- id: reset_schedule_1_last_run_on_enable
  alias: "Reset Schedule 1 Last Run on Enable"
  trigger:
    # Trigger when schedule enabled
    - platform: state
      entity_id: input_boolean.sprinkler_schedule_1_enabled
      to: 'on'
    # Trigger when days mode changes TO interval
    - platform: state
      entity_id: input_select.sprinkler_schedule_1_days
      to: 
        - 'Every 2 Days'
        - 'Every 3 Days'
        - 'Every 4 Days'
        - 'Every 5 Days'
        - 'Every 6 Days'
        - 'Every 7 Days'
  condition:
    # Only if schedule is enabled
    - condition: state
      entity_id: input_boolean.sprinkler_schedule_1_enabled
      state: 'on'
  action:
    # v2.0 note: reset-last-run button entity is not exposed by ESP.
    # Keep automation harmless until a dedicated v2 reset service/button exists.
    - service: logbook.log
      data:
        name: Sprinkler
        message: "Schedule 1 last_run reset requested, but no v2 reset button is exposed."

