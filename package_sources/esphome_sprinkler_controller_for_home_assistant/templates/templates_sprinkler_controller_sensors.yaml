# ══════════════════════════════════════════════════════════════
# Sprinkler Controller v2.0 - HA Template Sensors
# ══════════════════════════════════════════════════════════════
# Add to configuration.yaml:
#   template: !include template_sensors.yaml
#
# Or if you already have a template: section, merge these entries.
#
# ESP entity domains used:
#   sensor.*  - schedule names, next-run data, status, active station, queue status
#   sensor.*       - station_time_remaining, queue_progress
#   switch.*       - sprinkler_winter_mode
#   number.*       - rain_delay_days
#
# Last updated: 2026-02-17
# ══════════════════════════════════════════════════════════════

- sensor:
    # ──────────────────────────────────────────────────────────
    # 1. Sprinkler 7-Day Forecast
    #    State: count of unblocked schedule runs in the next 7 days
    #    Attribute "days": list of dicts, one per day, each containing
    #      date, day_name, schedules list, and blocking status
    # ──────────────────────────────────────────────────────────
    - name: "Sprinkler 7 Day Forecast"
      unique_id: sprinkler_7_day_forecast
      icon: mdi:calendar-week
      state: >
        {% set rain_delay = states('number.sprinkler_controller_rain_delay_days') | int(0) %}
        {% set winter_mode = is_state('switch.sprinkler_controller_winter_mode', 'on') %}
        {% set ns = namespace(total=0) %}
        {% for sched in range(1, 9) %}
          {% for run in range(1, 8) %}
            {% set entity = 'sensor.sprinkler_controller_schedule_' ~ sched ~ '_next_run_' ~ run %}
            {% set run_time = states(entity) %}
            {% if run_time not in ['None', 'none', 'unknown', 'unavailable', 'Disabled', ''] %}
              {% if run_time | regex_match('^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}$') %}
                {% set run_date = run_time[:10] %}
                {% for day_offset in range(7) %}
                  {% set check_date = (now() + timedelta(days=day_offset)).strftime('%Y-%m-%d') %}
                  {% if run_date == check_date %}
                    {% if not winter_mode and day_offset >= rain_delay %}
                      {% set ns.total = ns.total + 1 %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {{ ns.total }} runs in 7 days
      attributes:
        days: >
          {% set rain_delay = states('number.sprinkler_controller_rain_delay_days') | int(0) %}
          {% set winter_mode = is_state('switch.sprinkler_controller_winter_mode', 'on') %}
          {% set ns = namespace(days=[]) %}
          {% for day_offset in range(7) %}
            {% set target_date = (now() + timedelta(days=day_offset)) %}
            {% set target_str = target_date.strftime('%Y-%m-%d') %}
            {% set target_day_name = target_date.strftime('%A') %}
            {# Determine blocking reason for this day #}
            {% if winter_mode %}
              {% set blocked = true %}
              {% set block_reason = 'Winter mode' %}
            {% elif day_offset < rain_delay %}
              {% set blocked = true %}
              {% set block_reason = 'Rain delay (' ~ rain_delay ~ ' days)' %}
            {% else %}
              {% set blocked = false %}
              {% set block_reason = '' %}
            {% endif %}
            {# Collect schedules that have runs on this day #}
            {% set sched_ns = namespace(schedules=[]) %}
            {% for sched in range(1, 9) %}
              {% set name_entity = 'input_text.sprinkler_schedule_' ~ sched ~ '_name' %}
              {% set sched_name = states(name_entity) | default('Schedule ' ~ sched, true) %}
              {# Check summary sensor to see if schedule is disabled #}
              {% set summary_entity = 'sensor.sprinkler_controller_schedule_' ~ sched ~ '_next_run' %}
              {% set summary = states(summary_entity) %}
              {% if summary not in ['Disabled', 'unknown', 'unavailable', ''] %}
                {% set run_ns = namespace(times=[]) %}
                {% for run in range(1, 8) %}
                  {% set entity = 'sensor.sprinkler_controller_schedule_' ~ sched ~ '_next_run_' ~ run %}
                  {% set run_time = states(entity) %}
                  {% if run_time not in ['None', 'none', 'unknown', 'unavailable', 'Disabled', ''] %}
                    {% if run_time[:10] == target_str %}
                      {% set run_ns.times = run_ns.times + [run_time[11:]] %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {% if run_ns.times | length > 0 %}
                  {% set sched_ns.schedules = sched_ns.schedules + [
                    { 'id': sched, 'name': sched_name, 'times': run_ns.times }
                  ] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {# Count total individual run times across all schedules for this day #}
            {% set count_ns = namespace(count=0) %}
            {% for s in sched_ns.schedules %}
              {% set count_ns.count = count_ns.count + s.times | length %}
            {% endfor %}
            {% set day_entry = {
              'date': target_str,
              'day_name': target_day_name,
              'day_offset': day_offset,
              'blocked': blocked,
              'block_reason': block_reason,
              'schedules': sched_ns.schedules,
              'run_count': count_ns.count
            } %}
            {% set ns.days = ns.days + [day_entry] %}
          {% endfor %}
          {{ ns.days }}

    # ──────────────────────────────────────────────────────────
    # 2. Sprinkler Today Remaining Schedules
    #    Shows schedules still to run today (future times only).
    #    Format: "Schedule Name @ HH:MM, ..." or "None"
    # ──────────────────────────────────────────────────────────
    - name: "Sprinkler Today Remaining Schedules"
      unique_id: sprinkler_today_remaining_schedules
      icon: mdi:calendar-today
      state: >
        {% set rain_delay = [
          states('number.sprinkler_controller_rain_delay_days') | int(0),
          states('input_number.sprinkler_rain_delay_days') | int(0)
        ] | max %}
        {% set winter_mode = is_state('switch.sprinkler_controller_winter_mode', 'on') %}
        {% if winter_mode %}
          Blocked: Winter Mode is ON
        {% elif rain_delay > 0 %}
          📛 Blocked by rain delay ({{ rain_delay }} day{{ 's' if rain_delay != 1 else '' }})
        {% else %}
        {% set today = now().strftime('%Y-%m-%d') %}
        {% set current_time = now().strftime('%H:%M') %}
        {% set ns = namespace(remaining=[]) %}
        {% for sched in range(1, 9) %}
          {% set name_entity = 'input_text.sprinkler_schedule_' ~ sched ~ '_name' %}
          {% set sched_name = states(name_entity) | default('Schedule ' ~ sched, true) %}
          {% if sched_name in ['unknown', 'unavailable', ''] %}
            {% set sched_name = 'Schedule ' ~ sched %}
          {% endif %}
          {% for run in range(1, 8) %}
            {% set entity = 'sensor.sprinkler_controller_schedule_' ~ sched ~ '_next_run_' ~ run %}
            {% set run_time = states(entity) %}
            {% if run_time not in ['None', 'none', 'unknown', 'unavailable', 'Disabled', ''] %}
              {# Check date is today AND time is in the future #}
              {% if run_time[:10] == today and run_time[11:] >= current_time %}
                {% set ns.remaining = ns.remaining + [run_time[11:] ~ '|' ~ sched_name] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {% if ns.remaining | length == 0 %}
          No more runs today
        {% else %}
          {% set sorted_runs = ns.remaining | sort %}
          {% set out = namespace(lines=[]) %}
          {% for item in sorted_runs %}
            {% set parts = item.split('|') %}
            {% set out.lines = out.lines + [parts[0] ~ ' ' ~ parts[1]] %}
          {% endfor %}
          {{ out.lines | join('\n') }}
        {% endif %}
        {% endif %}

    # ──────────────────────────────────────────────────────────
    # 3. Sprinkler Tomorrow Schedules
    #    Shows all scheduled runs for tomorrow.
    #    Format: "Schedule Name @ HH:MM, ..." or "None"
    # ──────────────────────────────────────────────────────────
    - name: "Sprinkler Tomorrow Schedules"
      unique_id: sprinkler_tomorrow_schedules
      icon: mdi:calendar-arrow-right
      state: >
        {% set rain_delay = [
          states('number.sprinkler_controller_rain_delay_days') | int(0),
          states('input_number.sprinkler_rain_delay_days') | int(0)
        ] | max %}
        {% set winter_mode = is_state('switch.sprinkler_controller_winter_mode', 'on') %}
        {% if winter_mode %}
          Blocked: Winter Mode is ON
        {% elif rain_delay > 1 %}
          📛 Blocked by rain delay ({{ rain_delay }} day{{ 's' if rain_delay != 1 else '' }})
        {% else %}
        {% set tomorrow = (now() + timedelta(days=1)).strftime('%Y-%m-%d') %}
        {% set ns = namespace(runs=[]) %}
        {% for sched in range(1, 9) %}
          {% set name_entity = 'input_text.sprinkler_schedule_' ~ sched ~ '_name' %}
          {% set sched_name = states(name_entity) | default('Schedule ' ~ sched, true) %}
          {% if sched_name in ['unknown', 'unavailable', ''] %}
            {% set sched_name = 'Schedule ' ~ sched %}
          {% endif %}
          {% for run in range(1, 8) %}
            {% set entity = 'sensor.sprinkler_controller_schedule_' ~ sched ~ '_next_run_' ~ run %}
            {% set run_time = states(entity) %}
            {% if run_time not in ['None', 'none', 'unknown', 'unavailable', 'Disabled', ''] %}
              {% if run_time[:10] == tomorrow %}
                {% set ns.runs = ns.runs + [run_time[11:] ~ '|' ~ sched_name] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {% if ns.runs | length == 0 %}
          No runs scheduled
        {% else %}
          {% set sorted_runs = ns.runs | sort %}
          {% set out = namespace(lines=[]) %}
          {% for item in sorted_runs %}
            {% set parts = item.split('|') %}
            {% set out.lines = out.lines + [parts[0] ~ ' ' ~ parts[1]] %}
          {% endfor %}
          {{ out.lines | join('\n') }}
        {% endif %}
        {% endif %}

    # ──────────────────────────────────────────────────────────
    # 4. Sprinkler Next Scheduled Run
    #    Earliest upcoming run across all 8 schedules.
    #    Uses next_run_1 (the soonest) from each schedule.
    #    Format: "Schedule Name: YYYY-MM-DD HH:MM" or "No upcoming runs"
    # ──────────────────────────────────────────────────────────
    - name: "Sprinkler Next Scheduled Run"
      unique_id: sprinkler_next_scheduled_run
      icon: mdi:clock-fast
      state: >
        {% set rain_delay = [
          states('number.sprinkler_controller_rain_delay_days') | int(0),
          states('input_number.sprinkler_rain_delay_days') | int(0)
        ] | max %}
        {% set winter_mode = is_state('switch.sprinkler_controller_winter_mode', 'on') %}
        {% if winter_mode %}
          Blocked: Winter Mode is ON
        {% else %}
        {% set earliest_allowed_date = (now() + timedelta(days=rain_delay)).strftime('%Y-%m-%d') %}
        {% set ns = namespace(earliest='', earliest_name='') %}
        {% for sched in range(1, 9) %}
          {% set name_entity = 'input_text.sprinkler_schedule_' ~ sched ~ '_name' %}
          {% set sched_name = states(name_entity) | default('Schedule ' ~ sched, true) %}
          {% if sched_name in ['unknown', 'unavailable', ''] %}
            {% set sched_name = 'Schedule ' ~ sched %}
          {% endif %}
          {% for run in range(1, 8) %}
            {% set entity = 'sensor.sprinkler_controller_schedule_' ~ sched ~ '_next_run_' ~ run %}
            {% set run_time = states(entity) %}
            {% if run_time not in ['None', 'none', 'unknown', 'unavailable', 'Disabled', ''] %}
              {% if run_time[:10] >= earliest_allowed_date %}
                {# ISO date-time string compare is valid for YYYY-MM-DD HH:MM #}
                {% if ns.earliest == '' or run_time < ns.earliest %}
                  {% set ns.earliest = run_time %}
                  {% set ns.earliest_name = sched_name %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {% if ns.earliest == '' %}
          {% if rain_delay > 0 %}
            No runs scheduled after rain delay
          {% else %}
            No upcoming runs
          {% endif %}
        {% else %}
          {{ ns.earliest }}: {{ ns.earliest_name }}
        {% endif %}
        {% endif %}

    # ──────────────────────────────────────────────────────────
    # 5. Sprinkler Active Summary
    #    Current watering status with station, time, and progress.
    #    Dynamic icon: water-off when idle, water when active.
    # ──────────────────────────────────────────────────────────
    - name: "Sprinkler Active Summary"
      unique_id: sprinkler_active_summary
      icon: >
        {% set status = states('sensor.sprinkler_controller_sprinkler_status') %}
        {% if status in ['Idle', 'unknown', 'unavailable'] %}
          mdi:water-off
        {% else %}
          mdi:water
        {% endif %}
      state: >
        {% set status = states('sensor.sprinkler_controller_sprinkler_status') %}
        {% if status in ['Idle', 'unknown', 'unavailable'] %}
          Not watering
        {% else %}
          {% set station = states('sensor.sprinkler_controller_active_station') | default('Unknown', true) %}
          {% set remaining = states('sensor.sprinkler_controller_station_time_remaining') | int(0) %}
          {% set progress = states('sensor.sprinkler_controller_queue_progress') | int(0) %}
          {% if station in ['unknown', 'unavailable', ''] %}
            {% set station = 'Unknown' %}
          {% endif %}
          {% if status == 'Paused' %}
            {{ station }} -- Paused ({{ progress }}%)
          {% elif 'Soak' in status %}
            {{ station }} -- Soak resting ({{ progress }}%)
          {% else %}
            {{ station }} -- {{ remaining }}s remaining ({{ progress }}%)
          {% endif %}
        {% endif %}

    # ──────────────────────────────────────────────────────────
    # 6. Station Coupled To Sensors (1-16)
    #    For each station N, checks whether any OTHER station H
    #    has station N in its coupling checkboxes. This identifies
    #    "dependent" stations (ones that run as followers).
    #    State: "Coupled to S3, S7" or "Independent"
    # ──────────────────────────────────────────────────────────

    - name: "Sprinkler Station 1 Coupled To"
      unique_id: sprinkler_station_1_coupled_to
      icon: mdi:link-variant
      state: >
        {% set ns = namespace(heads=[]) %}
        {% for h in range(1, 17) %}
          {% if h != 1 and is_state('input_boolean.sprinkler_station_' ~ h ~ '_coupled_1', 'on') %}
            {% set ns.heads = ns.heads + ['S' ~ h] %}
          {% endif %}
        {% endfor %}
        {{ 'Coupled to ' ~ ns.heads | join(', ') if ns.heads else 'Independent' }}

