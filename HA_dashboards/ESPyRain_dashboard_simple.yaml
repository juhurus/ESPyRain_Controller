title: ESPyRain Starter
views:
  - title: Overview
    path: overview
    icon: mdi:sprinkler-variant
    cards:
      - type: markdown
        content: >
          # ESPyRain Controller Starter Dashboard


          This dashboard uses only built-in Home Assistant cards.

          It is intended as the simplest way to get started without HACS or
          custom cards.
      - type: entities
        title: Controller Status
        show_header_toggle: false
        entities:
          - entity: sensor.espyrain_controller_status
            name: Status
          - entity: sensor.espyrain_controller_queue
            name: Queue
          - entity: sensor.espyrain_next_scheduled_run
            name: Next scheduled run
          - entity: sensor.espyrain_controller_esp_date_time
            name: Controller time
          - entity: binary_sensor.espyrain_controller_ha_link
            name: HA link
          - entity: sensor.espyrain_controller_connection_status
            name: Connection status
          - entity: sensor.espyrain_controller_ip_address
            name: IP address
          - entity: sensor.espyrain_controller_wifi_signal
            name: Wi-Fi signal
          - entity: sensor.espyrain_controller_firmware_version
            name: Firmware version
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.espyrain_auto_run_block_active
            state: "on"
        card:
          type: markdown
          content: >
            ## HIGH SOIL MOISTURE

            Automatic scheduled watering is currently being skipped.

            Reason: **{{ states('sensor.espyrain_auto_run_block_reason') }}**.

            Current value: **{{ states('sensor.espyrain_soil_moisture_value') }}%**.

            Threshold: **{{ states('input_number.espyrain_soil_moisture_skip_threshold') | int(0) }}%**.
      - type: horizontal-stack
        cards:
          - type: button
            entity: button.espyrain_controller_pause
            name: Pause
            icon: mdi:pause-circle
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.espyrain_controller_pause
          - type: button
            entity: button.espyrain_controller_next_station
            name: Next
            icon: mdi:skip-next-circle
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.espyrain_controller_next_station
          - type: button
            entity: button.espyrain_controller_resume
            name: Resume
            icon: mdi:play-circle
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.espyrain_controller_resume
          - type: button
            entity: button.espyrain_controller_stop
            name: Stop
            icon: mdi:stop-circle
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.espyrain_controller_stop
          - type: button
            entity: button.espyrain_controller_restart_esp
            name: Restart ESP
            icon: mdi:restart
            tap_action:
              action: toggle
              confirmation:
                text: Are you sure you want to restart the sprinkler controller?
      - type: entities
        title: Manual Run
        show_header_toggle: false
        entities:
          - entity: input_select.espyrain_manual_station
          - entity: input_datetime.espyrain_manual_runtime
          - entity: script.espyrain_manual_run
            name: Start Manual Run
      - type: entities
        title: Core Settings
        show_header_toggle: false
        entities:
          - entity: number.espyrain_controller_number_of_stations
            name: Number of stations
          - entity: number.espyrain_controller_number_of_schedules
            name: Number of schedules
          - entity: switch.espyrain_controller_winter_mode
            name: Winter mode
          - entity: switch.espyrain_controller_master_valve_enabled
            name: Master valve enabled
          - entity: number.espyrain_controller_master_valve_pin
            name: Master valve pin
          - entity: number.espyrain_controller_master_valve_delay_ms
            name: Master valve delay
          - entity: number.espyrain_controller_soak_rest_minutes
            name: Soak rest minutes
          - entity: number.espyrain_controller_rain_delay_days
            name: Rain delay days
          - entity: number.espyrain_controller_auto_resume_after_minutes
            name: Auto resume after (minutes)
          - entity: switch.espyrain_controller_bypass_interval_check
            name: Bypass interval check
          - entity: input_boolean.espyrain_soil_moisture_skip_enabled
            name: Soil moisture skip
          - entity: input_number.espyrain_soil_moisture_skip_threshold
            name: Soil moisture threshold (%)
          - entity: sensor.espyrain_soil_moisture_value
            name: Soil moisture average
          - entity: binary_sensor.espyrain_soil_moisture_block_active
            name: Soil moisture block active
          - entity: input_boolean.espyrain_notifications
          - entity: input_text.espyrain_notify_service
            name: Notification service(s)
      - type: markdown
        content: >
          Leave **Notification service(s)** blank to use Home Assistant
          persistent notifications.


          You can also enter one or more comma-separated `notify.*` services,
          for example:

          `notify.mobile_app_my_phone, notify.telegram`
      - type: entities
        title: Helpful Sensors
        show_header_toggle: false
        entities:
          - entity: sensor.espyrain_controller_active_station
            name: Active station
          - entity: sensor.espyrain_controller_current_schedule
            name: Current schedule
          - entity: sensor.espyrain_controller_station_time_remaining_formatted
            name: Station time remaining
          - entity: sensor.espyrain_controller_total_queue_time_remaining_formatted
            name: Total queue remaining
          - entity: sensor.espyrain_controller_uptime
            name: Uptime
          - entity: sensor.espyrain_controller_free_memory
            name: Free memory
