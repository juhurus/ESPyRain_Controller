# v2 station watering visual binary sensors (dynamic valve icon)
- binary_sensor:
    - name: "Sprinkler Controller HA Link"
      unique_id: sprinkler_controller_ha_link
      state: >
        {% set conn = states('sensor.sprinkler_controller_connection_status') %}
        {{ conn not in ['unknown', 'unavailable', 'None', ''] and 'Connected' in conn }}
      icon: >
        {% if is_state('binary_sensor.sprinkler_controller_ha_link', 'on') %}
          mdi:lan-connect
        {% else %}
          mdi:lan-disconnect
        {% endif %}
    - name: "Sprinkler Controller Paused"
      unique_id: sprinkler_controller_paused
      state: >
        {% set status = states('sensor.sprinkler_controller_sprinkler_status') %}
        {{ status == 'Paused' }}
      icon: >
        {% if is_state('binary_sensor.sprinkler_controller_paused', 'on') %}
          mdi:pause-circle
        {% else %}
          mdi:play-circle
        {% endif %}
    - name: "Sprinkler Station 1 Watering"
