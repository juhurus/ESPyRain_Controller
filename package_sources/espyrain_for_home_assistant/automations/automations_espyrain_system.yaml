# ================================================================
# Show station names in the manual run dropdown and
# respect the active station count.
# ================================================================
- id: espyrain_manual_station_options
  alias: "ESPyRain: Manual Station Options"
  trigger:
    - platform: homeassistant
      event: start
    - platform: state
      entity_id: number.espyrain_controller_number_of_stations
    - platform: state
      entity_id:
        - input_text.espyrain_station_1_name
        - input_text.espyrain_station_2_name
        - input_text.espyrain_station_3_name
        - input_text.espyrain_station_4_name
        - input_text.espyrain_station_5_name
        - input_text.espyrain_station_6_name
        - input_text.espyrain_station_7_name
        - input_text.espyrain_station_8_name
        - input_text.espyrain_station_9_name
        - input_text.espyrain_station_10_name
        - input_text.espyrain_station_11_name
        - input_text.espyrain_station_12_name
        - input_text.espyrain_station_13_name
        - input_text.espyrain_station_14_name
        - input_text.espyrain_station_15_name
        - input_text.espyrain_station_16_name
  action:
    - variables:
        station_count_raw: "{{ states('number.espyrain_controller_number_of_stations') | int(0) }}"
        station_count: "{{ [station_count_raw, 1] | max }}"
        options: >
          {% set ns = namespace(opts=[]) %}
          {% for i in range(1, station_count + 1) %}
            {% set name = states('input_text.espyrain_station_' ~ i ~ '_name') %}
            {% if name in ['unknown', 'unavailable', 'none', ''] %}
              {% set name = 'Station ' ~ i %}
            {% endif %}
            {% set label = 'S' ~ i ~ ' ' ~ name %}
            {% set ns.opts = ns.opts + [label] %}
          {% endfor %}
          {{ ns.opts }}
        current: "{{ states('input_select.espyrain_manual_station') }}"
        current_token: >
          {% set token = (states('input_select.espyrain_manual_station') | string).split(' ')[0] %}
          {{ token if token | regex_match('^S[0-9]+$') else '' }}
        migrated_current: >
          {% if current in options %}
            {{ current }}
          {% elif current_token != '' %}
            {% set ns = namespace(match='') %}
            {% for option in options %}
              {% if option.startswith(current_token ~ ' ') %}
                {% set ns.match = option %}
              {% endif %}
            {% endfor %}
            {{ ns.match }}
          {% else %}
            {{ '' }}
          {% endif %}
    - service: input_select.set_options
      target:
        entity_id: input_select.espyrain_manual_station
      data:
        options: "{{ options }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ migrated_current != '' }}"
          sequence:
            - service: input_select.select_option
              target:
                entity_id: input_select.espyrain_manual_station
              data:
                option: "{{ migrated_current }}"
      default:
        - service: input_select.select_option
          target:
            entity_id: input_select.espyrain_manual_station
          data:
            option: "{{ options[0] if options | length > 0 else '' }}"
            
# ================================================================
# WINTER MODE AUTO ENABLE BASED ON DATE INPUT
# ================================================================
- id: espyrain_winter_mode_auto_control
  alias: "ESPyRain: Winter Mode Auto Control"
  description: "Automatically toggle winter mode from configured start/end dates when enabled"
  trigger:
    - platform: homeassistant
      event: start
    - platform: time_pattern
      hours: '0'
      minutes: '5'
    - platform: state
      entity_id:
        - input_boolean.espyrain_winter_auto_enable
        - input_datetime.espyrain_winter_start
        - input_datetime.espyrain_winter_end
  condition:
    - condition: state
      entity_id: input_boolean.espyrain_winter_auto_enable
      state: 'on'
  action:
    - variables:
        today_md: "{{ now().strftime('%m-%d') }}"
        start_md: "{{ strptime(states('input_datetime.espyrain_winter_start'), '%Y-%m-%d').strftime('%m-%d') if states('input_datetime.espyrain_winter_start') not in ['unknown','unavailable',''] else '' }}"
        end_md: "{{ strptime(states('input_datetime.espyrain_winter_end'), '%Y-%m-%d').strftime('%m-%d') if states('input_datetime.espyrain_winter_end') not in ['unknown','unavailable',''] else '' }}"
        # Support winter periods that either stay within one year or cross the year boundary
        in_winter: >
          {% if start_md == '' or end_md == '' %}
            false
          {% elif start_md <= end_md %}
            {{ start_md <= today_md <= end_md }}
          {% else %}
            {{ today_md >= start_md or today_md <= end_md }}
          {% endif %}
    - service: "input_boolean.turn_{{ 'on' if in_winter else 'off' }}"
      target:
        entity_id: input_boolean.espyrain_winter_mode
  mode: single







