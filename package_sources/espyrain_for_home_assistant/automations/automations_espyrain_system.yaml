# ================================================================
# Sync schedule names immediately on change and keep
# HA and ESP schedule labels aligned.
# ================================================================
- id: espyrain_sync_schedule_names_to_esp
  alias: "ESPyRain: Sync Schedule Names to ESP"
  description: "Push HA schedule names to the ESP when helpers change, Home Assistant starts, or the ESP reconnects"
  trigger:
    - platform: homeassistant
      event: start
    - platform: state
      entity_id: binary_sensor.espyrain_controller_ha_link
      from: 'off'
      to: 'on'
      for:
        seconds: 5
    - platform: state
      entity_id:
        - input_text.espyrain_schedule_1_name
        - input_text.espyrain_schedule_2_name
        - input_text.espyrain_schedule_3_name
        - input_text.espyrain_schedule_4_name
        - input_text.espyrain_schedule_5_name
        - input_text.espyrain_schedule_6_name
        - input_text.espyrain_schedule_7_name
        - input_text.espyrain_schedule_8_name
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.platform != 'state' or trigger.entity_id == 'binary_sensor.espyrain_controller_ha_link' }}"
          sequence:
            # Give the ESP text entities a moment to come online before pushing all names
            - delay:
                seconds: 5

    # Push all schedule name helpers so HA and ESP stay aligned no matter which one changed last
    - service: text.set_value
      target:
        entity_id: text.espyrain_controller_schedule_1_name
      data:
        value: "{{ states('input_text.espyrain_schedule_1_name') }}"
    - service: text.set_value
      target:
