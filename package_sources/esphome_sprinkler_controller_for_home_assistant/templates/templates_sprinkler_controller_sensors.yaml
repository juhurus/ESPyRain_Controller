    # V2 formatted runtime sensors (display as Xh Ymin)
    - name: "S1 Runtime Today Formatted"
      unique_id: s1_runtime_today_formatted
      icon: mdi:timer-outline
      state: >
        {% set hours = states('sensor.s1_runtime_today') | float(0) %}
        {% set total_minutes = (hours * 60) | round(0) | int(0) %}
        {% set h = (total_minutes // 60) | int(0) %}
        {% set m = (total_minutes % 60) | int(0) %}
        {{ h }}h {{ m }}min

