# ================================================================
#                                                          
#             SCHEDULE HELPER SCRIPTS               
#                                                          
# =================================================================
# Saved as: config/package_sources/espyrain_for_home_assistant/scripts/scripts_espyrain.yaml

# ================================================================
# Manual Run
# ================================================================
espyrain_manual_run:
  alias: "ESPyRain: Manual Run"
  sequence:
    - variables:
        selected: "{{ states('input_select.espyrain_manual_station') }}"
        station_num: >
          {% set token = (selected | string).split(' ')[0] %}
          {{ token | regex_replace('[^0-9]', '') | int(0) }}
        time_str: "{{ states('input_datetime.espyrain_manual_runtime') }}"
        duration_sec: >
          {% if time_str not in ['unknown', 'unavailable', 'None', ''] and ':' in time_str %}
            {% set p = time_str.split(':') %}
            {% set h = p[0] | int(0) %}
            {% set m = p[1] | int(0) if p | length > 1 else 0 %}
            {{ [((h * 3600) + (m * 60)), 60] | max }}
          {% else %}
            600
          {% endif %}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ station_num >= 1 }}"
          sequence:
            - service: esphome.espyrain_controller_manual_queue_station
              data:
                station_num: "{{ station_num }}"
                duration_sec: "{{ duration_sec }}"
      default:
        - service: system_log.write
          data:
            level: warning
            message: >
              Manual run aborted. selected={{ selected }}, station_num={{ station_num }},
              runtime={{ time_str }}, controller={{ states('binary_sensor.espyrain_controller_ha_link') }}

# ================================================================
# Sync ESP Time Now
# ================================================================
espyrain_sync_esp_time_now:
  alias: "ESPyRain: Sync ESP Time Now"
  icon: mdi:clock-sync
  mode: single
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: sensor.espyrain_controller_status
              state: "Idle"
          sequence:
            - service: button.press
              target:
                entity_id: button.espyrain_controller_restart_esp
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_boolean.espyrain_notifications
                      state: "on"
                  sequence:
                    - service: script.espyrain_send_notification
                      data:
                        title: "*Sprinkler ESP Time Sync Triggered*"
                        message: >
                          Restart requested to force SNTP re-sync.
                          Time: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
        - conditions:
            - condition: template
              value_template: "{{ states('sensor.espyrain_controller_status') != 'Idle' }}"
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_boolean.espyrain_notifications
                      state: "on"
                  sequence:
                    - service: script.espyrain_send_notification
                      data:
                        title: "*Sprinkler ESP Time Sync Skipped*"
                        message: >
                          Controller is not idle ({{ states('sensor.espyrain_controller_status') }}).
                          Time sync restart was not performed.

# ================================================================
# Start stations from an image button
# ================================================================
espyrain_manual_run_station:
  alias: "ESPyRain: Manual Run Station"
  mode: single
  fields:
    station_num:
      required: true
      selector:
        number:
          min: 1
          max: 16
          step: 1
          mode: box
  sequence:
    - variables:
        time_str: "{{ states('input_datetime.espyrain_manual_runtime') }}"
        duration_sec: >
          {% if time_str not in ['unknown', 'unavailable', 'None', ''] and ':' in time_str %}
            {% set p = time_str.split(':') %}
            {% set h = p[0] | int(0) %}
            {% set m = p[1] | int(0) if p | length > 1 else 0 %}
            {{ [((h * 3600) + (m * 60)), 60] | max }}
          {% else %}
            600
          {% endif %}
    - service: esphome.espyrain_controller_manual_queue_station
      data:
        station_num: "{{ station_num | int }}"
        duration_sec: "{{ duration_sec | int }}"


# ================================================================
# Central notification wrapper. Blank service list falls back
# to a built-in Home Assistant persistent notification.
# ================================================================
espyrain_send_notification:
  alias: "ESPyRain: Send Notification"
  mode: queued
  fields:
    title:
      required: false
      selector:
        text:
    message:
      required: true
      selector:
        text:
  sequence:
    - condition: state
      entity_id: input_boolean.espyrain_notifications
      state: "on"
    - variables:
        notification_title: "{{ title | default('ESPyRain Notification', true) }}"
        notification_message: "{{ message | default('', true) }}"
        notify_targets_raw: "{{ states('input_text.espyrain_notify_service') | default('', true) }}"
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {% set raw = notify_targets_raw %}
                {% if raw in ['unknown', 'unavailable', 'None', none, ''] %}
                  {{ false }}
                {% else %}
                  {{ raw.split(',')
                     | map('trim')
                     | reject('equalto', '')
                     | select('match', '^notify\..+')
                     | list
                     | count > 0 }}
                {% endif %}
          sequence:
            - repeat:
                for_each: >
                  {% set raw = notify_targets_raw %}
                  {{ raw.split(',')
                     | map('trim')
                     | reject('equalto', '')
                     | select('match', '^notify\..+')
                     | list }}
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ states(repeat.item) not in ['unknown', 'unavailable'] }}"
                        sequence:
                          - service: notify.send_message
                            data:
                              entity_id: "{{ repeat.item }}"
                              title: "{{ notification_title }}"
                              message: "{{ notification_message }}"
                    default:
                      - service: "{{ repeat.item }}"
                        data:
                          title: "{{ notification_title }}"
                          message: "{{ notification_message }}"
      default:
        - service: persistent_notification.create
          data:
            title: "{{ notification_title }}"
            message: "{{ notification_message }}"

