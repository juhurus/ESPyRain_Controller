# ════════════════════════════════════════════════════════════════
# STATION COUPLING SYNC AUTOMATIONS
# Syncs Home Assistant coupling checkboxes to ESP 16-bit bitmasks
# Add to: config/automations/automations_espyrain_station_sync.yaml
# ════════════════════════════════════════════════════════════════
#
# Each station has 16 input_boolean coupling checkboxes that form
# a 16-bit bitmask. When any checkbox changes, the full bitmask
# is recomputed and sent to the ESP's number entity.
#
# Bitmask: bit 0 = station 1, bit 1 = station 2, ... bit 15 = station 16
# Value = sum of 2^(b-1) for each coupled station b that is 'on'
#
# Last updated: 2026-02-17
# ════════════════════════════════════════════════════════════════

# ════════════════════════════════════════════════════════════════
# STATION 1 - Coupling Sync
# ════════════════════════════════════════════════════════════════
- id: espyrain_station_1_coupling_sync
  alias: "ESPyRain - Station 1 Coupling Sync"
  description: "Sync station 1 coupling checkboxes to ESP bitmask"
  mode: single
  trigger:
    - platform: state
      entity_id:
        - input_boolean.espyrain_station_1_coupled_1
        - input_boolean.espyrain_station_1_coupled_2
        - input_boolean.espyrain_station_1_coupled_3
        - input_boolean.espyrain_station_1_coupled_4
        - input_boolean.espyrain_station_1_coupled_5
        - input_boolean.espyrain_station_1_coupled_6
        - input_boolean.espyrain_station_1_coupled_7
        - input_boolean.espyrain_station_1_coupled_8
        - input_boolean.espyrain_station_1_coupled_9
        - input_boolean.espyrain_station_1_coupled_10
        - input_boolean.espyrain_station_1_coupled_11
        - input_boolean.espyrain_station_1_coupled_12
        - input_boolean.espyrain_station_1_coupled_13
        - input_boolean.espyrain_station_1_coupled_14
        - input_boolean.espyrain_station_1_coupled_15
        - input_boolean.espyrain_station_1_coupled_16
  action:
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_station_1_coupled_mask
      data:
        value: >
          {% set ns = namespace(mask=0) %}
          {% for b in range(1, 17) %}
            {% if is_state('input_boolean.espyrain_station_1_coupled_' ~ b, 'on') %}
              {% set ns.mask = ns.mask + 2**(b-1) %}
            {% endif %}
          {% endfor %}
          {{ ns.mask }}

