  alias: "ESPyRain: Sync Schedule 4 Days Bitmask to ESP"
  trigger:
    - platform: state
      entity_id:
        - input_select.espyrain_schedule_4_days
        - input_boolean.espyrain_schedule_4_monday
        - input_boolean.espyrain_schedule_4_tuesday
