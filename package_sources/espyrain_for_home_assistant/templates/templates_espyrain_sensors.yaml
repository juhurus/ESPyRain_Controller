    - name: "ESPyRain Schedule 1 Blocked By Interval Today"
      unique_id: espyrain_schedule_1_blocked_by_interval_today
      state: >
        {% set bypass_off = is_state('input_boolean.espyrain_bypass_interval_check', 'off') %}
        {% set enabled = is_state('input_boolean.espyrain_schedule_1_enabled', 'on') %}
        {% set last = states('sensor.espyrain_schedule_1_last_run') %}
        {% if not bypass_off or not enabled or last in ['unknown', 'unavailable', 'never', ''] %}
