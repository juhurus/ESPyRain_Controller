# Sprinkler Notifications
# Extracted from legacy sprinkler notification automations and updated for current entities.

- id: sprinkler_notify_run_started
  alias: "Sprinkler: Run Started (Notifications)"
  mode: single
  trigger:
    - platform: state
      entity_id: sensor.sprinkler_controller_sprinkler_status
  condition:
    - condition: template
      value_template: >
        {% set old = trigger.from_state.state if trigger.from_state is not none else 'unknown' %}
        {% set new = trigger.to_state.state if trigger.to_state is not none else 'unknown' %}
        {{ old in ['Idle', 'unknown', 'unavailable'] and new not in ['Idle', 'unknown', 'unavailable'] }}
    - condition: state
      entity_id: input_boolean.sprinkler_notifications
      state: "on"

  action:
    - delay:
        milliseconds: 700
    - variables:
        status: "{{ states('sensor.sprinkler_controller_sprinkler_status') }}"
        schedule_num: >
          {% if status.startswith('Running Schedule ') %}
            {{ status.replace('Running Schedule ', '') | int(0) }}
          {% else %}
            0
          {% endif %}
        schedule_name: >
          {% if schedule_num > 0 %}
            {{ states('input_text.sprinkler_schedule_' ~ schedule_num ~ '_name') }}
          {% else %}
            Manual Run
          {% endif %}
    - service: notify.send_message
      data:
        entity_id: !secret sprinkler_telegram_notifier
        title: >
          {% if schedule_num > 0 %}
            *🟢 Sprinkler Schedule {{ schedule_num }} Started*
          {% else %}
            *🟢 Sprinkler Manual Run Started*
          {% endif %}
        message: >
          ➡ {{ schedule_name }}

          🕒 Started at {{ now().strftime('%H:%M:%S') }}
          
          Active station: {{ states('sensor.sprinkler_controller_active_station') }}
          
          ⛓ Queue: {{ states('sensor.sprinkler_controller_queue') }}
          
          🕔 Remaining: {{ states('sensor.sprinkler_controller_total_queue_time_remaining_formatted') }}

- id: sprinkler_notify_run_stopped
  alias: "Sprinkler: Run Stopped Manually (Notifications)"
  mode: single
  trigger:
    - platform: state
      entity_id: button.sprinkler_controller_stop
  condition:
    - condition: template
      value_template: >
        {{ states('sensor.sprinkler_controller_sprinkler_status') not in ['Idle', 'unknown', 'unavailable'] }}
    - condition: state
      entity_id: input_boolean.sprinkler_notifications
      state: "on"

  action:
    - delay:
        milliseconds: 300
    - service: notify.send_message
      data:
        entity_id: !secret sprinkler_telegram_notifier
        title: "🛑 *Sprinkler Run Stopped* 🛑"
        message: >
          Stopped manually at {{ now().strftime('%H:%M:%S') }}.

          ✔ Last station: {{ states('sensor.sprinkler_controller_active_station') }}
          🕒 Remaining: {{ states('sensor.sprinkler_controller_total_queue_time_remaining_formatted') }}

- id: sprinkler_notify_run_completed
  alias: "Sprinkler: Run Completed (Notifications)"
  mode: single
  trigger:
    - platform: state
      entity_id: sensor.sprinkler_controller_sprinkler_status
      to: "Idle"
  condition:
    - condition: template
      value_template: >
        {% set old = trigger.from_state.state if trigger.from_state is not none else 'unknown' %}
        {% set secs_since_stop_btn = as_timestamp(now()) - as_timestamp(states.button.sprinkler_controller_stop.last_changed) %}
        {{ old not in ['Idle', 'unknown', 'unavailable'] and secs_since_stop_btn > 8 }}
    - condition: state
      entity_id: input_boolean.sprinkler_notifications
      state: "on"

  action:
    - service: notify.send_message
      data:
        entity_id: !secret sprinkler_telegram_notifier
        title: "🛑 *Sprinkler Run Completed* 🛑"
        message: >
          Completed {{ trigger.from_state.state if trigger.from_state is not none else 'n/a' }} at {{ now().strftime('%H:%M:%S') }}.

- id: sprinkler_notify_station_started
  alias: "Sprinkler: Station Started (Notifications)"
  mode: queued
  max: 20
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.sprinkler_controller_station_1_watering
        - binary_sensor.sprinkler_controller_station_2_watering
        - binary_sensor.sprinkler_controller_station_3_watering
        - binary_sensor.sprinkler_controller_station_4_watering
        - binary_sensor.sprinkler_controller_station_5_watering
        - binary_sensor.sprinkler_controller_station_6_watering
        - binary_sensor.sprinkler_controller_station_7_watering
        - binary_sensor.sprinkler_controller_station_8_watering
        - binary_sensor.sprinkler_controller_station_9_watering
        - binary_sensor.sprinkler_controller_station_10_watering
        - binary_sensor.sprinkler_controller_station_11_watering
        - binary_sensor.sprinkler_controller_station_12_watering
        - binary_sensor.sprinkler_controller_station_13_watering
        - binary_sensor.sprinkler_controller_station_14_watering
        - binary_sensor.sprinkler_controller_station_15_watering
        - binary_sensor.sprinkler_controller_station_16_watering
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.sprinkler_notifications
      state: "on"

  action:
    - variables:
        station_num: "{{ trigger.entity_id.split('station_')[1].split('_')[0] | int(0) }}"
        station_name: >
          {% set n = trigger.entity_id.split('station_')[1].split('_')[0] | int(0) %}
          {{ states('input_text.sprinkler_station_' ~ n ~ '_name') }}
    - service: notify.send_message
      data:
        entity_id: !secret sprinkler_telegram_notifier
        title: "✅ *Station Started*"
        message: >
          💧 S{{ station_num }} {{ station_name }}

          🕒 Started at {{ now().strftime('%H:%M:%S') }}

- id: sprinkler_notify_station_finished
  alias: "Sprinkler: Station Finished (Notifications)"
  mode: queued
  max: 20
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.sprinkler_controller_station_1_watering
        - binary_sensor.sprinkler_controller_station_2_watering
        - binary_sensor.sprinkler_controller_station_3_watering
        - binary_sensor.sprinkler_controller_station_4_watering
        - binary_sensor.sprinkler_controller_station_5_watering
        - binary_sensor.sprinkler_controller_station_6_watering
        - binary_sensor.sprinkler_controller_station_7_watering
        - binary_sensor.sprinkler_controller_station_8_watering
        - binary_sensor.sprinkler_controller_station_9_watering
        - binary_sensor.sprinkler_controller_station_10_watering
        - binary_sensor.sprinkler_controller_station_11_watering
        - binary_sensor.sprinkler_controller_station_12_watering
        - binary_sensor.sprinkler_controller_station_13_watering
        - binary_sensor.sprinkler_controller_station_14_watering
        - binary_sensor.sprinkler_controller_station_15_watering
        - binary_sensor.sprinkler_controller_station_16_watering
      from: "on"
      to: "off"
  condition:
    - condition: template
      value_template: >
        {{ states('sensor.sprinkler_controller_sprinkler_status') not in ['Idle', 'unknown', 'unavailable'] }}
    - condition: state
      entity_id: input_boolean.sprinkler_notifications
      state: "on"

  action:
    - variables:
        station_num: "{{ trigger.entity_id.split('station_')[1].split('_')[0] | int(0) }}"
        station_name: >
          {% set n = trigger.entity_id.split('station_')[1].split('_')[0] | int(0) %}
          {{ states('input_text.sprinkler_station_' ~ n ~ '_name') }}
        runtime_sec: "{{ (as_timestamp(now()) - as_timestamp(trigger.from_state.last_changed)) | int(0) }}"
    - service: notify.send_message
      data:
        entity_id: !secret sprinkler_telegram_notifier
        title: "❌ *Station Finished*"
        message: >
          💧 S{{ station_num }} {{ station_name }}

          🕔 Finished at {{ now().strftime('%H:%M:%S') }}
          Runtime: {{ (runtime_sec // 60) | int }}m {{ (runtime_sec % 60) | int }}s

