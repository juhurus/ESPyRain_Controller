# ================================================================
# HA START: RESTORE ALL SETTINGS TO ESP
# After HA restarts, push all HA helper values to ESP
# to ensure ESP has the latest configuration.
# ================================================================

# ================================================================
# SYNC ALL SETTINGS TO ESP ON HA START
# ================================================================
- id: espyrain_sync_all_on_ha_start
  alias: "ESPyRain: Sync All Settings to ESP on HA Start"
  description: "After HA restart, wait 30s for ESP to connect, then push all schedule settings to ESP"
  trigger:
    - platform: homeassistant
      event: start
  action:
    # Wait for ESP to be fully connected and responsive
    - delay:
        seconds: 30

    # â”€â”€ SYSTEM SETTINGS â”€â”€
    # Master enable
    - service: "switch.turn_{{ 'on' if is_state('input_boolean.espyrain_winter_mode', 'on') else 'off' }}"
      target:
        entity_id: switch.espyrain_controller_winter_mode
      continue_on_error: true

    # Rain delay days
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_rain_delay_days
      data:
        value: "{{ states('input_number.espyrain_rain_delay_days') | int(0) }}"
      continue_on_error: true

    # â”€â”€ SCHEDULE 1 â”€â”€
    # Time
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_1_hour
      data:
        value: "{{ state_attr('input_datetime.espyrain_schedule_1_time', 'hour') | int(0) }}"
      continue_on_error: true
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_1_minute
      data:
        value: "{{ state_attr('input_datetime.espyrain_schedule_1_time', 'minute') | int(0) }}"
      continue_on_error: true

    # Day mode
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_1_day_mode
      data:
        value: >
          {% set days_mode = states('input_select.espyrain_schedule_1_days') %}
          {% if days_mode == 'Daily' %}0
          {% elif days_mode == 'Selected Days' %}1
          {% elif 'Every' in days_mode %}2
          {% elif 'Odd' in days_mode %}3
          {% elif 'Even' in days_mode %}4
          {% elif 'Weekdays' in days_mode or 'Weekends' in days_mode %}5
          {% else %}0{% endif %}
      continue_on_error: true

    # Days bitmask
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_1_days_bitmask
      data:
        value: >
          {% set days_mode = states('input_select.espyrain_schedule_1_days') %}
          {% if days_mode in ['Daily'] or 'Odd' in days_mode or 'Even' in days_mode %}127
          {% elif days_mode == 'Selected Days' %}
            {{ (1 if is_state('input_boolean.espyrain_schedule_1_monday','on') else 0) +
               (2 if is_state('input_boolean.espyrain_schedule_1_tuesday','on') else 0) +
               (4 if is_state('input_boolean.espyrain_schedule_1_wednesday','on') else 0) +
