background: center / cover no-repeat url("/local/espyrain/espyrain_background.jpg") fixed
views:
  - title: ESPyRain Controller
    icon: mdi:sprinkler-variant
    cards: []
    type: sections
    sections:
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: markdown
                content: |
                  # 🌱 ESPyRain Controller
                card_mod:
                  style: >
                    {% set status = states('sensor.espyrain_controller_status')
                    %}  {% set is_running = 'Running' in status %}  {% set
                    is_soak_rest = 'Soak Rest' in status %}  {% set is_paused =
                    is_state('binary_sensor.espyrain_controller_paused', 'on')
                    or is_soak_rest %} 
                          
                     ha-card {       
                       text-align: center;
                       font-weight: bold;
                       font-size: .9em;
                       padding: 15px !important;
                       color: white;
                       {% if is_running %}
                         background: radial-gradient(circle, rgba(39, 66, 77, 0.9) 50%, rgba(76, 175, 80, 0.3) 100%);
                         border: 2px solid #00FF00;
                       {% elif is_paused %}
                               background: radial-gradient(circle, rgba(39, 66, 77, 0.9) 50%, rgba(255, 107, 107, 0.2) 100%);
                         border: 2px solid #FF9800;
                         animation: blink-border 1s infinite;  
                        {% else %}
                         background: radial-gradient(circle, rgba(39, 66, 77, 0.9) 50%, rgba(76, 175, 80, 0.3) 100%);
                         border: 1px solid rgba(0, 206, 209, 0.5);          
                       {% endif %}
                     }
                          
                       @keyframes pulse-green {
                       0%, 100% { border-color: #04FE04; box-shadow: 0 0 10px rgba(0, 172, 0, 0.2); }
                       50% { border-color: #04FE04; box-shadow: 0 0 20px rgba(0, 172, 0, 0.8); }
                     }

                     @keyframes blink-border {
                       0%, 100% { border-color: #00FF00; }
                       50% { border-color: transparent; }
                     }
              - type: conditional
                conditions:
                  - entity: binary_sensor.espyrain_controller_ha_link
                    state: 'off'
                card:
                  type: markdown
                  content: >
                    ## 🚨 Controller Offline

                    Home Assistant currently cannot reach the sprinkler
                    controller.

                    - Live queue/station values are temporarily unavailable.

                    - Live runtime/status sensors may show `unavailable` until
                    the link returns.


                    ### ✅ Note: *If powered the ESP32 Controller will continue
                    running the schedules*
                  card_mod:
                    style: |
                      ha-card {
                        border: 2px solid #FF9800;
                        border-left: 6px solid #FF9800;
                        background: linear-gradient(135deg, rgba(255, 152, 0, 0.18) 0%, rgba(39, 66, 77, 0.85) 100%);
                      }
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: button.espyrain_controller_pause
                name: Pause
                icon: mdi:pause-circle
                show_state: false
                tap_action:
                  action: call-service
                  service: button.press
                  service_data:
                    entity_id: button.espyrain_controller_pause
                styles:
                  card:
                    - background: >-
                        radial-gradient(circle, rgba(39, 66, 77, 0.8) 0%,
                        rgba(20, 33, 38, 0.9) 100%)
                    - border: 1px solid rgba(0, 206, 209, 0.3)
                  icon:
                    - color: orange
              - type: custom:button-card
                entity: button.espyrain_controller_resume
                name: Resume
                icon: mdi:play-circle
                show_state: false
                tap_action:
                  action: call-service
                  service: button.press
                  service_data:
                    entity_id: button.espyrain_controller_resume
                styles:
                  card:
                    - background: >-
                        radial-gradient(circle, rgba(39, 66, 77, 0.8) 0%,
                        rgba(20, 33, 38, 0.9) 100%)
                    - border: 1px solid rgba(0, 206, 209, 0.3)
                  icon:
                    - color: green
              - type: custom:button-card
                entity: button.espyrain_controller_stop
                name: Stop
                icon: mdi:stop-circle
                show_state: false
                tap_action:
                  action: call-service
                  service: button.press
                  service_data:
                    entity_id: button.espyrain_controller_stop
                styles:
                  card:
                    - background: >-
                        radial-gradient(circle, rgba(39, 66, 77, 0.8) 0%,
                        rgba(20, 33, 38, 0.9) 100%)
                    - border: 1px solid rgba(255, 80, 80, 0.3)
                  icon:
                    - color: red
            visibility:
              - condition: state
                entity: sensor.espyrain_controller_queue
                state_not: Idle
              - condition: state
                entity: binary_sensor.espyrain_controller_ha_link
                state: 'on'
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.espyrain_rain_delay_days
                above: 1
            card:
              type: markdown
              content: >
                ## ⚠️ RAIN DELAY ACTIVE


                All automatic watering paused for **{{
                states('input_number.espyrain_rain_delay_days') | int(0) }}**
                day(s).


                Next scheduled run will NOT execute until 

                rain delay expires on the  {{
                states('input_datetime.rain_delay_date') }}.
              card_mod:
                style: >
                  {% set rain_delay =
                  states('input_number.espyrain_rain_delay_days') | int(0) %}

                  ha-card {
                    background: radial-gradient(circle, rgba(39, 66, 77, 0.85) 0%, rgba(18, 37, 44, 0.85) 100%);
                    {% if rain_delay > 0 %}
                      border: 3px solid #FF6B6B;
                      border-top: 5px solid #FF6B6B;
                      animation: pulse-red 2s infinite;
                      background: linear-gradient(135deg, rgba(255, 107, 107, 0.2) 0%, rgba(39, 66, 77, 0.85) 100%);
                    {% else %}
                      border: 2px solid #00CED1;
                    {% endif %}
                  }

                  @keyframes pulse-red {
                    0%, 100% { 
                      border-color: #FF6B6B;
                      box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
                    }
                    50% { 
                      border-color: #FF9999;
                      box-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
                    }
                  }
          - type: conditional
            conditions:
              - condition: state
                entity: input_number.espyrain_rain_delay_days
                state: '1.0'
            card:
              type: markdown
              content: |
                ## ⚠️ RAIN DELAY ACTIVE
                Automatic watering is paused.

                Rain delay will reset automatically at **midnight**.
              card_mod:
                style: |
                  ha-card {
                    background: rgba(255, 152, 0, 0.2);
                    border-left: 5px solid #FF9800;
                  }
          - type: conditional
            conditions:
              - condition: state
                entity: switch.espyrain_controller_winter_mode
                state: 'on'
            card:
              type: markdown
              content: >
                ## ❄ Winter Mode ACTIVE


                All automatic watering paused since **{{
                states('input_datetime.espyrain_winter_start') }}**


                Next scheduled run will NOT execute until 

                end of winter on the **{{
                states('input_datetime.espyrain_winter_end')}}**.
              card_mod:
                style: >
                  {% set rain_delay =
                  states('input_number.espyrain_rain_delay_days') | int(0) %}

                  ha-card {
                    background: radial-gradient(circle, rgba(39, 66, 77, 0.85) 0%, rgba(18, 37, 44, 0.85) 100%);
                    {% if rain_delay > 0 %}
                      border: 3px solid #FF6B6B;
                      border-top: 5px solid #FF6B6B;
                      animation: pulse-red 2s infinite;
                      background: linear-gradient(135deg, rgba(255, 107, 107, 0.2) 0%, rgba(39, 66, 77, 0.85) 100%);
                    {% else %}
                      border: 2px solid #00CED1;
                    {% endif %}
                  }

                  @keyframes pulse-red {
                    0%, 100% { 
                      border-color: #FF6B6B;
                      box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
                    }
                    50% { 
                      border-color: #FF9999;
                      box-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
                    }
                  }
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.espyrain_controller_ha_link
                state: 'off'
            card:
              type: markdown
              content: |
                ## ⏱️ Active Watering
                Controller is currently offline.
                Live queue/station values are temporarily unavailable.
              card_mod:
                style: |
                  ha-card {
                    background: linear-gradient(135deg, rgba(255, 152, 0, 0.16) 0%, rgba(39, 66, 77, 0.92) 100%);
                    border-left: 5px solid #FF9800;
                  }
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.espyrain_controller_queue_state
                state_not: Idle
              - condition: state
                entity: binary_sensor.espyrain_controller_ha_link
                state: 'on'
            card:
              type: entities
              title: ⏱ Watering in progress
              show_header_toggle: false
              state_color: true
              entities:
                - type: custom:hui-markdown-card
                  content: >
                    {% set status = states('sensor.espyrain_controller_status')
                    %} {% set queue = states('sensor.espyrain_controller_queue')
                    %}  {% set queue_state =
                    states('sensor.espyrain_controller_queue_state') %}  {% set
                    is_soak_rest = 'Soak Rest' in queue_state %}       {% set
                    paused =
                    is_state('binary_sensor.espyrain_controller_paused', 'on')
                    %}  {% set paused_min =
                    states('sensor.espyrain_controller_paused_minutes') | int(0)
                    %}  {% set auto_resume_min =
                    states('sensor.espyrain_controller_auto_resume_minutes_remaining')
                    | int(0) %}  {% set active_station =
                    states('sensor.espyrain_controller_active_station') %}  {%
                    set station_rem =
                    states('sensor.espyrain_controller_station_time_remaining_formatted')
                    %} {% set soak_delay =
                    states('number.espyrain_controller_number_of_schedules')%}


                    {% set ns = namespace(schedule=0) %} {% set sched_src =
                    status ~ ' ' ~ queue_state %} {% for i in range(1, 9) %}
                      {% if ('Schedule ' ~ i) in sched_src %}
                        {% set ns.schedule = i %}
                      {% endif %}
                    {% endfor %} {% if ns.schedule == 0 %}
                      {% set schedule_fallback = states('sensor.espyrain_controller_current_schedule') | int(0) %}
                      {% if schedule_fallback >= 1 and schedule_fallback <= 8 %}
                        {% set ns.schedule = schedule_fallback %}
                      {% endif %}
                    {% endif %}

                    {% set fallback_station_idx = 0 %} {% if is_soak_rest and
                    queue not in ['Idle', 'Running', 'unknown', 'unavailable',
                    ''] %}
                      {% set first_token = queue.split(' > ')[0] | replace('[', '') | replace(']', '') %}
                      {% if first_token.startswith('S') %}
                        {% set fallback_station_idx = first_token[1:] | int(0) %}
                      {% endif %}
                    {% endif %}

                    {% set sn = namespace(station_idx=0) %} {% for i in range(1,
                    17) %}
                      {% if states('input_text.espyrain_station_' ~ i ~ '_name') == active_station %}
                        {% set sn.station_idx = i %}
                      {% endif %}
                    {% endfor %}

                    {% if sn.station_idx > 0 %}
                      {% set station_line = 'Station S' ~ sn.station_idx ~ ' - ' ~ active_station %}
                    {% elif fallback_station_idx > 0 %}
                      {% set station_line = 'Station S' ~ fallback_station_idx ~ ' - ' ~ states('input_text.espyrain_station_' ~ fallback_station_idx ~ '_name') %}
                    {% elif active_station not in ['unknown', 'unavailable',
                    'None', ''] %}
                      {% set station_line = 'Station ' ~ active_station %}
                    {% else %}
                      {% set station_line = 'System Idle' %}
                    {% endif %}

                    {% if ns.schedule > 0 %}
                      {% set soak_sel = states('input_select.espyrain_schedule_' ~ ns.schedule ~ '_soak_cycles') %}
                      {% set show_soak = soak_sel not in ['No Soak', 'unknown', 'unavailable', ''] %}
                      {% set soak_line = 'Soak Cycle ' ~ (soak_sel | replace(' Soak', '')) %}
                    {% else %}
                      {% set show_soak = false %}
                    {% endif %}



                    {% if is_soak_rest %} <ha-alert alert-type="warning">⌛
                    Sprinklers Paused. Resuming after {{ queue_state |
                    replace('Soak Rest ', '') }} soak.</ha-alert> {% elif paused
                    %} <ha-alert alert-type="warning">⌛ Sprinklers Paused for {{
                    paused_min }} minutes.{% if auto_resume_min > 0 %} Auto
                    resume in {{ auto_resume_min }} minute{% if auto_resume_min
                    != 1 %}s{% endif %}.{% endif %}</ha-alert> {% endif %}


                    {% set run_type =
                    states('sensor.espyrain_controller_current_run_type') %} {%
                    if run_type == 'Scheduled' and ns.schedule > 0 %} ## 📅
                    **Schedule {{ ns.schedule }}**



                    ### {{ states('input_text.espyrain_schedule_' ~ ns.schedule
                    ~ '_name') }} {% elif run_type == 'Manual' %} ## *Manual
                    Run* 

                     {% elif run_type != 'Manual' %}
                    -  *Seasonal Adjust: {{
                    states('input_number.espyrain_schedule_' ~ ns.schedule ~
                    '_seasonal') }}%*  {% endif %}

                    ### 🚿 *{{ station_line }}*

                    {% if show_soak %}  - 🌀 *{{ soak_line }}* 

                    - ⌛ *{{ soak_delay}}min delay between cycles* {% endif %}
                  card_mod:
                    style: >
                      {% set status =
                      states('sensor.espyrain_controller_status') %}  {% set
                      is_running = 'Running' in status %}  {% set is_soak_rest =
                      'Soak Rest' in status %}  {% set is_paused =
                      is_state('binary_sensor.espyrain_controller_paused', 'on')
                      or is_soak_rest %}

                      ha-card {
                        background: radial-gradient(circle, rgba(39, 66, 77, 0.95) 0%, rgba(18, 37, 44, 0.95) 100%);
                        cursor: pointer;
                        border-bottom-left-radius: 0px;
                        border-bottom-right-radius: 0px;
                        {% if is_paused %}
                          border-left: 2px solid #00FF00;
                          border-right: 2px solid #00FF00;
                          animation: blink-border 1s infinite;
                        {% elif is_running %}
                          border-left: 2px solid #00FF00;
                          border-right: 2px solid #00FF00;
                        {% else %}
                          border-left: 2px solid #FF6B6B;
                          border-right: 2px solid #FF6B6B;
                        {% endif %}
                      }

                      @keyframes blink-border {
                        0%, 100% { border-left-color: #00FF00; border-right-color: #00FF00; }
                        50% { border-left-color: transparent; border-right-color: transparent; }
                      }
                - entity: sensor.espyrain_controller_queue_progress
                  name: Overall Progress
                - type: custom:template-entity-row
                  entity: >-
                    sensor.espyrain_controller_total_queue_time_remaining_formatted
                  name: Total Time Remaining
                  icon: mdi:timer-outline
                  card_mod:
                    style: |
                      :host {
                        position: relative;
                        overflow: visible;
                      }
                      :host::after {
                        content: "";
                        position: absolute;
                        top: 0;
                        left: 0;
                        height: 100%;
                        width: {{ states('sensor.espyrain_controller_queue_progress') | float(0) }}%;
                        background: linear-gradient(90deg, rgba(76, 175, 80, 0.2) 0%, rgba(76, 175, 80, 0.6) 100%);
                        z-index: 0;
                        transition: width 1s linear;
                        pointer-events: none;
                      }
                      :host .info,
                      :host .text-content,
                      :host state-badge {
                        position: relative;
                        z-index: 1;
                      }
                - type: custom:template-entity-row
                  entity: sensor.espyrain_controller_station_time_remaining_formatted
                  name: >
                    {% set station =
                    states('sensor.espyrain_controller_active_station') %} {% if
                    station not in ['None', 'Idle', 'unknown', 'unavailable',
                    ''] %}
                      Station {{ station }} Remaining
                    {% else %}
                      Station Time Remaining
                    {% endif %}
                  icon: mdi:timer-sand
                  card_mod:
                    style: |
                      :host {
                        position: relative;
                        overflow: visible;
                      }
                      :host::after {
                        content: "";
                        position: absolute;
                        top: 0;
                        left: 0;
                        height: 100%;
                        width: {% set runtime = states('sensor.espyrain_controller_current_station_runtime') | float(0) %}
                               {% set remaining = states('sensor.espyrain_controller_station_time_remaining') | float(0) %}
                               {% if runtime > 0 %}
                                 {% set progress = ((runtime - remaining) / runtime * 100) | round(1) %}
                                 {% if progress < 0 %}
                                   0%
                                 {% elif progress > 100 %}
                                   100%
                                 {% else %}
                                   {{ progress }}%
                                 {% endif %}
                               {% else %}
                                 0%
                               {% endif %};
                        background: linear-gradient(90deg, rgba(33, 150, 243, 0.2) 0%, rgba(33, 150, 243, 0.6) 100%);
                        z-index: 0;
                        transition: width 1s linear;
                        pointer-events: none;
                      }
                      :host .info,
                      :host .text-content,
                      :host state-badge {
                        position: relative;
                        z-index: 1;
                      }
                - entity: sensor.espyrain_controller_queue
                  name: Queue
              card_mod:
                style: >
                  {% set status = states('sensor.espyrain_controller_status')
                  %}  {% set is_running = 'Running' in status %}  {% set
                  is_soak_rest = 'Soak Rest' in status %}  {% set is_paused =
                  is_state('binary_sensor.espyrain_controller_paused', 'on') or
                  is_soak_rest %} 
                    
                    ha-card {
                    background: radial-gradient(circle, rgba(39, 66, 77, 0.95) 0%, rgba(18, 37, 44, 0.95) 100%);
                    cursor: pointer;
                    border-bottom-left-radius: 0px;
                    border-bottom-right-radius: 0px;
                    {% if is_running %}
                      border-left: 2px solid #00FF00;
                      border-right: 2px solid #00FF00;            
                    {% elif is_paused %}
                      border-left: 2px solid #00FF00;
                      border-right: 2px solid #00FF00;            
                      animation: blink-border 1s infinite;
                    {% else %}
                      border-left: 2px solid #FF6B6B;
                      border-right: 2px solid #FF6B6B;            
                    {% endif %}
                  }  @keyframes blink-border {
                    0%, 100% { border-left-color: #00FF00; border-right-color: #00FF00; }
                    50% { border-left-color: transparent; border-right-color: transparent; }
                  } :host {
                    --paper-item-icon-color: {{ '#00FF00' if is_running else '#FFA500' if is_paused else 'var(--disabled-text-color)' }};
                    color: {{ '#00FF00' if is_running else 'var(--primary-text-color)' }};
                  }
          - type: vertical-stack
            cards:
              - type: markdown
                content: >
                  ## 💧 Upcoming Watering


                  ### Active Schedules: ***{{
                  states('sensor.espyrain_active_schedules_count') }}***

                  ---

                  ### 🟢 ***Next Run:*** 

                   {% set raw = states('sensor.espyrain_next_scheduled_run') %}
                   {% if raw in ['unknown', 'unavailable', 'None', ''] %}
                     No upcoming runs
                   {% elif raw.startswith('Blocked') or raw.startswith('No runs') %}
                     {{ raw }}
                   {% elif raw | regex_match('^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}: .*$') %}
                     {% set dt = raw[:16] %}
                     {% set run_name = raw[18:] %}
                     {% set ns = namespace(schedule=0) %}
                     {% for i in range(1, 9) %}
                       {% if states('input_text.espyrain_schedule_' ~ i ~ '_name') == run_name %}
                         {% set ns.schedule = i %}
                       {% endif %}
                     {% endfor %}
                     ### {{ as_timestamp(strptime(dt, '%Y-%m-%d %H:%M')) | timestamp_custom('%a %H:%M', true) }}{% if ns.schedule > 0 %} Schedule {{ ns.schedule }}{% endif %}  
                     `{{ run_name }}`
                   {% else %}
                     {{ raw }}
                   {% endif %}

                  ---

                  ### 🕐 ***Today's Schedule:*** 

                   {{ states('sensor.espyrain_today_remaining_schedules') }}

                   ---

                  ### 📅 ***Tomorrow:*** 

                   {{ states('sensor.espyrain_tomorrow_schedules') }}
                card_mod:
                  style: >
                    {% set rain_delay =
                    states('input_number.espyrain_rain_delay_days') | int(0) %}

                    ha-card {
                      background: radial-gradient(circle, rgba(39, 66, 77, 0.85) 0%, rgba(18, 37, 44, 0.85) 100%);
                      {% if rain_delay > 0 %}
                        border: 3px solid #FF6B6B;
                        border-top: 5px solid #FF6B6B;
                        animation: pulse-red 2s infinite;
                      {% else %}
                        border: 1px solid rgba(0, 206, 209, 0.5);
                      {% endif %}
                    }

                    @keyframes pulse-red {
                      0%, 100% { 
                        border-color: #FF6B6B;
                        box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
                      }
                      50% { 
                        border-color: #FF9999;
                        box-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
                      }
                    }
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: markdown
                content: |
                  ## 📅 7-Day Irrigation Calendar
                card_mod:
                  style: |
                    ha-card {
                      text-align: center;
                      font-weight: bold;
                      font-size: 0.8em;
                      padding: 3px !important;
                      background: radial-gradient(circle, rgba(39, 66, 77, 0.9) 50%, rgba(76, 175, 80, 0.3) 100%);
                      color: white;
                      border: 1px solid rgba(0, 206, 209, 0.5);
                    }
          - type: markdown
            content: >
              {% if states('input_number.espyrain_rain_delay_days') | int(0) > 0
              %}

              ## _Rain delay for next {{
              states('input_number.espyrain_rain_delay_days') | int(0) }}
              day(s)_ {% endif %}

              {% set forecast = state_attr('sensor.espyrain_7_day_forecast',
              'days') %} {% set today = now().strftime('%Y-%m-%d') %} {% set
              today_remaining =
              states('sensor.espyrain_today_remaining_schedules') %}

              {% if forecast %}
                {% for day in forecast %}
                  {% if day.blocked %}
                  
                ### 📅 ***{{ day.day_name }} {{ as_timestamp(day.date) | timestamp_custom('%d %b', true) }}.***

                📛 Watering Blocked - _{{ day.block_reason }}_

                  {% elif day.schedules | length > 0 %}
                    {% set ns = namespace(times=[]) %}
                    {% for sched in day.schedules %}
                      {% for t in sched.times %}
                        {% set ns.times = ns.times + [t ~ ' ' ~ sched.name] %}
                      {% endfor %}
                    {% endfor %}

                    {% if day.date == today %}
                      {% if today_remaining == 'No more runs today' %}
               ---       
               ### 📅 ***{{ day.day_name }} {{ as_timestamp(day.date) | timestamp_custom('%d %b', true) }}.***


               🛑 _No more runs scheduled_

                      {% else %}
               --- 
               ### 📅 ***{{ day.day_name }} {{ as_timestamp(day.date) | timestamp_custom('%d %b', true) }}.***

              ▶ {{ today_remaining | replace('\n', '\n\n▶ ') }}
                      {% endif %}
                    {% else %}
               --- 
               ### 📅 ***{{ day.day_name }} {{ as_timestamp(day.date) | timestamp_custom('%d %b', true) }}.***

              ▶ {{ ns.times | sort | join('

              ▶ ') }}
                    {% endif %}

                  {% else %}
                    {% if day.date == today and today_remaining == 'No more runs today' %}
               ---       
               ### 📅 ***{{ day.day_name }} {{ as_timestamp(day.date) | timestamp_custom('%d %b', true) }}.***


               🛑 _No more runs scheduled_
                    {% else %}
               ---       
               ### 📅 ***{{ day.day_name }} {{ as_timestamp(day.date) | timestamp_custom('%d %b', true) }}.***


               🛑 _No runs scheduled_
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% else %} 

              🛑 _Forecast unavailable_ 

               ---

              {% endif %}
            card_mod:
              style: |
                ha-card {
                  background: radial-gradient(circle, rgba(39, 66, 77, 0.8) 0%, rgba(20, 33, 38, 0.9) 100%);
                  border: 1px solid rgba(0, 206, 209, 0.5);
                }
          - type: entities
            title: 🌧️ Rain Delay
            entities:
              - entity: input_number.espyrain_rain_delay_days
                name: Delay Days
                icon: mdi:weather-rainy
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: input_number.espyrain_rain_delay_days
                    above: 0
                row:
                  type: section
                  label: ⚠️ All automatic watering is paused
            card_mod:
              style: |
                ha-card {
                  background: radial-gradient(circle, rgba(39, 66, 77, 0.85) 0%, rgba(18, 37, 44, 0.85) 100%);
                  {% if states('input_number.espyrain_rain_delay_days') | int(0) > 0 %}
                    border-left: 3px solid #FF9800;
                  {% else %}
                    border: 1px solid rgba(0, 206, 209, 0.5);
                    border-left: 3px solid #00CED1;
                  {% endif %}
                }
      - type: grid
        cards: []
    max_columns: 4
  - type: sections
    max_columns: 4
    title: Schedules
    path: schedules
    sections:
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: markdown
                content: |
                  # 🌱 Schedules
                card_mod:
                  style: >
                    {% set status = states('sensor.espyrain_controller_status')
                    %}  {% set is_running = 'Running' in status %}  {% set
                    is_soak_rest = 'Soak Rest' in status %}  {% set is_paused =
                    is_state('binary_sensor.espyrain_controller_paused', 'on')
                    or is_soak_rest %} 
                         
                    ha-card {       
                      text-align: center;
                      font-weight: bold;
                      font-size: .9em;
                      padding: 15px !important;
                      color: white;
                      {% if is_running %}
                        background: radial-gradient(circle, rgba(39, 66, 77, 0.9) 50%, rgba(76, 175, 80, 0.3) 100%);
                        border: 1px solid #00FF00;
                      {% elif is_paused %}
                              background: radial-gradient(circle, rgba(39, 66, 77, 0.9) 50%, rgba(255, 107, 107, 0.2) 100%);
                        border: 2px solid #FF9800;
                        animation: blink-border 1s infinite;  
                       {% else %}
                        background: radial-gradient(circle, rgba(39, 66, 77, 0.9) 50%, rgba(76, 175, 80, 0.3) 100%);
                        border: 1px solid rgba(0, 206, 209, 0.5);          
                      {% endif %}
                    }
                         
                      @keyframes pulse-green {
                      0%, 100% { border-color: #04FE04; box-shadow: 0 0 10px rgba(0, 172, 0, 0.2); }
                      50% { border-color: #04FE04; box-shadow: 0 0 20px rgba(0, 172, 0, 0.8); }
                    }

                    @keyframes blink-border {
                      0%, 100% { border-color: #00FF00; }
                      50% { border-color: transparent; }
                    }
              - type: conditional
                conditions:
                  - entity: binary_sensor.espyrain_controller_ha_link
                    state: 'off'
                card:
                  type: markdown
                  content: >
                    ## 🚨 Controller Offline

                    Home Assistant currently cannot reach the sprinkler
                    controller.

                    - Live queue/station values are temporarily unavailable.

                    - Live runtime/status sensors may show `unavailable` until
                    the link returns.


                    ### ✅ Note: *If powered the ESP32 Controller will continue
                    running the schedules*
                  card_mod:
                    style: |
                      ha-card {
                        border: 2px solid #FF9800;
                        border-left: 6px solid #FF9800;
                        background: linear-gradient(135deg, rgba(255, 152, 0, 0.18) 0%, rgba(39, 66, 77, 0.85) 100%);
                      }
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: button.espyrain_controller_pause
                name: Pause
                icon: mdi:pause-circle
                show_state: false
                tap_action:
                  action: call-service
                  service: button.press
                  service_data:
                    entity_id: button.espyrain_controller_pause
                styles:
                  card:
                    - background: >-
                        radial-gradient(circle, rgba(39, 66, 77, 0.8) 0%,
                        rgba(20, 33, 38, 0.9) 100%)
                    - border: 1px solid rgba(0, 206, 209, 0.3)
                  icon:
                    - color: orange
              - type: custom:button-card
                entity: button.espyrain_controller_resume
                name: Resume
                icon: mdi:play-circle
                show_state: false
                tap_action:
                  action: call-service
                  service: button.press
                  service_data:
                    entity_id: button.espyrain_controller_resume
                styles:
                  card:
                    - background: >-
                        radial-gradient(circle, rgba(39, 66, 77, 0.8) 0%,
                        rgba(20, 33, 38, 0.9) 100%)
                    - border: 1px solid rgba(0, 206, 209, 0.3)
                  icon:
                    - color: green
              - type: custom:button-card
                entity: button.espyrain_controller_stop
                name: Stop
                icon: mdi:stop-circle
                show_state: false
                tap_action:
                  action: call-service
                  service: button.press
                  service_data:
                    entity_id: button.espyrain_controller_stop
                styles:
                  card:
                    - background: >-
                        radial-gradient(circle, rgba(39, 66, 77, 0.8) 0%,
                        rgba(20, 33, 38, 0.9) 100%)
                    - border: 1px solid rgba(255, 80, 80, 0.3)
                  icon:
                    - color: red
            visibility:
              - condition: state
                entity: sensor.espyrain_controller_queue
                state_not: Idle
              - condition: state
                entity: binary_sensor.espyrain_controller_ha_link
                state: 'on'
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: input_number.espyrain_rain_delay_days
                above: 0
            card:
              type: markdown
              content: >
                ## ⚠️ RAIN DELAY ACTIVE


                All automatic watering paused for **{{
                states('input_number.espyrain_rain_delay_days') | int(0) }}**
                day(s).


                Next scheduled run will NOT execute until 

                rain delay expires on the  {{
                states('input_datetime.rain_delay_date') }}.
              card_mod:
                style: >
                  {% set rain_delay =
                  states('input_number.espyrain_rain_delay_days') | int(0) %}

                  ha-card {
                    background: radial-gradient(circle, rgba(39, 66, 77, 0.85) 0%, rgba(18, 37, 44, 0.85) 100%);
                    {% if rain_delay > 0 %}
                      border: 3px solid #FF6B6B;
                      border-top: 5px solid #FF6B6B;
                      animation: pulse-red 2s infinite;
                      background: linear-gradient(135deg, rgba(255, 107, 107, 0.2) 0%, rgba(39, 66, 77, 0.85) 100%);
                    {% else %}
                      border: 2px solid #00CED1;
                    {% endif %}
                  }

                  @keyframes pulse-red {
                    0%, 100% { 
                      border-color: #FF6B6B;
                      box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
                    }
                    50% { 
                      border-color: #FF9999;
                      box-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
                    }
                  }
          - type: conditional
            conditions:
              - condition: state
                entity: switch.espyrain_controller_winter_mode
                state: 'on'
            card:
              type: markdown
              content: >
                ## ❄ Winter Mode ACTIVE


                All automatic watering paused since **{{
                states('input_datetime.espyrain_winter_start') }}**


                Next scheduled run will NOT execute until 

                end of winter on the **{{
                states('input_datetime.espyrain_winter_end')}}**.
              card_mod:
                style: >
                  {% set rain_delay =
                  states('input_number.espyrain_rain_delay_days') | int(0) %}

                  ha-card {
                    background: radial-gradient(circle, rgba(39, 66, 77, 0.85) 0%, rgba(18, 37, 44, 0.85) 100%);
                    {% if rain_delay > 0 %}
                      border: 3px solid #FF6B6B;
                      border-top: 5px solid #FF6B6B;
                      animation: pulse-red 2s infinite;
                      background: linear-gradient(135deg, rgba(255, 107, 107, 0.2) 0%, rgba(39, 66, 77, 0.85) 100%);
                    {% else %}
                      border: 2px solid #00CED1;
                    {% endif %}
                  }

                  @keyframes pulse-red {
                    0%, 100% { 
                      border-color: #FF6B6B;
                      box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
                    }
                    50% { 
                      border-color: #FF9999;
                      box-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
                    }
                  }
          - type: vertical-stack
            cards:
              - type: markdown
                content: >
                  ## 💧 Upcoming Watering


                  ### Active Schedules: ***{{
                  states('sensor.espyrain_active_schedules_count') }}***

                  ---

                  ### 🟢 ***Next Run:*** 

                   {% set raw = states('sensor.espyrain_next_scheduled_run') %}
                   {% if raw in ['unknown', 'unavailable', 'None', ''] %}
                     No upcoming runs
                   {% elif raw.startswith('Blocked') or raw.startswith('No runs') %}
                     {{ raw }}
                   {% elif raw | regex_match('^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}: .*$') %}
                     {% set dt = raw[:16] %}
                     {% set run_name = raw[18:] %}
                     {% set ns = namespace(schedule=0) %}
                     {% for i in range(1, 9) %}
                       {% if states('input_text.espyrain_schedule_' ~ i ~ '_name') == run_name %}
                         {% set ns.schedule = i %}
                       {% endif %}
                     {% endfor %}
                     ### {{ as_timestamp(strptime(dt, '%Y-%m-%d %H:%M')) | timestamp_custom('%a %H:%M', true) }}{% if ns.schedule > 0 %} Schedule {{ ns.schedule }}{% endif %}  
                     `{{ run_name }}`
                   {% else %}
                     {{ raw }}
                   {% endif %}

                  ---

                  ### 🕐 ***Today's Schedule:*** 

                   {{ states('sensor.espyrain_today_remaining_schedules') }}

                   ---

                  ### 📅 ***Tomorrow:*** 

                   {{ states('sensor.espyrain_tomorrow_schedules') }}
                card_mod:
                  style: >
                    {% set rain_delay =
                    states('input_number.espyrain_rain_delay_days') | int(0) %}

                    ha-card {
                      background: radial-gradient(circle, rgba(39, 66, 77, 0.85) 0%, rgba(18, 37, 44, 0.85) 100%);
                      {% if rain_delay > 0 %}
                        border: 3px solid #FF6B6B;
                        border-top: 5px solid #FF6B6B;
                        animation: pulse-red 2s infinite;
                      {% else %}
                        border: 1px solid rgba(0, 206, 209, 0.5);
                      {% endif %}
                    }

                    @keyframes pulse-red {
                      0%, 100% { 
                        border-color: #FF6B6B;
                        box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
                      }
                      50% { 
                        border-color: #FF9999;
                        box-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
                      }
                    }
      - type: grid
        cards:
          - type: conditional
