# SYNC INTERVAL FROM HA TO ESP
# Add to your automations
# ════════════════════════════════════════════════════════════════

# Sync Schedule 1 Interval to ESP
- id: espyrain_sync_schedule_1_interval_to_esp
  alias: "ESPyRain: Sync Schedule 1 Interval to ESP"
  trigger:
    - platform: state
      entity_id: input_number.espyrain_schedule_1_interval
  condition:
    - condition: state
      entity_id: input_boolean.espyrain_sync_lock
      state: "off"
  action:
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_1_interval
      data:
        value: "{{ states('input_number.espyrain_schedule_1_interval') | int }}"

