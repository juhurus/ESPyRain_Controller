# ════════════════════════════════════════════════════════════
# SYNC ALL SETTINGS WHEN ENABLING SCHEDULES
# ════════════════════════════════════════════════════════════
# This ensures ALL settings sync to ESP when you enable a schedule
- id: espyrain_sync_all_on_any_enable
  alias: "ESPyRain: Sync All Settings On Any Enable"
  description: "Sync all schedule settings when any schedule is enabled"
  trigger:
    - platform: state
      entity_id:
        - input_boolean.espyrain_schedule_1_enabled
        - input_boolean.espyrain_schedule_2_enabled
        - input_boolean.espyrain_schedule_3_enabled
        - input_boolean.espyrain_schedule_4_enabled
      to: 'on'
  condition:
    - condition: state
      entity_id: input_boolean.espyrain_sync_lock
      state: "off"
  action:
    - delay:
        milliseconds: 500
    
    # Force sync ALL intervals
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_1_interval
      data:
        value: "{{ states('input_number.espyrain_schedule_1_interval') | int }}"
    
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_2_interval
      data:
        value: "{{ states('input_number.espyrain_schedule_2_interval') | int }}"
    
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_3_interval
      data:
        value: "{{ states('input_number.espyrain_schedule_3_interval') | int }}"
    
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_4_interval
      data:
        value: "{{ states('input_number.espyrain_schedule_4_interval') | int }}"
    
    # Trigger all bitmask sync automations
    - service: automation.trigger
      target:
        entity_id:
          - automation.espyrain_sync_schedule_1_days_bitmask
          - automation.espyrain_sync_schedule_2_days_bitmask
          - automation.espyrain_sync_schedule_3_days_bitmask
          - automation.espyrain_sync_schedule_4_days_bitmask
  mode: single

        

