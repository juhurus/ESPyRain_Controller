# Enhanced zone sensors with attributes

- binary_sensor:
    # S1 - Front Paddock Street
    - name: "Sprinkler S1"
      unique_id: espyrain_zone_s1
      state: "{{ is_state('switch.espyrain_controller_s1_valve', 'on') }}"
      device_class: opening
      icon: >
        {% if is_state('switch.espyrain_controller_s1_valve', 'on') %}
          mdi:valve-open
        {% else %}
          mdi:valve-closed
        {% endif %}
      attributes:
        zone_name: "Front Paddock Street"
        zone_number: 1
        runtime_minutes: "{{ states('number.espyrain_controller_s1_runtime') }}"
        enabled: "{{ is_state('switch.espyrain_controller_enable_s1', 'on') }}"
        runtime_today: "{{ states('sensor.s1_runtime_today') }}"
        runtime_yesterday: "{{ states('sensor.s1_runtime_yesterday') }}"
        runtime_this_week: "{{ states('sensor.s1_runtime_this_week') }}"
        paused: > 
          {% set queue = states('sensor.espyrain_controller_queue_display') %}
          {% set is_paused = is_state('binary_sensor.espyrain_controller_paused', 'on') %}
          {{ is_paused and 'S1' in queue }}

