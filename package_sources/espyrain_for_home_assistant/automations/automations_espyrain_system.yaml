- id: espyrain_sync_station_names_from_esp
  alias: "ESPyRain: Sync Station Names from ESP"
  description: "Mirror ESP text entity station name changes back into the HA helpers"
  trigger:
    - platform: state
      entity_id:
        - text.espyrain_controller_station_1_name
        - text.espyrain_controller_station_2_name
        - text.espyrain_controller_station_3_name
        - text.espyrain_controller_station_4_name
