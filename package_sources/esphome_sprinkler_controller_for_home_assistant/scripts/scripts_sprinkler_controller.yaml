############################################################
#                                                          #
#          SPRINKLER SCHEDULE HELPER SCRIPTS               #
#                                                          #
############################################################
# Saved as: config/scripts/scripts_sprinkler_controller.yaml

# ============================================================
# 
# ============================================================
sprinkler_manual_run:
  alias: "Sprinkler: Manual Run"
  sequence:
    - variables:
        selected: "{{ states('input_select.sprinkler_manual_station') }}"
        station_num: >
          {% set token = (selected | string).split(' ')[0] %}
          {{ token | regex_replace('[^0-9]', '') | int(0) }}
        time_str: "{{ states('input_datetime.sprinkler_manual_runtime') }}"
        duration_sec: >
          {% if time_str not in ['unknown', 'unavailable', 'None', ''] and ':' in time_str %}
            {% set p = time_str.split(':') %}
            {% set h = p[0] | int(0) %}
            {% set m = p[1] | int(0) if p | length > 1 else 0 %}
            {{ [((h * 3600) + (m * 60)), 60] | max }}
          {% else %}
            600
          {% endif %}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ station_num >= 1 }}"
          sequence:
            - service: esphome.sprinkler_controller_manual_queue_station
              data:
                station_num: "{{ station_num }}"
                duration_sec: "{{ duration_sec }}"
      default:
        - service: system_log.write
          data:
            level: warning
            message: >
              Manual run aborted. selected={{ selected }}, station_num={{ station_num }},
              runtime={{ time_str }}, controller={{ states('binary_sensor.sprinkler_controller_ha_link') }}

# ============================================================
# 
# ============================================================
sprinkler_sync_esp_time_now:
  alias: "Sprinkler: Sync ESP Time Now"
  icon: mdi:clock-sync
  mode: single
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: sensor.sprinkler_controller_sprinkler_status
              state: "Idle"
          sequence:
            - service: button.press
              target:
                entity_id: button.sprinkler_controller_restart_esp
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_boolean.sprinkler_notifications
                      state: "on"
                  sequence:
                    - service: notify.send_message
                      data:
                        entity_id: !secret sprinkler_telegram_notifier
                        title: "*Sprinkler ESP Time Sync Triggered*"
                        message: >
                          Restart requested to force SNTP re-sync.
                          Time: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
        - conditions:
            - condition: template
              value_template: "{{ states('sensor.sprinkler_controller_sprinkler_status') != 'Idle' }}"
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_boolean.sprinkler_notifications
                      state: "on"
                  sequence:
                    - service: notify.send_message
                      data:
                        entity_id: !secret sprinkler_telegram_notifier
                        title: "*Sprinkler ESP Time Sync Skipped*"
                        message: >
                          Controller is not idle ({{ states('sensor.sprinkler_controller_sprinkler_status') }}).
                          Time sync restart was not performed.

# ============================================================
# used to start stations from a button on an image
# ============================================================
sprinkler_manual_run_station:
  alias: "Sprinkler: Manual Run Station"
  mode: single
  fields:
    station_num:
      required: true
      selector:
        number:
          min: 1
          max: 16
          step: 1
          mode: box
  sequence:
    - variables:
        time_str: "{{ states('input_datetime.sprinkler_manual_runtime') }}"
        duration_sec: >
          {% if time_str not in ['unknown', 'unavailable', 'None', ''] and ':' in time_str %}
            {% set p = time_str.split(':') %}
            {% set h = p[0] | int(0) %}
            {% set m = p[1] | int(0) if p | length > 1 else 0 %}
            {{ [((h * 3600) + (m * 60)), 60] | max }}
          {% else %}
            600
          {% endif %}
    - service: esphome.sprinkler_controller_manual_queue_station
      data:
        station_num: "{{ station_num | int }}"
        duration_sec: "{{ duration_sec | int }}"


