# ================================================================
# SCHEDULE 7 - Day Mode + Bitmask + Interval Sync
# ================================================================
- id: espyrain_sync_schedule_7_days
  alias: "ESPyRain: Sync Schedule 7 Days"
  description: "Sync day_mode, days_bitmask, and interval from HA dropdown/booleans to ESP"
  trigger:
    - platform: state
      entity_id: input_select.espyrain_schedule_7_days
    - platform: state
      entity_id:
        - input_boolean.espyrain_schedule_7_monday
        - input_boolean.espyrain_schedule_7_tuesday
        - input_boolean.espyrain_schedule_7_wednesday
        - input_boolean.espyrain_schedule_7_thursday
        - input_boolean.espyrain_schedule_7_friday
        - input_boolean.espyrain_schedule_7_saturday
        - input_boolean.espyrain_schedule_7_sunday
  condition:
    - condition: template
      value_template: >
        {{ states('input_select.espyrain_schedule_7_days') not in ['unknown', 'unavailable'] }}
  action:
    - variables:
        days_mode: "{{ states('input_select.espyrain_schedule_7_days') }}"
    # Set day_mode_type on ESP
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_7_day_mode
      data:
        value: >
          {% if days_mode == 'Daily' %}0
          {% elif days_mode == 'Selected Days' %}1
          {% elif 'Every' in days_mode %}2
          {% elif 'Odd' in days_mode %}3
          {% elif 'Even' in days_mode %}4
          {% elif 'Weekdays' in days_mode or 'Weekends' in days_mode %}5
          {% else %}0{% endif %}
    # Set days_bitmask on ESP
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_7_days_bitmask
      data:
        value: >
          {% if days_mode in ['Daily'] or 'Odd' in days_mode or 'Even' in days_mode %}127
          {% elif days_mode == 'Selected Days' %}
            {{ (1 if is_state('input_boolean.espyrain_schedule_7_monday','on') else 0) +
               (2 if is_state('input_boolean.espyrain_schedule_7_tuesday','on') else 0) +
               (4 if is_state('input_boolean.espyrain_schedule_7_wednesday','on') else 0) +
               (8 if is_state('input_boolean.espyrain_schedule_7_thursday','on') else 0) +
               (16 if is_state('input_boolean.espyrain_schedule_7_friday','on') else 0) +
               (32 if is_state('input_boolean.espyrain_schedule_7_saturday','on') else 0) +
               (64 if is_state('input_boolean.espyrain_schedule_7_sunday','on') else 0) }}
          {% elif 'Weekdays' in days_mode %}31
          {% elif 'Weekends' in days_mode %}96
          {% else %}0{% endif %}
    # Set interval on ESP (only meaningful for Every X Days mode)
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_7_interval
      data:
        value: >
          {% if 'Every 2' in days_mode %}2
          {% elif 'Every 3' in days_mode %}3
          {% elif 'Every 4' in days_mode %}4
          {% elif 'Every 5' in days_mode %}5
          {% elif 'Every 6' in days_mode %}6
          {% elif 'Every 7' in days_mode %}7
          {% else %}1{% endif %}

  mode: single

