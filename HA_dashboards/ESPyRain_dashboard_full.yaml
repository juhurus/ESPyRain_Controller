            entities:
              - type: custom:fold-entity-row
                head:
                  type: section
                  label: Day Mode
                open: false
                entities:
                  - type: custom:hui-markdown-card
                    content: |
                      ### Day Mode
                      | Value | Mode |
                      |-------|------|
                      | 0 | Daily |
                      | 1 | Selected Days (uses bitmask) |
                      | 2 | Every X Days (uses interval) |
                      | 3 | Odd Days |
                      | 4 | Even Days |
                      | 5 | Weekdays / Weekends (uses bitmask) |
                    card_mod:
                      style: |
                        ha-card {
                          background: radial-gradient(circle, rgba(39, 66, 77, 0.85) 0%, rgba(18, 37, 44, 0.85) 100%);
                          border: 1px solid rgba(0, 206, 209, 0.5);
                          border-left: 3px solid #FFA500;
                          font-size: 0.9em;
                        } 
              - type: custom:fold-entity-row
                head:
                  type: section
                  label: Days Bitmask
                open: false
                entities:
                  - type: custom:hui-markdown-card
                    content: >
                      ### Days Bitmask

                      Used when Day Mode = 1 (Selected Days) or 5
                      (Weekdays/Weekends).

                      | Bit | Day | Value |

                      |-----|-----|-------|

                      | 0 | Mon | 1 |

                      | 1 | Tue | 2 |

                      | 2 | Wed | 4 |

                      | 3 | Thu | 8 |

                      | 4 | Fri | 16 |

                      | 5 | Sat | 32 |

                      | 6 | Sun | 64 |


                      Common: **Weekdays = 31** | **Weekends = 96** | **All =
                      127**
                    card_mod:
                      style: |
                        ha-card {
                          background: radial-gradient(circle, rgba(39, 66, 77, 0.85) 0%, rgba(18, 37, 44, 0.85) 100%);
                          border: 1px solid rgba(0, 206, 209, 0.5);
                          border-left: 3px solid #FFA500;
                          font-size: 0.9em;
                        }
              - type: custom:fold-entity-row
                head:
                  type: section
                  label: Station Bitmask
                open: false
                entities:
                  - type: custom:hui-markdown-card
                    content: >
                      ### Station Mask

                      Each bit enables a station. Set the sum of desired
                      stations.

                      | Bit | Station | Value |

                      |-----|---------|-------|

                      | 0 | S1 | 1 |

                      | 1 | S2 | 2 |

                      | 2 | S3 | 4 |

                      | 3 | S4 | 8 |

                      | 4 | S5 | 16 |

                      | 5 | S6 | 32 |

                      | 6 | S7 | 64 |

                      | 7 | S8 | 128 |

                      | 8 | S9 | 256 |

                      | 9 | S10 | 512 |


                      Common: **S1+S2+S3 = 7** | **All 10 = 1023**
                    card_mod:
                      style: |
                        ha-card {
                          background: radial-gradient(circle, rgba(39, 66, 77, 0.85) 0%, rgba(18, 37, 44, 0.85) 100%);
                          border: 1px solid rgba(0, 206, 209, 0.5);
                          border-left: 3px solid #FFA500;
                          font-size: 0.9em;
                        } 
              - type: custom:fold-entity-row
                head:
                  type: section
                  label: 🧪 ESP GPIO pins and wire colours
                open: false
                entities:
                  - type: custom:hui-markdown-card
                    content: |
                      ## 🧪 ESP GPIO pins and wire colours

                      `SSR 4-Port Board`
                      - `GPIO 7` S1 front paddock street side, 
                        (Relay 1, out->red, from D7->blue->CH1)

                      - `GPIO 14` S2 front paddock inside, 
                        (Relay 2, out->yellow, from D14->dark grey->CH2)

                      - `GPIO 3` S3 small island in front of shed, 
                        (Relay 3, out->white, from D3->green->CH3)


                      `Master Valve`
                      - `GPIO 5` Master Valve, 
                        (Relay 4, out->red, from D5->orange->CH4)    


                      `SSR 8-Port Board`
                      - `GPIO 4` S4 garden beds front of house, 
                        (Relay 1, out->purple, from D4->black->CH1)

                      - `GPIO 6` S5 rock island, 
                        (Relay 2, out->orange, from D6->white->CH2)

                      - `GPIO 8` S6 backyard west and alfresco, 
                        (Relay 3, out->green, from D8->light grey->CH3)

                      - `GPIO 9` S7 arena and front of tank, 
                        (Relay 4, out->grey, from D9->purple->CH4)

                      - `GPIO 10` S8 gazebo grass and garden beds, 
                        (Relay 5, out->pink/purple, from G10->blue->CH5)

                      - `GPIO 17` S9 backyard north, 
                        (Relay 6, out->brown, from D17->yellow->CH6)

                      - `GPIO 18` S10 backyard east, 
                        (Relay 7, out->blue, from D18->orange->CH7)

                      - `GPIO 25` Relay 11 spare, 
                        (Relay 8, not in use , from D25->orange->CH8)
                    card_mod:
                      style: |
                        ha-card {
                          background: radial-gradient(circle, rgba(39, 66, 77, 0.85) 0%, rgba(18, 37, 44, 0.85) 100%);
                          border: 1px solid rgba(0, 206, 209, 0.5);
                          border-left: 3px solid #FFA500;
                          font-size: 0.9em;
                        }
