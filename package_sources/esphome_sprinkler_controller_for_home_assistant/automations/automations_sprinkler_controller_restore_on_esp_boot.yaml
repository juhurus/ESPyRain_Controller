############################################################
#                                                          #
#    RESTORE BOOLEAN STATE ON ESP BOOT (v2.0)             #
#                                                          #
############################################################
# When the ESP comes online, restore the persistent HA state
# of station_X_enabled and bypass_interval_check switches.
#
# These are persisted in HA input_booleans because the ESP
# globals have restore_value: false (unreliable bool NVS).
#
# Automations:
#   1. Master automation: detects ESP online, triggers sequences
#   2. One sequence per station (1-16) to restore enabled state
#   3. One sequence to restore bypass_interval_check

- id: sprinkler_restore_on_esp_boot
  alias: "Sprinkler: Restore Boolean State on ESP Boot"
  description: "When ESP comes online, restore station_enabled and bypass_interval_check from HA helpers"
  trigger:
    - platform: state
      entity_id: binary_sensor.sprinkler_controller_ha_link
      to: 'on'
      for:
        seconds: 2
  condition:
    - condition: template
      value_template: >
        {{ trigger.from_state.state in ['off', 'unknown', 'unavailable'] or trigger.from_state is none }}
  action:
    # Allow 5 seconds for ESP to fully initialize and sync_lock to be set
    - delay:
        seconds: 5

    # ──────────────────────────────────────────────────────────
    # Restore all 16 station enabled states
    # ──────────────────────────────────────────────────────────
    
    # Station 1
    - service: "switch.turn_{{ states('input_boolean.sprinkler_station_1_enabled') }}"
      target:
        entity_id: switch.sprinkler_controller_station_1_enabled
      continue_on_error: true

    # Station 2
    - service: "switch.turn_{{ states('input_boolean.sprinkler_station_2_enabled') }}"
      target:
        entity_id: switch.sprinkler_controller_station_2_enabled
      continue_on_error: true

    # Station 3
    - service: "switch.turn_{{ states('input_boolean.sprinkler_station_3_enabled') }}"
      target:
        entity_id: switch.sprinkler_controller_station_3_enabled
      continue_on_error: true

    # Station 4
    - service: "switch.turn_{{ states('input_boolean.sprinkler_station_4_enabled') }}"
      target:
        entity_id: switch.sprinkler_controller_station_4_enabled
      continue_on_error: true

    # Station 5
    - service: "switch.turn_{{ states('input_boolean.sprinkler_station_5_enabled') }}"
      target:
        entity_id: switch.sprinkler_controller_station_5_enabled
      continue_on_error: true

    # Station 6
    - service: "switch.turn_{{ states('input_boolean.sprinkler_station_6_enabled') }}"
      target:
        entity_id: switch.sprinkler_controller_station_6_enabled
      continue_on_error: true

    # Station 7
    - service: "switch.turn_{{ states('input_boolean.sprinkler_station_7_enabled') }}"
      target:
        entity_id: switch.sprinkler_controller_station_7_enabled
      continue_on_error: true

    # Station 8
    - service: "switch.turn_{{ states('input_boolean.sprinkler_station_8_enabled') }}"
      target:
        entity_id: switch.sprinkler_controller_station_8_enabled
      continue_on_error: true

    # Station 9
    - service: "switch.turn_{{ states('input_boolean.sprinkler_station_9_enabled') }}"
      target:
        entity_id: switch.sprinkler_controller_station_9_enabled
      continue_on_error: true

    # Station 10
    - service: "switch.turn_{{ states('input_boolean.sprinkler_station_10_enabled') }}"
      target:
        entity_id: switch.sprinkler_controller_station_10_enabled
      continue_on_error: true

    # Station 11
    - service: "switch.turn_{{ states('input_boolean.sprinkler_station_11_enabled') }}"
      target:
        entity_id: switch.sprinkler_controller_station_11_enabled
      continue_on_error: true

    # Station 12
    - service: "switch.turn_{{ states('input_boolean.sprinkler_station_12_enabled') }}"
      target:
        entity_id: switch.sprinkler_controller_station_12_enabled
      continue_on_error: true

    # Station 13
    - service: "switch.turn_{{ states('input_boolean.sprinkler_station_13_enabled') }}"
      target:
        entity_id: switch.sprinkler_controller_station_13_enabled
      continue_on_error: true

    # Station 14
    - service: "switch.turn_{{ states('input_boolean.sprinkler_station_14_enabled') }}"
      target:
        entity_id: switch.sprinkler_controller_station_14_enabled
      continue_on_error: true

    # Station 15
    - service: "switch.turn_{{ states('input_boolean.sprinkler_station_15_enabled') }}"
      target:
        entity_id: switch.sprinkler_controller_station_15_enabled
      continue_on_error: true

    # Station 16
    - service: "switch.turn_{{ states('input_boolean.sprinkler_station_16_enabled') }}"
      target:
        entity_id: switch.sprinkler_controller_station_16_enabled
      continue_on_error: true

    # ──────────────────────────────────────────────────────────
    # Restore bypass_interval_check
    # ──────────────────────────────────────────────────────────
    - service: "switch.turn_{{ states('input_boolean.sprinkler_bypass_interval_check') }}"
      target:
        entity_id: switch.sprinkler_controller_sprinkler_controller_bypass_interval_check
      continue_on_error: true

    # # - service: system_log.write
      # # data:
        # # level: info
        # # message: >
          # # Sprinkler: Restored 16 station enabled states + bypass_interval_check
          # # from HA helpers after ESP boot.
    - service: system_log.write
      data:
        level: info
        message: "Sprinkler: Restored 16 station enabled states + bypass_interval_check from HA helpers after ESP boot."
    
# ════════════════════════════════════════════════════════════════
# KEEP HELPERS IN SYNC WITH ESP (HA -> ESP on change)
# These automations sync the HA input_booleans to the ESP when changed.
# ════════════════════════════════════════════════════════════════

- id: sprinkler_sync_station_enabled_to_esp
  alias: "Sprinkler: Sync Station Enabled to ESP (HA Change)"
  description: "When HA input_boolean station_X_enabled changes, update ESP switch"
  trigger:
    - platform: state
      entity_id:
        - input_boolean.sprinkler_station_1_enabled
        - input_boolean.sprinkler_station_2_enabled
        - input_boolean.sprinkler_station_3_enabled
        - input_boolean.sprinkler_station_4_enabled
        - input_boolean.sprinkler_station_5_enabled
        - input_boolean.sprinkler_station_6_enabled
        - input_boolean.sprinkler_station_7_enabled
        - input_boolean.sprinkler_station_8_enabled
        - input_boolean.sprinkler_station_9_enabled
        - input_boolean.sprinkler_station_10_enabled
        - input_boolean.sprinkler_station_11_enabled
        - input_boolean.sprinkler_station_12_enabled
        - input_boolean.sprinkler_station_13_enabled
        - input_boolean.sprinkler_station_14_enabled
        - input_boolean.sprinkler_station_15_enabled
        - input_boolean.sprinkler_station_16_enabled
  condition:
    - condition: state
      entity_id: input_boolean.sprinkler_sync_lock
      state: 'off'
  action:
    - variables:
        station_num: "{{ trigger.entity_id | regex_findall('station_(\\d+)') | first }}"
    - service: "switch.turn_{{ trigger.to_state.state }}"
      target:
        entity_id: "switch.sprinkler_controller_station_{{ station_num }}_enabled"
      continue_on_error: true

- id: sprinkler_sync_bypass_interval_to_esp
  alias: "Sprinkler: Sync Bypass Interval Check to ESP"
  description: "When HA input_boolean bypass_interval_check changes, update ESP switch"
  trigger:
    - platform: state
      entity_id: input_boolean.sprinkler_bypass_interval_check
  condition:
    - condition: state
      entity_id: input_boolean.sprinkler_sync_lock
      state: 'off'
  action:
    - service: "switch.turn_{{ trigger.to_state.state }}"
      target:
        entity_id: switch.sprinkler_controller_sprinkler_controller_bypass_interval_check
      continue_on_error: true

- id: sprinkler_sync_bypass_interval_from_esp
  alias: "Sprinkler: Sync Bypass Interval Check from ESP"
  description: "Keep HA helper in sync when ESP bypass switch is changed from ESP/dashboard"
  trigger:
    - platform: state
      entity_id: switch.sprinkler_controller_sprinkler_controller_bypass_interval_check
  condition:
    - condition: state
      entity_id: input_boolean.sprinkler_sync_lock
      state: 'off'
    - condition: template
      value_template: >
        {{
          trigger.to_state is not none and
          trigger.to_state.state in ['on', 'off'] and
          states('input_boolean.sprinkler_bypass_interval_check') in ['on', 'off'] and
          trigger.to_state.state != states('input_boolean.sprinkler_bypass_interval_check')
        }}
  action:
    - service: "input_boolean.turn_{{ trigger.to_state.state }}"
      target:
        entity_id: input_boolean.sprinkler_bypass_interval_check

# ════════════════════════════════════════════════════════════════
# REVERSE SYNC: ESP -> HA (optional, for full state visibility)
# Disabled by default. Enable if you want HA to always show ESP reality.
# ════════════════════════════════════════════════════════════════
# Note: Enabling these creates bidirectional sync which can be risky
# if not carefully gated. The primary sync (HA->ESP on boot) should
# be sufficient for most use cases.


