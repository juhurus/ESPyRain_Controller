script:
  - id: check_schedule_triggers
    mode: single
    then:
      - lambda: |-
          auto now = id(esp_time).now();
          if (!now.is_valid()) {
            ESP_LOGW("schedule_check", "Time not valid, skipping check");
            return;
          }

          time_t now_ts = now.timestamp;
          int num_sched = (int)id(num_schedules);

          for (int sched = 1; sched <= num_sched; sched++) {
            time_t last_run = id(get_schedule_last_run)(sched);
            if (!id(schedule_matches_candidate)(sched, now_ts, last_run, true, true)) {
              continue;
            }

            ESP_LOGI("schedule_check", "AUTO-TRIGGERING Schedule %d at %02d:%02d:%02d",
                     sched, now.hour, now.minute, now.second);

            if (id(queue_schedule_run)(sched)) {
              id(set_schedule_last_run)(sched, now_ts);
              id(calculate_next_7_runs)(sched);
            } else {
              ESP_LOGW("schedule_check", "Schedule %d matched but was not queued", sched);
            }

            break;
          }
