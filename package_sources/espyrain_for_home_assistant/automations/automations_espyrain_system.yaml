# ================================================================
#                                                                
#                     System Automations                           
#                                                               
# ================================================================
# Saved as: config/package_sources/espyrain_for_home_assistant/automations/automations_espyrain_system.yaml

# ================================================================
# MASTER SWITCH - DISABLE ALL SCHEDULES            
# ================================================================
- id: espyrain_master_switch_disable
  alias: "ESPyRain: Winter Mode - Disable All Schedules"
  description: "When winter mode turns ON, backup current schedule states and disable all schedules"
  
  trigger:
    - platform: state
      entity_id: input_boolean.espyrain_winter_mode
      from: 'off'
      to: 'on'
  
  action:
    # Stop any currently running watering
    - service: button.press
      target:
        entity_id: button.espyrain_controller_stop
    
    # Backup and disable each schedule
    - repeat:
        count: 8
        sequence:
          - variables:
              schedule_num: "{{ repeat.index }}"
              schedule_enabled: "input_boolean.espyrain_schedule_{{ repeat.index }}_enabled"
              schedule_backup: "input_boolean.espyrain_schedule_{{ repeat.index }}_backup"
          
          # Backup current state
          - service: input_boolean.turn_{{ 'on' if is_state(schedule_enabled, 'on') else 'off' }}
            target:
              entity_id: "{{ schedule_backup }}"
          
          # Disable schedule
          - service: input_boolean.turn_off
            target:
              entity_id: "{{ schedule_enabled }}"
    
    # UPDATE RAIN DELAY END DATE
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.espyrain_winter_mode_since
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        
# ================================================================
# MASTER SWITCH - RESTORE ALL SCHEDULES            
# ================================================================
- id: espyrain_master_switch_enable
  alias: "ESPyRain: Winter Mode - Restore All Schedules"
  description: "When winter mode turns OFF, restore previously enabled schedules"
  
  trigger:
    - platform: state
      entity_id: input_boolean.espyrain_winter_mode
      from: 'on'
      to: 'off'
  
  action:
    # Restore each schedule from backup
    - repeat:
        count: 8
        sequence:
          - variables:
              schedule_num: "{{ repeat.index }}"
              schedule_enabled: "input_boolean.espyrain_schedule_{{ repeat.index }}_enabled"
              schedule_backup: "input_boolean.espyrain_schedule_{{ repeat.index }}_backup"
          
          # Restore schedule state from backup
          - service: input_boolean.turn_{{ 'on' if is_state(schedule_backup, 'on') else 'off' }}
            target:
              entity_id: "{{ schedule_enabled }}"
    
# ================================================================
# UPDATE RAIN DELAY END DATE
# ================================================================
- id: espyrain_rain_delay_set_date
  alias: "ESPyRain: Set Rain Delay End Date"
  description: "Keep the rain delay end date helper aligned with the configured delay length"
  trigger:
    - platform: state
      entity_id: input_number.espyrain_rain_delay_days
  action:
    # Keep the displayed rain delay end date aligned with the day countdown
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.rain_delay_date
      data:
        date: >
          {% set days = states('input_number.espyrain_rain_delay_days') | int %}
          {% if days > 0 %}
            {{ (now() + timedelta(days=days)).strftime('%Y-%m-%d') }}
          {% else %}
            {{ now().strftime('%Y-%m-%d') }}
          {% endif %}
          
# ================================================================
# RAIN DELAY COUNTDOWN
# ================================================================
# Disabled on the HA side. The ESP controller decrements rain delay at
# midnight and is the single source of truth for the remaining day count.

# ================================================================
# SYNC BYPASS SWITCH TO ESP
# ================================================================
- id: espyrain_sync_bypass_interval_check
  alias: "ESPyRain: Sync Bypass Interval Check to ESP"
  description: "Mirror the HA bypass interval helper to the ESP switch when sync lock is off"
  trigger:
    - platform: state
      entity_id: input_boolean.espyrain_bypass_interval_check
  condition:
    - condition: state
      entity_id: input_boolean.espyrain_sync_lock
      state: "off"
  action:
    # Mirror the HA helper to the ESP switch unless a bulk sync is in progress
    - service: "switch.turn_{{ 'on' if is_state('input_boolean.espyrain_bypass_interval_check', 'on') else 'off' }}"
      target:
        entity_id: switch.espyrain_controller_bypass_interval_check
# ================================================================
# REVERSE SYNC: ESP -> HA ON STARTUP
# Syncs all schedule settings FROM ESP TO HA when HA restarts
# ================================================================
- id: espyrain_sync_all_settings_from_esp_on_startup
  alias: "ESPyRain: Sync All Settings FROM ESP on Startup"
  description: "Restore HA input_numbers from ESP after HA restart"
  trigger:
    - platform: homeassistant
      event: start
  condition: []
  action:
    # Prevent HA->ESP sync automations from running while we bulk-sync
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.espyrain_sync_lock

    # Wait for the ESP device entities to be available before restoring HA helpers
    - delay:
        seconds: 30

    # Sync controller-side system values back into HA helpers before normal HA->ESP syncs resume
    - service: input_boolean.turn_{{ 'on' if is_state('switch.espyrain_controller_bypass_interval_check', 'on') else 'off' }}
      target:
        entity_id: input_boolean.espyrain_bypass_interval_check

    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_rain_delay_days
      data:
        value: "{{ states('number.espyrain_controller_rain_delay_days') | float(0) }}"
    
# ================================================================
# SYNC SCHEDULE 1
# ================================================================
    
    # Interval
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_schedule_1_interval
      data:
        value: "{{ states('number.espyrain_controller_schedule_1_interval') | float }}"
    
    # Bitmask (sync to select for day mode reconstruction)
    # Note: This is read-only, ESP is source of truth
    
# ================================================================
# SYNC SCHEDULE 2
# ================================================================
    
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_schedule_2_interval
      data:
        value: "{{ states('number.espyrain_controller_schedule_2_interval') | float }}"
    
# ================================================================
# SYNC SCHEDULE 3
# ================================================================
    
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_schedule_3_interval
      data:
        value: "{{ states('number.espyrain_controller_schedule_3_interval') | float }}"
    
# ================================================================
# SYNC SCHEDULE 4
# ================================================================
    
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_schedule_4_interval
      data:
        value: "{{ states('number.espyrain_controller_schedule_4_interval') | float }}"
    
# ================================================================
# SYNC SCHEDULE 5
# ================================================================
    
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_schedule_5_interval
      data:
        value: "{{ states('number.espyrain_controller_schedule_5_interval') | float }}"
    
# ================================================================
# SYNC SCHEDULE 6
# ================================================================
    
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_schedule_6_interval
      data:
        value: "{{ states('number.espyrain_controller_schedule_6_interval') | float }}"
    
# ================================================================
# SYNC SCHEDULE 7
# ================================================================
    
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_schedule_7_interval
      data:
        value: "{{ states('number.espyrain_controller_schedule_7_interval') | float }}"
    
# ================================================================
# SYNC SCHEDULE 8
# ================================================================
    
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_schedule_8_interval
      data:
        value: "{{ states('number.espyrain_controller_schedule_8_interval') | float }}"
    
# ================================================================
# LOG COMPLETION
# ================================================================
    
    - service: system_log.write
      data:
        message: >
          Sprinkler settings synced FROM ESP:
          Schedule 1 interval: {{ states('number.espyrain_controller_schedule_1_interval') }}
          Schedule 2 interval: {{ states('number.espyrain_controller_schedule_2_interval') }}
          Schedule 3 interval: {{ states('number.espyrain_controller_schedule_3_interval') }}
          Schedule 4 interval: {{ states('number.espyrain_controller_schedule_4_interval') }}
          Schedule 5 interval: {{ states('number.espyrain_controller_schedule_5_interval') }}
          Schedule 6 interval: {{ states('number.espyrain_controller_schedule_6_interval') }}
          Schedule 7 interval: {{ states('number.espyrain_controller_schedule_7_interval') }}
          Schedule 8 interval: {{ states('number.espyrain_controller_schedule_8_interval') }}
          Bypass: {{ states('switch.espyrain_controller_bypass_interval_check') }}
          Rain delay: {{ states('number.espyrain_controller_rain_delay_days') }} day(s)
          Auto resume after: {{ states('number.espyrain_controller_auto_resume_after_minutes') }} min
        level: info
    # Re-enable normal HA->ESP syncs once the restore is complete
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.espyrain_sync_lock
  mode: single

# ================================================================
# SYNC ON ESP RECONNECT
# ================================================================
- id: espyrain_sync_all_settings_from_esp_on_reconnect
  alias: "ESPyRain: Sync All Settings FROM ESP on Reconnect"
  description: "Restore HA input_numbers when ESP reconnects"
  trigger:
    - platform: state
      entity_id: binary_sensor.espyrain_controller_ha_link
      from: 'off'
      to: 'on'
      for:
        seconds: 5
  condition: []
  action:
    # Prevent HA->ESP sync automations from running while we bulk-sync
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.espyrain_sync_lock

    # Wait for ESP to fully stabilize
    - delay:
        seconds: 10

    # Sync controller-side system values back into HA helpers before normal HA->ESP syncs resume
    - service: input_boolean.turn_{{ 'on' if is_state('switch.espyrain_controller_bypass_interval_check', 'on') else 'off' }}
      target:
        entity_id: input_boolean.espyrain_bypass_interval_check

    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_rain_delay_days
      data:
        value: "{{ states('number.espyrain_controller_rain_delay_days') | float(0) }}"
    
    # Sync all intervals
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_schedule_1_interval
      data:
        value: "{{ states('number.espyrain_controller_schedule_1_interval') | float }}"
    
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_schedule_2_interval
      data:
        value: "{{ states('number.espyrain_controller_schedule_2_interval') | float }}"
    
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_schedule_3_interval
      data:
        value: "{{ states('number.espyrain_controller_schedule_3_interval') | float }}"
    
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_schedule_4_interval
      data:
        value: "{{ states('number.espyrain_controller_schedule_4_interval') | float }}"
    
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_schedule_5_interval
      data:
        value: "{{ states('number.espyrain_controller_schedule_5_interval') | float }}"
    
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_schedule_6_interval
      data:
        value: "{{ states('number.espyrain_controller_schedule_6_interval') | float }}"
    
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_schedule_7_interval
      data:
        value: "{{ states('number.espyrain_controller_schedule_7_interval') | float }}"
    
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_schedule_8_interval
      data:
        value: "{{ states('number.espyrain_controller_schedule_8_interval') | float }}"
    
    - service: system_log.write
      data:
        message: "Sprinkler settings synced FROM ESP after reconnect"
        level: info
    # Re-enable normal HA->ESP syncs once the restore is complete
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.espyrain_sync_lock
  mode: single

# ================================================================
# Capture elapsed time when paused
# ================================================================
- id: espyrain_store_zone_elapsed_on_pause
  alias: "ESPyRain: Store Zone Elapsed on Pause"
  trigger:
    - platform: state
      entity_id: binary_sensor.espyrain_controller_paused
      to: 'on'
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_zone_elapsed_at_pause
      data:
        value: "{{ states('sensor.espyrain_zone_elapsed_seconds') | float(0) }}"

# ================================================================
# REVERSE SYNC: ESP BYPASS SWITCH -> HA HELPER
# ================================================================
- id: espyrain_sync_bypass_interval_check_from_esp
  alias: "ESPyRain: Sync Bypass Interval Check from ESP"
  description: "Mirror direct ESP bypass switch changes back into the HA helper while avoiding sync-loop conflicts"
  trigger:
    - platform: state
      entity_id: switch.espyrain_controller_bypass_interval_check
  condition:
    - condition: state
      entity_id: input_boolean.espyrain_sync_lock
      state: "off"
  action:
    # Keep the HA helper aligned when the ESP switch is changed directly
    - service: input_boolean.turn_{{ 'on' if is_state('switch.espyrain_controller_bypass_interval_check', 'on') else 'off' }}
      target:
        entity_id: input_boolean.espyrain_bypass_interval_check
  mode: single

# ================================================================
# REVERSE SYNC: ESP RAIN DELAY NUMBER -> HA HELPER
# ================================================================
- id: espyrain_sync_rain_delay_from_esp
  alias: "ESPyRain: Sync Rain Delay from ESP"
  description: "Mirror direct ESP rain delay changes and controller midnight decrements back into the HA helper"
  trigger:
    - platform: state
      entity_id: number.espyrain_controller_rain_delay_days
  condition:
    - condition: state
      entity_id: input_boolean.espyrain_sync_lock
      state: "off"
    - condition: template
      value_template: >
        {{
          trigger.to_state is not none and
          trigger.to_state.state not in ['unknown', 'unavailable', 'none', ''] and
          (states('input_number.espyrain_rain_delay_days') | float(-1)) != (trigger.to_state.state | float(-1))
        }}
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.espyrain_sync_lock
    - service: input_number.set_value
      target:
        entity_id: input_number.espyrain_rain_delay_days
      data:
        value: "{{ trigger.to_state.state | float(0) }}"
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.espyrain_sync_lock
  mode: single

# ================================================================
# SEED DEFAULT SCHEDULE AND STATION NAMES
# ================================================================
- id: espyrain_seed_default_names
  alias: "ESPyRain: Seed Default Schedule and Station Names"
  description: "Seed default schedule and station names only when the HA helper is blank, unknown, or unavailable"
  trigger:
    - platform: homeassistant
      event: start
    - platform: state
      entity_id:
        - input_text.espyrain_schedule_1_name
        - input_text.espyrain_schedule_2_name
        - input_text.espyrain_schedule_3_name
        - input_text.espyrain_schedule_4_name
        - input_text.espyrain_schedule_5_name
        - input_text.espyrain_schedule_6_name
        - input_text.espyrain_schedule_7_name
        - input_text.espyrain_schedule_8_name
        - input_text.espyrain_station_1_name
        - input_text.espyrain_station_2_name
        - input_text.espyrain_station_3_name
        - input_text.espyrain_station_4_name
        - input_text.espyrain_station_5_name
        - input_text.espyrain_station_6_name
        - input_text.espyrain_station_7_name
        - input_text.espyrain_station_8_name
        - input_text.espyrain_station_9_name
        - input_text.espyrain_station_10_name
        - input_text.espyrain_station_11_name
        - input_text.espyrain_station_12_name
        - input_text.espyrain_station_13_name
        - input_text.espyrain_station_14_name
        - input_text.espyrain_station_15_name
        - input_text.espyrain_station_16_name
  condition: []
  action:
    # Give helpers and restored states a moment to settle after HA startup
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.platform == 'homeassistant' }}"
          sequence:
            - delay:
                seconds: 5

    # Fill only missing names so first-boot defaults appear without overwriting custom user values
    - variables:
        mappings:
          - entity: input_text.espyrain_schedule_1_name
            default_value: Schedule1
          - entity: input_text.espyrain_schedule_2_name
            default_value: Schedule2
          - entity: input_text.espyrain_schedule_3_name
            default_value: Schedule3
          - entity: input_text.espyrain_schedule_4_name
            default_value: Schedule4
          - entity: input_text.espyrain_schedule_5_name
            default_value: Schedule5
          - entity: input_text.espyrain_schedule_6_name
            default_value: Schedule6
          - entity: input_text.espyrain_schedule_7_name
            default_value: Schedule7
          - entity: input_text.espyrain_schedule_8_name
            default_value: Schedule8
          - entity: input_text.espyrain_station_1_name
            default_value: Station1
          - entity: input_text.espyrain_station_2_name
            default_value: Station2
          - entity: input_text.espyrain_station_3_name
            default_value: Station3
          - entity: input_text.espyrain_station_4_name
            default_value: Station4
          - entity: input_text.espyrain_station_5_name
            default_value: Station5
          - entity: input_text.espyrain_station_6_name
            default_value: Station6
          - entity: input_text.espyrain_station_7_name
            default_value: Station7
          - entity: input_text.espyrain_station_8_name
            default_value: Station8
          - entity: input_text.espyrain_station_9_name
            default_value: Station9
          - entity: input_text.espyrain_station_10_name
            default_value: Station10
          - entity: input_text.espyrain_station_11_name
            default_value: Station11
          - entity: input_text.espyrain_station_12_name
            default_value: Station12
          - entity: input_text.espyrain_station_13_name
            default_value: Station13
          - entity: input_text.espyrain_station_14_name
            default_value: Station14
          - entity: input_text.espyrain_station_15_name
            default_value: Station15
          - entity: input_text.espyrain_station_16_name
            default_value: Station16
    - repeat:
        for_each: "{{ mappings }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {{ trigger.platform == 'homeassistant' or trigger.entity_id == repeat.item.entity }}
                  - condition: template
                    value_template: >
                      {{ states(repeat.item.entity) in ['unknown', 'unavailable', 'none', ''] }}
                sequence:
                  # Restore the default label when a name is missing, including after a user clears the field
                  - service: input_text.set_value
                    target:
                      entity_id: "{{ repeat.item.entity }}"
                    data:
                      value: "{{ repeat.item.default_value }}"
  mode: restart

