    id: paused_minutes
    icon: mdi:timer-pause-outline
    unit_of_measurement: "min"
    accuracy_decimals: 0
    lambda: |-
      if (id(is_paused) && id(paused_timestamp) > 0) {
        uint32_t elapsed_ms = millis() - id(paused_timestamp);
        return elapsed_ms / 60000.0;  // Convert to minutes
      }
      return 0;
    update_interval: 1s

  # NEW: Show heartbeat age
  - platform: template
    name: "Heartbeat Age"
    id: heartbeat_age
    unit_of_measurement: "s"
    accuracy_decimals: 0
    icon: mdi:heart-pulse
    lambda: |-
      if (id(last_heartbeat_time) > 0) {
        return (millis() - id(last_heartbeat_time)) / 1000.0;
      }
      return 0;
    update_interval: 10s
    
  # NEW: Hours since HA disconnected
  - platform: template
    name: "Hours Since HA Disconnected"
    id: hours_since_ha_disconnected
    icon: mdi:clock-alert-outline
    unit_of_measurement: "h"
    accuracy_decimals: 1
    lambda: |-
      bool has_heartbeat = id(last_heartbeat_time) > 0;
      float heartbeat_age = has_heartbeat
        ? (millis() - id(last_heartbeat_time)) / 1000.0f
        : 0.0f;
      bool ha_ok = has_heartbeat && heartbeat_age <= (float)id(heartbeat_timeout_seconds);
      if (ha_ok) {
        return 0.0;
      } else if (id(ha_last_disconnected_time) > 0) {
        uint32_t elapsed_ms = millis() - id(ha_last_disconnected_time);
        return elapsed_ms / 3600000.0;
      }
      return 0.0;
    update_interval: 60s
    

    

