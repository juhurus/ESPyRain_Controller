button:
  - platform: template
    name: "Run Schedule 1 Now"
    id: run_schedule_1_button
    icon: mdi:play
    on_press:
      - lambda: |-
          if (id(queue_schedule_run)(1)) {
            id(calculate_next_7_runs)(1);
          }
          return;

          if (id(is_running)) {
            ESP_LOGW("schedule", "Cannot start: system already running");
            return;
          }

          int sched_num = 1;
          if (id(schedule_1_enabled) == 0) {
            ESP_LOGW("schedule", "Schedule %d is disabled", sched_num);
            return;
          }

          uint16_t station_mask = id(schedule_1_station_mask);
          uint8_t soak = id(schedule_1_soak);
          uint8_t seasonal_pct = id(schedule_1_seasonal_adj);
          float seasonal = seasonal_pct / 100.0f;

          std::string sched_name = id(schedule_1_name);
          ESP_LOGI("schedule", "════════════════════════════════════════");
          ESP_LOGI("schedule", "Manual run: Schedule %d (%s)", sched_num, sched_name.c_str());
          ESP_LOGI("schedule", "Seasonal: %.0f%%, Soak cycles: %d", seasonal * 100.0f, soak);
          ESP_LOGI("schedule", "════════════════════════════════════════");

          id(queue_tracker).clear();
          id(queue_durations).clear();

          int num_active = (int)id(num_stations);
          for (int i = 1; i <= num_active; i++) {
            if (station_mask & (1 << (i - 1))) {
              if (id(get_station_enabled)(i)) {
                if (id(is_station_coupled_to_another)(i)) {
                  ESP_LOGI("schedule", "  Skipped: S%d - coupled to another station", i);
                  continue;
                }
                uint8_t runtime_min = id(get_station_runtime)(i);
                uint32_t base_runtime_sec = (uint32_t)(runtime_min * seasonal * 60.0f);
                if (base_runtime_sec < 1) base_runtime_sec = 1;
                // Soak splits a station runtime across all soak cycles.
                uint32_t cycles = (uint32_t)soak + 1;
                uint32_t runtime_sec = (base_runtime_sec + cycles - 1) / cycles;
                if (runtime_sec < 1) runtime_sec = 1;

                id(queue_tracker).push_back(i);
                id(queue_durations).push_back(runtime_sec);

                std::string stn_name = id(get_station_name)(i);
                ESP_LOGI("schedule", "  Queued: S%d (%s) - %d min * %.0f%% = %d sec",
                         i, stn_name.c_str(), runtime_min, seasonal * 100.0f, runtime_sec);
              }
            }
          }

          if (id(queue_tracker).empty()) {
            ESP_LOGW("schedule", "No stations to run! Queue is empty.");
            return;
          }

          id(current_schedule_number) = sched_num;
          id(soak_cycles_remaining) = soak;
          id(queue_index) = -1;
          id(is_running) = true;
          id(is_paused) = false;
          id(soak_resting) = false;
          id(current_station) = 0;

          uint32_t cycle_total = 0;
          for (auto d : id(queue_durations)) cycle_total += d;

          int rest_seconds = 0;
          if (soak > 0) {
            rest_seconds = (int)id(soak_rest_minutes) * 60;
          }

          uint32_t total_with_soak =
            (cycle_total * ((uint32_t)soak + 1)) + ((uint32_t)rest_seconds * (uint32_t)soak);
          id(queue_total_time_initial) = (int)total_with_soak;
          id(total_queue_time_remaining) = (int)total_with_soak;

          ESP_LOGI("schedule", "Queue: %d stations, %d sec/cycle, soak=%d, rest=%d sec",
                   id(queue_tracker).size(), cycle_total, soak, rest_seconds);

          id(run_next_station).execute();



  - platform: template
    name: "Run Schedule 2 Now"
    id: run_schedule_2_button
    icon: mdi:play
    on_press:
      - lambda: |-
          if (id(queue_schedule_run)(2)) {
