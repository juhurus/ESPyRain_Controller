- id: sprinkler_notify_rain_delay_changed
  alias: "Sprinkler: Rain Delay Changed (Notifications)"
  mode: single
  trigger:
    - platform: state
      entity_id: number.sprinkler_controller_rain_delay_days
  condition:
    - condition: template
      value_template: >
        {{
          trigger.from_state is not none and
          trigger.to_state is not none and
          trigger.from_state.state not in ['unknown', 'unavailable'] and
          trigger.to_state.state not in ['unknown', 'unavailable'] and
          (trigger.from_state.state | int(0)) != (trigger.to_state.state | int(0))
        }}
    - condition: state
      entity_id: input_boolean.sprinkler_notifications
      state: "on"

  action:
    - variables:
        old_days: "{{ trigger.from_state.state | int(0) }}"
        new_days: "{{ trigger.to_state.state | int(0) }}"
    - service: notify.send_message
      data:
        entity_id: !secret sprinkler_telegram_notifier
        title: "⛈ *Rain Delay Updated*"
        message: >
          📅 Rain delay: {{ old_days }} -> {{ new_days }} day(s).
          {% if new_days == 0 %}
          
          ✔ Automatic runs are enabled again.
          {% endif %}




- id: sprinkler_notify_esp_time_drift_high
  alias: "Sprinkler: ESP Time Drift High (Notifications)"
  mode: single
  trigger:
    - platform: numeric_state
      entity_id: sensor.sprinkler_esp_time_drift_seconds
      above: 300
      for:
        minutes: 10
    - platform: numeric_state
      entity_id: sensor.sprinkler_esp_time_drift_seconds
      below: -300
      for:
        minutes: 10
  condition:
    - condition: state
      entity_id: input_boolean.sprinkler_notifications
      state: "on"
    - condition: state
      entity_id: binary_sensor.sprinkler_controller_ha_link
      state: "on"
  action:
    - variables:
        drift_abs: "{{ (states('sensor.sprinkler_esp_time_drift_seconds') | float(0)) | abs | round(1) }}"
        direction: >
          {% if (states('sensor.sprinkler_esp_time_drift_seconds') | float(0)) > 0 %}
            behind HA
          {% else %}
            ahead of HA
          {% endif %}
    - service: notify.send_message
      data:
        entity_id: !secret sprinkler_telegram_notifier
        title: "*Sprinkler ESP Time Drift Detected*"
        message: >
          Drift is {{ drift_abs }}s (ESP {{ direction }}) for at least 10 minutes.
          
          Controller status: {{ states('sensor.sprinkler_controller_sprinkler_status') }}
          ESP time: {{ states('sensor.sprinkler_controller_esp_date_time') }}
          HA time: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}

- id: sprinkler_auto_recover_esp_time_drift
  alias: "Sprinkler: Auto Recover ESP Time Drift"
  mode: single
  trigger:
    - platform: numeric_state
      entity_id: sensor.sprinkler_esp_time_drift_seconds
      above: 300
      for:
        minutes: 15
    - platform: numeric_state
      entity_id: sensor.sprinkler_esp_time_drift_seconds
      below: -300
      for:
        minutes: 15
  condition:
    - condition: state
      entity_id: binary_sensor.sprinkler_controller_ha_link
      state: "on"
    - condition: state
      entity_id: sensor.sprinkler_controller_sprinkler_status
      state: "Idle"
  action:
    - variables:
        drift_before: "{{ states('sensor.sprinkler_esp_time_drift_seconds') | float(0) }}"
    - service: button.press
      target:
        entity_id: button.sprinkler_controller_restart_esp
    - delay:
        seconds: 90
    - variables:
        drift_after_abs: "{{ (states('sensor.sprinkler_esp_time_drift_seconds') | float(9999)) | abs }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ drift_after_abs > 300 }}"
            - condition: state
              entity_id: input_boolean.sprinkler_notifications
              state: "on"
          sequence:
            - service: notify.send_message
              data:
                entity_id: !secret sprinkler_telegram_notifier
                title: "*Sprinkler ESP Time Resync Failed*"
                message: >
                  Auto-resync attempted (ESP restart) but drift is still high.
                  
                  Before: {{ drift_before | round(1) }}s
                  After: {{ states('sensor.sprinkler_esp_time_drift_seconds') }}s
                  ESP time: {{ states('sensor.sprinkler_controller_esp_date_time') }}
                  HA time: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
        - conditions:
            - condition: template
              value_template: "{{ drift_after_abs <= 300 }}"
            - condition: state
              entity_id: input_boolean.sprinkler_notifications
              state: "on"
          sequence:
            - service: notify.send_message
              data:
                entity_id: !secret sprinkler_telegram_notifier
                title: "*Sprinkler ESP Time Resync Successful*"
                message: >
                  Auto-resync completed successfully.
                  
                  Before: {{ drift_before | round(1) }}s
                  After: {{ states('sensor.sprinkler_esp_time_drift_seconds') }}s

