# ════════════════════════════════════════════════════════════════
# WHAT THIS DOES:
# ════════════════════════════════════════════════════════════════
#
# SCENARIO 1: Schedule disabled, then re-enabled
# - User disables Schedule 3 (last_run = Jan 28)
# - User re-enables Schedule 3
# - Automation triggers → presses reset button
# - ESP sets last_run = 0
# - ESP calculates next_run = tomorrow (if time passed)
# - Forecast shows correctly
#
# SCENARIO 2: Days mode changed to interval
# - User changes from "Selected Days" to "Every 3 Days"
# - Automation triggers → presses reset button
# - ESP sets last_run = 0
# - Fresh start for interval counting
#
# BENEFITS:
# - Always starts fresh when schedule enabled
# - No stale last_run dates
# - Predictable behavior
# - User expectation met
#
# ════════════════════════════════════════════════════════════════
