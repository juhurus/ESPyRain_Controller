  - id: get_schedule_last_run
    type: std::function<time_t(int)>
    initial_value: |-
      [](int sched_num) -> time_t {
        switch (sched_num) {
          case 1: return id(schedule_1_last_run);
          case 2: return id(schedule_2_last_run);
          case 3: return id(schedule_3_last_run);
          case 4: return id(schedule_4_last_run);
          case 5: return id(schedule_5_last_run);
          case 6: return id(schedule_6_last_run);
          case 7: return id(schedule_7_last_run);
          case 8: return id(schedule_8_last_run);
          default: return 0;
        }
      }

  - id: set_schedule_last_run
    type: std::function<void(int, time_t)>
    initial_value: |-
      [](int sched_num, time_t ts) {
        switch (sched_num) {
          case 1: id(schedule_1_last_run) = ts; break;
          case 2: id(schedule_2_last_run) = ts; break;
          case 3: id(schedule_3_last_run) = ts; break;
          case 4: id(schedule_4_last_run) = ts; break;
          case 5: id(schedule_5_last_run) = ts; break;
          case 6: id(schedule_6_last_run) = ts; break;
          case 7: id(schedule_7_last_run) = ts; break;
          case 8: id(schedule_8_last_run) = ts; break;
        }
      }

  - id: get_local_midnight
    type: std::function<time_t(time_t)>
    initial_value: |-
      [](time_t ts) -> time_t {
        if (ts <= 0) return 0;
        auto local_time = ESPTime::from_epoch_local(ts);
        if (!local_time.is_valid()) return 0;
        return ts - (local_time.hour * 3600 + local_time.minute * 60 + local_time.second);
      }

  - id: is_schedule_temporarily_blocked_for_time
    type: std::function<bool(time_t)>
    initial_value: |-
      [](time_t target_ts) -> bool {
        auto now = id(esp_time).now();
        auto target_time = ESPTime::from_epoch_local(target_ts);
        if (!now.is_valid() || !target_time.is_valid()) return false;

        if (id(system_master_enable) == 0) return true;

        int rain_delay = (int)id(rain_delay_days);
        if (rain_delay <= 0) return false;

        time_t now_midnight = id(get_local_midnight)(now.timestamp);
        time_t target_midnight = id(get_local_midnight)(target_ts);
        if (now_midnight == 0 || target_midnight == 0) return false;

        int64_t day_offset = (int64_t)(target_midnight - now_midnight) / 86400;
        if (day_offset < 0) return true;

        return day_offset < rain_delay;
      }

  - id: schedule_matches_candidate
    type: std::function<bool(int, time_t, time_t, bool, bool)>
    initial_value: |-
      [](int sched_num, time_t candidate_ts, time_t reference_last_run, bool allow_interval_same_day_bypass, bool apply_temporary_blocks) -> bool {
        if (sched_num < 1 || sched_num > (int)id(num_schedules)) return false;
        if (!id(get_schedule_enabled)(sched_num)) return false;

        auto candidate_time = ESPTime::from_epoch_local(candidate_ts);
        if (!candidate_time.is_valid()) return false;

        uint8_t sched_hour = id(get_schedule_hour)(sched_num);
        uint8_t sched_minute = id(get_schedule_minute)(sched_num);
        if (candidate_time.hour != sched_hour || candidate_time.minute != sched_minute) return false;

        if (apply_temporary_blocks && id(is_schedule_temporarily_blocked_for_time)(candidate_ts)) return false;

        uint8_t day_mode = id(get_schedule_day_mode_type)(sched_num);
        uint8_t days_bitmask = id(get_schedule_days_bitmask)(sched_num);
        uint8_t interval_val = id(get_schedule_interval)(sched_num);
        if (interval_val < 1) interval_val = 1;

        time_t candidate_midnight = id(get_local_midnight)(candidate_ts);
        if (candidate_midnight == 0) return false;

        bool day_matches = false;

        switch (day_mode) {
          case 0:
            day_matches = true;
            break;

          case 1:
          case 5:
          {
            uint8_t weekday = candidate_time.day_of_week;
            uint8_t bitmask_bit = (weekday == 1) ? 6 : (weekday - 2);
            day_matches = (days_bitmask & (1 << bitmask_bit)) != 0;
            break;
          }

          case 2:
          {
            if (reference_last_run == 0) {
              day_matches = true;
            } else {
              time_t last_midnight = id(get_local_midnight)(reference_last_run);
              if (last_midnight == 0) {
                day_matches = true;
              } else {
                int64_t days_since = (int64_t)(candidate_midnight - last_midnight) / 86400;
                day_matches = (days_since >= interval_val);
              }
            }
            break;
          }

          case 3:
            day_matches = (candidate_time.day_of_month % 2 == 1);
            break;

          case 4:
            day_matches = (candidate_time.day_of_month % 2 == 0);
            break;

          default:
            ESP_LOGW("schedule_logic", "Unknown day_mode %d for schedule %d", day_mode, sched_num);
            break;
        }

        if (!day_matches) {
          if (day_mode == 2 && allow_interval_same_day_bypass && (id(bypass_interval_check) != 0) && reference_last_run > 0) {
            time_t last_midnight = id(get_local_midnight)(reference_last_run);
            if (last_midnight == candidate_midnight) {
              day_matches = true;
              ESP_LOGI("schedule_logic", "Bypass: allowing same-day rerun for schedule %d", sched_num);
            }
          }
          if (!day_matches) return false;
        }

        if (reference_last_run > 0) {
          time_t last_midnight = id(get_local_midnight)(reference_last_run);
          if (last_midnight == candidate_midnight && (id(bypass_interval_check) == 0) && day_mode != 2) {
            return false;
          }
        }

        return true;
      }
  - id: queue_schedule_run
    type: std::function<bool(int)>
    initial_value: |-
      [](int sched_num) -> bool {
        if (sched_num < 1 || sched_num > (int)id(num_schedules)) {
          ESP_LOGW("schedule", "Invalid schedule %d", sched_num);
          return false;
        }

        if (!id(get_schedule_enabled)(sched_num)) {
          ESP_LOGW("schedule", "Schedule %d is disabled", sched_num);
          return false;
        }

        uint16_t station_mask = id(get_schedule_station_mask)(sched_num);
        uint8_t soak = id(get_schedule_soak)(sched_num);
        uint8_t seasonal_pct = id(get_schedule_seasonal_adj)(sched_num);
        float seasonal = seasonal_pct / 100.0f;
        std::string sched_name = id(get_schedule_name)(sched_num);

        std::vector<int> cycle_stations;
        std::vector<uint32_t> cycle_durations;
        int num_active = (int)id(num_stations);

        ESP_LOGI("schedule", "Queueing Schedule %d (%s)", sched_num, sched_name.c_str());
        ESP_LOGI("schedule", "Seasonal: %.0f%%, soak repeat count: %d",
                 seasonal * 100.0f, (int)soak + 1);

        for (int i = 1; i <= num_active; i++) {
          if ((station_mask & (1 << (i - 1))) == 0) continue;
          if (!id(get_station_enabled)(i)) continue;
          if (id(is_station_coupled_to_another)(i)) {
            ESP_LOGI("schedule", "  Skipped: S%d - coupled to another station", i);
            continue;
          }

          uint8_t runtime_min = id(get_station_runtime)(i);
          uint32_t base_runtime_sec = (uint32_t)(runtime_min * seasonal * 60.0f);
          if (base_runtime_sec < 1) base_runtime_sec = 1;

          uint32_t cycle_count = (uint32_t)soak + 1;
          uint32_t runtime_sec = (base_runtime_sec + cycle_count - 1) / cycle_count;
          if (runtime_sec < 1) runtime_sec = 1;

          cycle_stations.push_back(i);
          cycle_durations.push_back(runtime_sec);

          std::string stn_name = id(get_station_name)(i);
          ESP_LOGI("schedule", "  Cycle: S%d (%s) - %d min * %.0f%% = %d sec",
                   i, stn_name.c_str(), runtime_min, seasonal * 100.0f, runtime_sec);
        }

        if (cycle_stations.empty()) {
          ESP_LOGW("schedule", "Schedule %d has no runnable stations", sched_num);
          return false;
        }

        int rest_seconds = (soak > 0) ? ((int)id(soak_rest_minutes) * 60) : 0;
        int repeat_count = (int)soak + 1;
        int items_to_add = (int)(cycle_stations.size() * repeat_count);
        int existing_items = id(is_running) ? (int)id(queue_tracker).size() : 0;
        int max_items = (int)id(max_queue_items);

        if ((existing_items + items_to_add) > max_items) {
          char msg[220];
          snprintf(msg, sizeof(msg), "Queue limit reached (%d items). Schedule %d (%s) would add %d item(s), so it was not queued.",
                   max_items, sched_num, sched_name.c_str(), items_to_add);
          ESP_LOGW("schedule", "%s", msg);
          id(publish_controller_event)("queue_limit_reached", std::string(msg));
          return false;
        }

        if (!id(is_running)) {
          id(queue_tracker).clear();
          id(queue_durations).clear();
          id(queue_schedule_sources).clear();
          id(queue_cycle_breaks).clear();
          id(queue_index) = -1;
          id(current_station) = 0;
          id(current_valve_runtime) = 0;
          id(time_remaining) = 0;
          id(queue_total_time_initial) = 0;
          id(total_queue_time_remaining) = 0;
          id(is_running) = true;
          id(is_paused) = false;
          id(paused_timestamp) = 0;
          id(soak_resting) = false;
          id(soak_rest_remaining) = 0;
          id(master_reprime_pending) = false;
        }

        uint32_t added_time = 0;

        for (int cycle = 0; cycle < repeat_count; cycle++) {
          for (size_t j = 0; j < cycle_stations.size(); j++) {
            id(queue_tracker).push_back(cycle_stations[j]);
            id(queue_durations).push_back(cycle_durations[j]);
            id(queue_schedule_sources).push_back(sched_num);
            id(queue_cycle_breaks).push_back(false);
            added_time += cycle_durations[j];
          }

          if (cycle < (repeat_count - 1) && !id(queue_cycle_breaks).empty()) {
            id(queue_cycle_breaks).back() = (rest_seconds > 0);
            added_time += (uint32_t)rest_seconds;
          }
        }

        id(queue_total_time_initial) += (int)added_time;
        id(total_queue_time_remaining) += (int)added_time;

        ESP_LOGI("schedule", "Queued %d item(s) for schedule %d, added %u sec, queue size now %d",
                 (int)(cycle_stations.size() * repeat_count), sched_num, added_time,
                 (int)id(queue_tracker).size());

        if (id(current_schedule_number) == 0 && id(current_station) == 0 && !id(soak_resting)) {
          id(current_schedule_number) = sched_num;
        }

        if (id(queue_index) < 0 && id(current_station) == 0 && !id(soak_resting)) {
          id(run_next_station).execute();
        }

        return true;
      }

  # ================================================================
  # ================================================================
  # calculate_next_7_runs -- Finds the next 7 future timestamps
  # using the same scheduling rules as the live controller.
  # Includes temporary schedule blocks such as rain delay and
  # winter mode so HA forecast sensors match actual ESP behavior.
  # ================================================================
  - id: calculate_next_7_runs
    type: std::function<void(int)>
    initial_value: |-
      [](int sched_num) {
        auto now = id(esp_time).now();
        if (!now.is_valid()) return;

        std::vector<time_t>* next_runs = nullptr;
        switch (sched_num) {
          case 1: next_runs = &id(schedule_1_next_runs); break;
          case 2: next_runs = &id(schedule_2_next_runs); break;
          case 3: next_runs = &id(schedule_3_next_runs); break;
          case 4: next_runs = &id(schedule_4_next_runs); break;
          case 5: next_runs = &id(schedule_5_next_runs); break;
          case 6: next_runs = &id(schedule_6_next_runs); break;
          case 7: next_runs = &id(schedule_7_next_runs); break;
          case 8: next_runs = &id(schedule_8_next_runs); break;
          default: return;
        }

        next_runs->clear();
        next_runs->resize(7, 0);

        if (!id(get_schedule_enabled)(sched_num)) {
          ESP_LOGD("next_runs", "Schedule %d disabled, no runs calculated", sched_num);
          return;
        }

        uint8_t sched_hour = id(get_schedule_hour)(sched_num);
        uint8_t sched_minute = id(get_schedule_minute)(sched_num);
        time_t now_ts = now.timestamp;
        time_t now_midnight = id(get_local_midnight)(now_ts);
        time_t simulated_last_run = id(get_schedule_last_run)(sched_num);
        int found = 0;

        for (int days_ahead = 0; days_ahead < 365 && found < 7; days_ahead++) {
          time_t target_midnight = now_midnight + ((time_t)days_ahead * 86400);
          time_t target_ts = target_midnight + (sched_hour * 3600) + (sched_minute * 60);

          if (target_ts <= now_ts) continue;

          if (!id(schedule_matches_candidate)(sched_num, target_ts, simulated_last_run, false, true)) {
            continue;
          }

          (*next_runs)[found] = target_ts;
          simulated_last_run = target_ts;
          found++;
        }

        if (found > 0) {
          auto first_run = ESPTime::from_epoch_local((*next_runs)[0]);
          ESP_LOGI("next_runs", "Schedule %d: %d runs found. Next: %04d-%02d-%02d %02d:%02d",
                   sched_num, found,
                   first_run.year, first_run.month, first_run.day_of_month,
                   first_run.hour, first_run.minute);
        } else {
          ESP_LOGW("next_runs", "Schedule %d: no upcoming runs found in 365-day search", sched_num);
        }
      }

