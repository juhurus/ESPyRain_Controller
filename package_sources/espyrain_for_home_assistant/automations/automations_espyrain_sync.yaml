# ============================================================
# SOAK MAPPING (ESP uses soak+1 for total passes):
#   No Soak = 0, 2x Soak = 1, 3x Soak = 2, 4x Soak = 3, 5x Soak = 4
#
# BITMASK: Mon=1, Tue=2, Wed=4, Thu=8, Fri=16, Sat=32, Sun=64
#
# DAY MODE: 0=Daily, 1=Selected Days, 2=Interval,
#           3=Odd Days, 4=Even Days, 5=Weekdays/Weekends
#
# ============================================================
# SCHEDULE 1 SYNCS
# ============================================================

# ================================================================
# SCHEDULE 1 - Time Sync
# ================================================================
- id: espyrain_sync_schedule_1_time
  alias: "ESPyRain: Sync Schedule 1 Time"
  description: "Sync schedule 1 start time from HA input_datetime to ESP hour/minute numbers"
  trigger:
    - platform: state
      entity_id: input_datetime.espyrain_schedule_1_time
  condition:
    - condition: template
      value_template: >
        {{ state_attr('input_datetime.espyrain_schedule_1_time', 'hour') is not none }}
  action:
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_1_hour
      data:
        value: "{{ state_attr('input_datetime.espyrain_schedule_1_time', 'hour') }}"
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_1_minute
      data:
        value: "{{ state_attr('input_datetime.espyrain_schedule_1_time', 'minute') }}"
  mode: single

# ================================================================
# SCHEDULE 1 - Day Mode + Bitmask + Interval Sync
# ================================================================
- id: espyrain_sync_schedule_1_days
  alias: "ESPyRain: Sync Schedule 1 Days"
  description: "Sync day_mode, days_bitmask, and interval from HA dropdown/booleans to ESP"
  trigger:
    - platform: state
      entity_id: input_select.espyrain_schedule_1_days
    - platform: state
      entity_id:
        - input_boolean.espyrain_schedule_1_monday
        - input_boolean.espyrain_schedule_1_tuesday
        - input_boolean.espyrain_schedule_1_wednesday
        - input_boolean.espyrain_schedule_1_thursday
        - input_boolean.espyrain_schedule_1_friday
        - input_boolean.espyrain_schedule_1_saturday
        - input_boolean.espyrain_schedule_1_sunday
  condition:
    - condition: template
      value_template: >
        {{ states('input_select.espyrain_schedule_1_days') not in ['unknown', 'unavailable'] }}
  action:
    - variables:
        days_mode: "{{ states('input_select.espyrain_schedule_1_days') }}"
    # Set day_mode_type on ESP
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_1_day_mode
      data:
        value: >
          {% if days_mode == 'Daily' %}0
          {% elif days_mode == 'Selected Days' %}1
          {% elif 'Every' in days_mode %}2
          {% elif 'Odd' in days_mode %}3
          {% elif 'Even' in days_mode %}4
          {% elif 'Weekdays' in days_mode or 'Weekends' in days_mode %}5
          {% else %}0{% endif %}
    # Set days_bitmask on ESP
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_1_days_bitmask
      data:
        value: >
          {% if days_mode in ['Daily'] or 'Odd' in days_mode or 'Even' in days_mode %}127
          {% elif days_mode == 'Selected Days' %}
            {{ (1 if is_state('input_boolean.espyrain_schedule_1_monday','on') else 0) +
               (2 if is_state('input_boolean.espyrain_schedule_1_tuesday','on') else 0) +
               (4 if is_state('input_boolean.espyrain_schedule_1_wednesday','on') else 0) +
               (8 if is_state('input_boolean.espyrain_schedule_1_thursday','on') else 0) +
               (16 if is_state('input_boolean.espyrain_schedule_1_friday','on') else 0) +
               (32 if is_state('input_boolean.espyrain_schedule_1_saturday','on') else 0) +
               (64 if is_state('input_boolean.espyrain_schedule_1_sunday','on') else 0) }}
          {% elif 'Weekdays' in days_mode %}31
          {% elif 'Weekends' in days_mode %}96
          {% else %}0{% endif %}
    # Set interval on ESP (only meaningful for Every X Days mode)
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_1_interval
      data:
        value: >
          {% if 'Every 2' in days_mode %}2
          {% elif 'Every 3' in days_mode %}3
          {% elif 'Every 4' in days_mode %}4
          {% elif 'Every 5' in days_mode %}5
          {% elif 'Every 6' in days_mode %}6
          {% elif 'Every 7' in days_mode %}7
          {% else %}1{% endif %}

  mode: single

# ================================================================
# SCHEDULE 1 - Station Mask Sync
# ================================================================
- id: espyrain_sync_schedule_1_station_mask
  alias: "ESPyRain: Sync Schedule 1 Station Mask"
  description: "Calculate 16-bit station bitmask from individual station booleans and sync to ESP"
  trigger:
    - platform: state
      entity_id:
        - input_boolean.espyrain_schedule_1_station_1
        - input_boolean.espyrain_schedule_1_station_2
        - input_boolean.espyrain_schedule_1_station_3
        - input_boolean.espyrain_schedule_1_station_4
        - input_boolean.espyrain_schedule_1_station_5
        - input_boolean.espyrain_schedule_1_station_6
        - input_boolean.espyrain_schedule_1_station_7
        - input_boolean.espyrain_schedule_1_station_8
        - input_boolean.espyrain_schedule_1_station_9
        - input_boolean.espyrain_schedule_1_station_10
        - input_boolean.espyrain_schedule_1_station_11
        - input_boolean.espyrain_schedule_1_station_12
        - input_boolean.espyrain_schedule_1_station_13
        - input_boolean.espyrain_schedule_1_station_14
        - input_boolean.espyrain_schedule_1_station_15
        - input_boolean.espyrain_schedule_1_station_16
  condition:
    - condition: template
      value_template: >
        {{
          trigger.from_state is not none and
          trigger.to_state is not none and
          trigger.from_state.state in ['on', 'off'] and
          trigger.to_state.state in ['on', 'off']
        }}
  action:
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_1_station_mask
      data:
        value: >
          {% set ns = namespace(mask=0) %}
          {% for i in range(1, 17) %}
            {% if is_state('input_boolean.espyrain_schedule_1_station_' ~ i, 'on') %}
              {% set ns.mask = ns.mask + 2**(i-1) %}
            {% endif %}
          {% endfor %}
          {{ ns.mask }}
  mode: single

# ================================================================
# SCHEDULE 1 - Soak Cycles Sync
# ================================================================
- id: espyrain_sync_schedule_1_soak
  alias: "ESPyRain: Sync Schedule 1 Soak Cycles"
  description: "Map soak cycle text selection to ESP number (No Soak=0, 2x=1, 3x=2, 4x=3, 5x=4)"
  trigger:
    - platform: state
      entity_id: input_select.espyrain_schedule_1_soak_cycles
  condition:
    - condition: template
      value_template: >
        {{ states('input_select.espyrain_schedule_1_soak_cycles') not in ['unknown', 'unavailable'] }}
  action:
    - service: number.set_value
      target:
        entity_id: number.espyrain_controller_schedule_1_soak_cycles
      data:
        value: >
          {% set soak = states('input_select.espyrain_schedule_1_soak_cycles') %}
          {% if '2x' in soak %}1
          {% elif '3x' in soak %}2
          {% elif '4x' in soak %}3
          {% elif '5x' in soak %}4
          {% else %}0{% endif %}
  mode: single

