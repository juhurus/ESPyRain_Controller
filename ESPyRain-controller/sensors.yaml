text_sensor:
  - platform: template
    name: "ESPyRain Controller Version"
    id: espyrain_controller_version
    lambda: |-
      return std::string("v${version}");
      
  - platform: version
    name: "ESPHome Version"
       
    # Updated version number
  - platform: template
    name: "Firmware Version"
    id: firmware_version
    icon: mdi:chip
    lambda: |-
      return {"v${version}"};  
    # Uses substitution - auto-updates!

  - platform: template
    name: "ESP Date Time"
    id: esp_date_time
    icon: mdi:clock-digital
    update_interval: 5s
    lambda: |-
      auto now = id(esp_time).now();
      if (!now.is_valid()) return std::string("Time Unavailable");
      char buf[24];
      snprintf(buf, sizeof(buf), "%04d-%02d-%02d %02d:%02d:%02d",
               now.year, now.month, now.day_of_month,
               now.hour, now.minute, now.second);
      return std::string(buf);

  # UPDATE: Connection Status (now shows heartbeat age)
  - platform: template
    name: "Connection Status"
    id: connection_status
    icon: mdi:connection
    lambda: |-
      bool wifi_ok = network::is_connected();
      bool has_heartbeat = id(last_heartbeat_time) > 0;
      float heartbeat_age = has_heartbeat
        ? (millis() - id(last_heartbeat_time)) / 1000.0f
        : 0.0f;
      bool ha_ok = has_heartbeat && heartbeat_age <= (float)id(heartbeat_timeout_seconds);
      
      if (wifi_ok && ha_ok) {
        char buffer[50];
        sprintf(buffer, "Connected (HB: %.0fs ago)", heartbeat_age);
        return {buffer};
      } else if (!wifi_ok) {
        return {"WiFi Lost"};
      } else if (has_heartbeat) {
        char buffer[50];
        if (id(ha_last_disconnected_time) > 0) {
          uint32_t elapsed_ms = millis() - id(ha_last_disconnected_time);
          float hours = elapsed_ms / 3600000.0f;
          sprintf(buffer, "HA Lost (%.1fh)", hours);
        } else {
          sprintf(buffer, "HA Lost (HB: %.0fs ago)", heartbeat_age);
        }
        return {buffer};
      } else {
        return {"Waiting for HA heartbeat"};
      }
    update_interval: 2s

  # WiFi Info
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address
    ssid:
      name: "WiFi SSID"
      id: wifi_ssid
    bssid:
      name: "WiFi BSSID"
      id: wifi_bssid
      
  - platform: template
    name: "Status"
    id: espyrain_status
    icon: mdi:information-outline
    update_interval: 1s
    lambda: |-
      if (!id(is_running)) return std::string("Idle");
      if (id(is_paused)) return std::string("Paused");
      if (id(soak_resting)) return std::string("Soak Resting");
      int sched = id(current_schedule_number);
      if (sched > 0) {
        char buf[32];
        snprintf(buf, sizeof(buf), "Running Schedule %d", sched);
        return std::string(buf);
      }
      return std::string("Running");

  - platform: template
    name: "Current Run Type"
    id: current_run_type_sensor
    icon: mdi:source-branch
    update_interval: 1s
    lambda: |-
      if (!id(is_running)) return std::string("Idle");
      if (id(soak_resting)) return std::string("Soak Rest");
      return (id(current_schedule_number) > 0)
        ? std::string("Scheduled")
        : std::string("Manual");

  - platform: template
    name: "Active Station"
    id: active_station_sensor
    icon: mdi:sprinkler
    update_interval: 1s
    lambda: |-
      if (!id(is_running)) return std::string("None");
      if (id(current_station) > 0) {
        return id(get_station_name)(id(current_station));
      }
      return std::string("None");

  - platform: template
    name: "Queue"
    id: queue_sensor
    icon: mdi:format-list-numbered
    update_interval: 1s
    lambda: |-
      if (!id(is_running)) return std::string("Idle");
      std::string result;
      int idx = id(queue_index);
      for (int i = 0; i < (int)id(queue_tracker).size(); i++) {
        if (i > 0) result += " > ";
        char s[8];
        if (!id(soak_resting) && i == idx) {
          snprintf(s, sizeof(s), "[S%d]", id(queue_tracker)[i]);
        } else {
          snprintf(s, sizeof(s), "S%d", id(queue_tracker)[i]);
        }
        result += s;
      }
      return result.empty() ? std::string("Running") : result;

  - platform: template
    name: "Queue State"
    id: queue_state_sensor
    icon: mdi:timeline-text-outline
    update_interval: 1s
    lambda: |-
      if (!id(is_running)) return std::string("Idle");
      if (id(is_paused)) return std::string("Paused");
      if (id(soak_resting)) {
        char buf[48];
        int rest_min = id(soak_rest_remaining) / 60;
        int rest_sec = id(soak_rest_remaining) % 60;
        snprintf(buf, sizeof(buf), "Soak Rest %d:%02d", rest_min, rest_sec);
        return std::string(buf);
      }
      return std::string("Running");

  - platform: template
    name: "Station Time Remaining Formatted"
    id: station_time_remaining_formatted
    icon: mdi:timer-outline
    update_interval: 1s
    lambda: |-
      int t = id(time_remaining);
      if (t < 0) t = 0;
      int h = t / 3600;
      int m = (t % 3600) / 60;
      int s = t % 60;
      char buf[12];
      snprintf(buf, sizeof(buf), "%02d:%02d:%02d", h, m, s);
      return std::string(buf);

  - platform: template
    name: "Total Queue Time Remaining Formatted"
    id: total_queue_time_remaining_formatted
    icon: mdi:timer-sand
    update_interval: 1s
    lambda: |-
      int t = id(total_queue_time_remaining);
      if (t < 0) t = 0;
      int h = t / 3600;
      int m = (t % 3600) / 60;
      int s = t % 60;
      char buf[12];
      snprintf(buf, sizeof(buf), "%02d:%02d:%02d", h, m, s);
      return std::string(buf);

